            {pinCode ? "Code actif — il sera demandé à chaque ouverture de l'appli." : "Aucun code actif pour le moment."}
          </p>
        </div>
      </div>
    </div>
  );
}

// ---------- Heures supplémentaires (weekly breakdown) ----------
function HeuresSup({ employees, entries, heuresSup }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  // Regroupe les heures par salarié puis par semaine (lundi) — effectives ET payées séparément
  const data = useMemo(() => {
    const byEmp = {};
    entries
      .filter((e) => e.present && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = weekStart(e.date);
        if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
        if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
        byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
        byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    return byEmp;
  }, [entries, start, end]);

  const rate = (emp) => Number(emp.tauxHoraire) || 0;

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Heures supplémentaires — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> Exporter PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Seuils calculés sur les <strong>heures effectivement travaillées</strong> (pas les heures payées) : normal
        jusqu'à {heuresSup.seuilNormal}h/semaine, majoration {heuresSup.tauxMajo1}% de{" "}
        {heuresSup.seuilNormal + 1}h à {heuresSup.seuilMajo2}h effectuées, puis {heuresSup.tauxMajo2}% au-delà.
        Réglable dans Paramètres.
      </p>

      {employees.length === 0 && <EmptyState text="Aucun salarié." />}

      <div className="space-y-4">
        {employees.map((emp) => {
          const weeks = data[emp.id];
          if (!weeks) return null;
          const weekKeys = Object.keys(weeks).sort();
          return (
            <div key={emp.id} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
              <div className="px-4 py-2.5 font-medium" style={{ background: PALETTE.bg, borderBottom: `1px solid ${PALETTE.line}` }}>
                {emp.nom}
              </div>
              {weekKeys.map((wk, i) => {
                const { eff, paye } = weeks[wk];
                const { normales, majo1, majo2 } = splitOvertime(eff, heuresSup);
                const extraPaye = Math.max(0, paye - eff);
                const r = rate(emp);
                const cost = r
                  ? normales * r +
                    majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
                    majo2 * r * (1 + heuresSup.tauxMajo2 / 100) +
                    extraPaye * r
                  : null;
                return (
                  <div
                    key={wk}
                    className="px-4 py-2.5 text-sm flex items-center justify-between flex-wrap gap-2"
                    style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
                  >
                    <span style={{ color: "#6B6552" }}>{weekLabel(wk)}</span>
                    <span className="flex gap-3 flex-wrap">
                      <span>Normales : <strong>{fmtHours(normales)}</strong></span>
                      {majo1 > 0 && (
                        <span style={{ color: PALETTE.rust }}>
                          +{heuresSup.tauxMajo1}% : <strong>{fmtHours(majo1)}</strong>
                        </span>
                      )}
                      {majo2 > 0 && (
                        <span style={{ color: PALETTE.rust }}>
                          +{heuresSup.tauxMajo2}% : <strong>{fmtHours(majo2)}</strong>
                        </span>
                      )}
                      {extraPaye > 0 && (
                        <span style={{ color: "#8A8271" }}>
                          + payé hors travail effectif : <strong>{fmtHours(extraPaye)}</strong>
                        </span>
                      )}
                      {cost !== null && (
                        <span style={{ color: PALETTE.green }}>≈ {cost.toFixed(2)} €</span>
                      )}
                    </span>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Simulation de paie (brut estimé + avances/acomptes/prêts) ----------
function SimulationPaie({ employees, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  // Brut estimé par salarié : regroupement par semaine ISO, avec majorations
  const bruts = useMemo(() => {
    const byEmp = {};
    entries
      .filter((e) => e.present && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = weekStart(e.date);
        if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
        if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
        byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
        byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    const result = {};
    for (const [empId, weeks] of Object.entries(byEmp)) {
      let normales = 0,
        majo1 = 0,
        majo2 = 0,
        extraPaye = 0;
      Object.values(weeks).forEach(({ eff, paye }) => {
        const s = splitOvertime(eff, heuresSup);
        normales += s.normales;
        majo1 += s.majo1;
        majo2 += s.majo2;
        extraPaye += Math.max(0, paye - eff);
      });
      result[empId] = { normales, majo1, majo2, extraPaye };
    }
    return result;
  }, [entries, start, end, heuresSup]);

  // Avances/acomptes/prêts/remboursements de la période, par salarié
  const mouvements = useMemo(() => {
    const byEmp = {};
    transactions
      .filter((t) => t.date >= start && t.date <= end)
      .forEach((t) => {
        if (!byEmp[t.employeeId]) byEmp[t.employeeId] = { avance: 0, acompte: 0, pret: 0, remboursement: 0, loyer: 0 };
        byEmp[t.employeeId][t.type] += t.montant;
      });
    return byEmp;
  }, [transactions, start, end]);

  // Primes de la période, par salarié
  const primesParEmp = useMemo(() => {
    const byEmp = {};
    primes
      .filter((p) => p.date >= start && p.date <= end)
      .forEach((p) => {
        byEmp[p.employeeId] = (byEmp[p.employeeId] || 0) + p.montant;
      });
    return byEmp;
  }, [primes, start, end]);

  const rate = (emp) => Number(emp.tauxHoraire) || 0;

  const lignes = employees.map((emp) => {
    const b = bruts[emp.id] || { normales: 0, majo1: 0, majo2: 0, extraPaye: 0 };
    const r = rate(emp);
    const brut = r
      ? b.normales * r +
        b.majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
        b.majo2 * r * (1 + heuresSup.tauxMajo2 / 100) +
        b.extraPaye * r
      : 0;
    const conges = congesPayesMontant(emp, entries, heuresDefaut, start, end);
    // Les indemnités de congés payés sont soumises aux cotisations, comme le salaire normal
    const cotisations = (brut + conges.montant) * (Number(tauxCotisations) / 100);
    const m = mouvements[emp.id] || { avance: 0, acompte: 0, pret: 0, remboursement: 0, loyer: 0 };
    const loyerAuto = loyerPourPeriode(emp, start, end);
    const deductions = m.avance + m.acompte + m.remboursement + loyerAuto;
    const primesMontant = primesParEmp[emp.id] || 0;
    const net = brut - cotisations - deductions + primesMontant + conges.montant;
    return { emp, b, brut, cotisations, m, deductions, loyerAuto, conges, primesMontant, net };
  });

  const totalBrut = lignes.reduce((s, l) => s + l.brut, 0);
  const totalCotisations = lignes.reduce((s, l) => s + l.cotisations, 0);
  const totalDeductions = lignes.reduce((s, l) => s + l.deductions, 0);
  const totalPrimes = lignes.reduce((s, l) => s + l.primesMontant, 0);
  const totalNet = lignes.reduce((s, l) => s + l.net, 0);

  const exportCSV = () => {
    const rows = [
      [
        "Salarié",
        "Heures normales",
        "Heures majo 1",
        "Heures majo 2",
        "Brut estimé (€)",
        "Cotisations salariales (€)",
        "Avances/acomptes/remboursements période (€)",
        "Net estimé (€)",
      ],
    ];
    lignes.forEach((l) => {
      rows.push([
        l.emp.nom,
        l.b.normales.toFixed(2),
        l.b.majo1.toFixed(2),
        l.b.majo2.toFixed(2),
        l.brut.toFixed(2),
        l.cotisations.toFixed(2),
        l.deductions.toFixed(2),
        l.net.toFixed(2),
      ]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `simulation_paie_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Simulation de paie — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> CSV
        </button>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Estimation indicative à partir des heures pointées, du taux horaire de chaque salarié et des seuils
        d'heures sup réglés dans Paramètres. Le net déduit un taux de cotisations sociales estimé ({tauxCotisations}%,
        réglable dans Paramètres) ainsi que les avances/acomptes de la période — ceci reste indicatif, pas une
        fiche de paie officielle.
      </p>

      <div className="space-y-2">
        {lignes.map(({ emp, b, brut, cotisations, m, deductions, loyerAuto, conges, primesMontant, net }) => {
          const hasRate = Number(emp.tauxHoraire) > 0;
          return (
            <div
              key={emp.id}
              style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
              className="rounded-md p-3"
            >
              <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                <span className="font-medium">{emp.nom}</span>
                <span className="font-semibold" style={{ color: PALETTE.green }}>

                </span>
              </div>
              {!hasRate ? (
                <div className="text-xs" style={{ color: PALETTE.rust }}>
                  Aucun taux horaire renseigné (onglet Salariés) — impossible d'estimer le brut.
                  {primesMontant > 0 && ` Primes de la période : ${fmtEuros(primesMontant)}.`}
                </div>
              ) : (
                <div className="text-xs space-y-1" style={{ color: "#6B6552" }}>
                  <div style={{ color: "#8A8271" }}>
                    Heures : {fmtHours(b.normales)} normales
                    {b.majo1 > 0 ? ` · +${heuresSup.tauxMajo1}% ${fmtHours(b.majo1)}` : ""}
                    {b.majo2 > 0 ? ` · +${heuresSup.tauxMajo2}% ${fmtHours(b.majo2)}` : ""}
                    {b.extraPaye > 0 ? ` · +${fmtHours(b.extraPaye)} payées hors travail effectif` : ""}
                  </div>
                  <div className="flex justify-between pt-1" style={{ borderTop: `1px solid ${PALETTE.line}` }}>

// ---------- Absences par salarié ----------
function Absences({ employees, entries }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  const filtered = entries.filter((e) => e.date >= start && e.date <= end);

  // Jours où au moins un pointage a été fait (pour ne pas compter les jours non travaillés), hors week-ends
  const joursPointes = useMemo(() => {
    const set = new Set(filtered.map((e) => e.date));
    return Array.from(set)
      .filter((d) => !isWeekend(d) && !isJourFerie(d))
      .sort();
  }, [filtered]);

  // Pour chaque salarié : liste des jours pointés où il n'était pas présent
  const absences = useMemo(() => {
    const byEmp = {};
    employees.forEach((emp) => {
      const list = [];
      joursPointes.forEach((date) => {
        const entry = filtered.find((e) => e.date === date && e.employeeId === emp.id);
        const present = entry ? entry.present : false;
        if (!present) {
          list.push({ date, motif: entry?.motif || "Non pointé" });
        }
      });
      byEmp[emp.id] = list;
    });
    return byEmp;
  }, [employees, joursPointes, filtered]);

  const exportCSV = () => {
    const rows = [["Salarié", "Date", "Motif"]];
    employees.forEach((emp) => {
      (absences[emp.id] || []).forEach((a) => {
        rows.push([emp.nom, a.date, a.motif]);
      });
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `absences_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Absences — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> CSV
        </button>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Compte les jours où du pointage a eu lieu ({joursPointes.length} jour(s) sur la période) et où le salarié
        n'était pas marqué présent. Un salarié jamais pointé sur un jour où d'autres l'ont été apparaît comme «
        Non pointé ».
      </p>

      <div className="space-y-2">
        {employees.map((emp) => {
          const list = absences[emp.id] || [];
          return (
            <div key={emp.id} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
              <div className="px-4 py-2.5 flex items-center justify-between" style={{ background: PALETTE.bg }}>
                <span className="font-medium">{emp.nom}</span>
                <span
                  className="text-sm font-semibold"
                  style={{ color: list.length > 0 ? PALETTE.rust : "#8A8271" }}
                >
                  {list.length} absence{list.length > 1 ? "s" : ""}
                </span>
              </div>
              {list.length > 0 && (
                <div className="px-4 py-2 text-xs space-y-1">
                  {list.map((a) => (
                    <div key={a.date} className="flex justify-between" style={{ color: "#6B6552" }}>
                      <span>{fmtDateLong(a.date)}</span>
                      <span style={{ color: a.motif === "Non pointé" ? "#B5AA88" : PALETTE.rust }}>{a.motif}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Congés & absences (déclaration multi-jours + solde CP) ----------
function CongesAbsences({ employees, updateEmployees, entries, updateEntries, taches }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [motif, setMotif] = useState(ABSENCE_MOTIFS[0]);
  const [debut, setDebut] = useState(todayISO());
  const [fin, setFin] = useState(todayISO());
  const [filterEmp, setFilterEmp] = useState("all");
  const [msg, setMsg] = useState("");

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  // Liste des dates (jours ouvrés, hors week-ends) entre début et fin inclus
  const datesRange = (d1, d2) => {
    const dates = [];
    let cur = new Date(d1 + "T00:00:00");
    const last = new Date(d2 + "T00:00:00");
    while (cur <= last) {
      const iso = cur.toISOString().slice(0, 10);
      // Jours ouvrables : le samedi compte, dimanche et jours fériés sont exclus
      if (cur.getDay() !== 0 && !isJourFerie(iso)) dates.push(iso);
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  };

  const declarer = () => {
    if (!employeeId || !debut || !fin || debut > fin) return;
    const dates = datesRange(debut, fin);
    if (dates.length === 0) {
      setMsg("Aucun jour ouvré dans cette plage (uniquement des week-ends).");
      return;
    }
    // Retire toutes les entrées existantes de ce salarié sur ces dates (postes ou absence), puis pose l'absence
    let next = entries.filter((e) => !(e.employeeId === employeeId && dates.includes(e.date)));
    dates.forEach((date) => {
      next = [
        ...next,
        {
          id: uid(),
          date,
          employeeId,
          present: false,
          motif,
          heuresEffectives: 0,
          heuresPayees: 0,
          tache: taches[0],
          parcelle: "",
          note: "",
        },
      ];
    });
    updateEntries(next);
    setMsg(`${dates.length} jour(s) enregistré(s) en « ${motif} ».`);
  };

  // Toutes les absences/congés explicitement déclarés (motif renseigné)
  const declarations = entries
    .filter((e) => !e.present && e.motif && (filterEmp === "all" || e.employeeId === filterEmp))
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const supprimer = (id) => {
    updateEntries(entries.filter((e) => e.id !== id));
  };

  const updateJoursAcquis = (empId, value) => {
    updateEmployees(employees.map((e) => (e.id === empId ? { ...e, joursCPAcquis: value } : e)));
  };

  // Solde congés payés par salarié : jours acquis (saisi manuellement) - jours de CP pris (tous temps)
  const soldesCP = employees.map((emp) => {
    const pris = entries.filter((e) => e.employeeId === emp.id && !e.present && e.motif === "Congé payé").length;
    const acquis = Number(emp.joursCPAcquis) || 0;
    return { emp, pris, acquis, solde: acquis - pris };
  });

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (

// ---------- Synthèse par salarié (tout regroupé pour une période) ----------
// ---------- Calcul des données de synthèse pour un salarié (réutilisé pour l'impression groupée) ----------
function computeSyntheseData(emp, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end) {
  const employeeId = emp.id;
  const joursPointes = Array.from(
    new Set(entries.filter((e) => e.date >= start && e.date <= end).map((e) => e.date))
  )
    .filter((d) => !isWeekend(d) && !isJourFerie(d))
    .sort();

  const entriesEmp = entries.filter((e) => e.employeeId === employeeId && e.date >= start && e.date <= end);
  const presences = entriesEmp.filter((e) => e.present);
  const totalEff = presences.reduce((s, e) => s + Number(e.heuresEffectives || 0), 0);
  const totalPaye = presences.reduce((s, e) => s + Number(e.heuresPayees ?? e.heuresEffectives ?? 0), 0);

  const weeks = {};
  presences.forEach((e) => {
    const wk = weekStart(e.date);
    if (!weeks[wk]) weeks[wk] = { eff: 0, paye: 0 };
    weeks[wk].eff += Number(e.heuresEffectives || 0);
    weeks[wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
  });
  let normales = 0,
    majo1 = 0,
    majo2 = 0,
    extraPaye = 0;
  Object.values(weeks).forEach(({ eff, paye }) => {
    const s = splitOvertime(eff, heuresSup);
    normales += s.normales;
    majo1 += s.majo1;
    majo2 += s.majo2;
    extraPaye += Math.max(0, paye - eff);
  });
  const heuresSupCalc = { normales, majo1, majo2, extraPaye };

  const parTacheMap = {};
  presences.forEach((e) => {
    if (!parTacheMap[e.tache]) parTacheMap[e.tache] = { eff: 0, paye: 0, jours: 0 };
    parTacheMap[e.tache].eff += Number(e.heuresEffectives || 0);
    parTacheMap[e.tache].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
    parTacheMap[e.tache].jours += 1;
  });
  const parTache = Object.entries(parTacheMap).sort((a, b) => b[1].paye - a[1].paye);

  const absences = joursPointes
    .filter((date) => {
      const entry = entries.find((e) => e.date === date && e.employeeId === employeeId);
      return !(entry && entry.present);
    })
    .map((date) => {
      const entry = entries.find((e) => e.date === date && e.employeeId === employeeId);
      return { date, motif: entry?.motif || "Non pointé" };
    });

  const mouvementsPeriode = transactions.filter((t) => t.employeeId === employeeId && t.date >= start && t.date <= end);
  const soldeTotal = transactions
    .filter((t) => t.employeeId === employeeId && t.type !== "loyer")
    .reduce((s, t) => s + (t.type === "remboursement" ? -t.montant : t.montant), 0);

  const r = Number(emp?.tauxHoraire) || 0;
  const brut = r
    ? heuresSupCalc.normales * r +
      heuresSupCalc.majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
      heuresSupCalc.majo2 * r * (1 + heuresSup.tauxMajo2 / 100) +
      heuresSupCalc.extraPaye * r
    : 0;
  const conges = congesPayesMontant(emp, entries, heuresDefaut, start, end);
  // Les indemnités de congés payés sont soumises aux cotisations, comme le salaire normal
  const cotisations = (brut + conges.montant) * (Number(tauxCotisations) / 100);
  const avancesPeriode = mouvementsPeriode.filter((t) => t.type === "avance").reduce((s, t) => s + t.montant, 0);
  const acomptesPeriode = mouvementsPeriode.filter((t) => t.type === "acompte").reduce((s, t) => s + t.montant, 0);
  const remboursementsPeriode = mouvementsPeriode.filter((t) => t.type === "remboursement").reduce((s, t) => s + t.montant, 0);
  const loyerPeriode = loyerPourPeriode(emp, start, end);
  const deductionsPeriode = avancesPeriode + acomptesPeriode + remboursementsPeriode + loyerPeriode;
  const primesPeriode = primes.filter((p) => p.employeeId === employeeId && p.date >= start && p.date <= end);
  const primesMontant = primesPeriode.reduce((s, p) => s + p.montant, 0);
  const net = brut - cotisations - deductionsPeriode + primesMontant + conges.montant;

  return {
    presences,
    totalEff,
    totalPaye,
    heuresSupCalc,
    parTache,
    absences,
    mouvementsPeriode,
    soldeTotal,
    r,
    brut,
    cotisations,
    avancesPeriode,
    acomptesPeriode,
    remboursementsPeriode,
    loyerPeriode,
    deductionsPeriode,
    primesPeriode,
    primesMontant,
    conges,
    net,
  };
}

function SyntheseSalarie({ employees, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut }) {

  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());
  const [batchPrint, setBatchPrint] = useState(false);

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  const emp = employees.find((e) => e.id === employeeId);

  // Salariés à afficher à l'écran : la sélection multiple si active, sinon le salarié choisi dans le menu
  const employeesAffiches = selectedIds.length > 0 ? employees.filter((e) => selectedIds.includes(e.id)) : emp ? [emp] : [];

  const toggleSelected = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const exportPDF = () => window.print();

  // Attend que le rendu de toutes les fiches soit bien affiché avant de lancer l'impression,
  // sinon le navigateur peut imprimer l'ancien état (un seul salarié) trop tôt.
  useEffect(() => {
    if (!batchPrint) return;
    const id1 = requestAnimationFrame(() => {
      const id2 = requestAnimationFrame(() => {
        window.print();
        setBatchPrint(false);
      });
      return () => cancelAnimationFrame(id2);
    });
    return () => cancelAnimationFrame(id1);
  }, [batchPrint]);

  const printAll = () => setBatchPrint(true);

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  // Salariés à imprimer en groupé : la sélection si active, sinon tous
  const employeesAImprimer = selectedIds.length > 0 ? employees.filter((e) => selectedIds.includes(e.id)) : employees;

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Synthèse salarié — Habitation Ressource</div>
      </div>

        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportPDF}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF (ce salarié)
        </button>
        <button
          onClick={printAll}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <FileText size={16} />{" "}
          {selectedIds.length > 0 ? `PDF (${selectedIds.length} sélectionné(s))` : "PDF (tous les salariés)"}
        </button>
      </div>

      <button onClick={() => setShowSelector((v) => !v)} className="text-xs underline mb-4 no-print" style={{ color: PALETTE.green }}>
        {showSelector ? "Masquer" : "Sélectionner plusieurs salariés"}
      </button>

      {showSelector && (
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3 mb-4 no-print">
          <div className="flex flex-wrap gap-2 mb-2">
            {employees.map((e) => {
              const checked = selectedIds.includes(e.id);
              return (
                <button
                  key={e.id}
                  onClick={() => toggleSelected(e.id)}
                  className="px-3 py-1.5 rounded-full text-xs border"
                  style={{
                    borderColor: checked ? PALETTE.green : PALETTE.line,
                    background: checked ? PALETTE.green : "#fff",
                    color: checked ? "#fff" : PALETTE.ink,
                  }}
                >
                  {e.nom}
                </button>
              );
            })}
          </div>
          <div className="flex gap-3">
            <button onClick={() => setSelectedIds(employees.map((e) => e.id))} className="text-xs underline" style={{ color: PALETTE.green }}>
              Tout sélectionner
            </button>
            {selectedIds.length > 0 && (
              <button onClick={() => setSelectedIds([])} className="text-xs underline" style={{ color: "#8A8271" }}>
                Aucun (revenir au menu)
              </button>
            )}
          </div>
        </div>
      )}

      {employeesAffiches.length === 0 ? (
        <EmptyState text="Sélectionnez un ou plusieurs salariés." />
      ) : (
        <div className={`space-y-8 ${batchPrint ? "no-print" : ""}`}>
          {employeesAffiches.map((e) => (
            <FicheSalarieContent
              key={e.id}
              emp={e}
              data={computeSyntheseData(e, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end)}
              start={start}
              end={end}
              heuresSup={heuresSup}
              tauxCotisations={tauxCotisations}
            />
          ))}
        </div>
      )}

      {batchPrint && (
        <div className="print-only">
          {employeesAImprimer.map((e, i) => (
            <FicheSalarieContent
              key={e.id}
              emp={e}
              data={computeSyntheseData(e, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end)}
              start={start}
              end={end}
              heuresSup={heuresSup}
              tauxCotisations={tauxCotisations}
              pageBreak={i > 0}
            />
          ))}
        </div>
      )}
    </div>
  );
}

function BarChartSimple({ data, color = PALETTE.green, formatValue = (v) => v }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="flex items-end gap-2 h-32">
      {data.map((d, i) => (
        <div key={i} className="flex-1 flex flex-col items-center justify-end h-full">
          <div className="text-[10px] mb-1" style={{ color: "#8A8271" }}>
            {d.value > 0 ? formatValue(d.value) : ""}
          </div>
          <div
            style={{
              width: "100%",
              maxWidth: 28,
              height: `${Math.max(2, (d.value / max) * 90)}%`,
              background: color,
              borderRadius: "3px 3px 0 0",
            }}
          />
          <div className="text-[10px] mt-1 capitalize" style={{ color: "#8A8271" }}>
            {d.label}
          </div>
        </div>
      ))}
    </div>
  );
}

function PieChartSimple({ data }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) return null;
  let cumulative = 0;
  const colors = [PALETTE.green, PALETTE.rust, PALETTE.yellow, "#6B8E6E", "#C99B6A", "#8A8271", "#4A6B5C", "#B5541A"];
  const segments = data.map((d, i) => {
    const start = cumulative / total;
    cumulative += d.value;
    const end = cumulative / total;
    return { ...d, start, end, color: colors[i % colors.length] };
  });
  const toXY = (pct) => {
    const angle = 2 * Math.PI * pct - Math.PI / 2;
    return [50 + 45 * Math.cos(angle), 50 + 45 * Math.sin(angle)];
  };
  return (
    <div className="flex items-center gap-4 flex-wrap">
      <svg viewBox="0 0 100 100" width="100" height="100">
        {segments.map((s, i) => {
          const [x1, y1] = toXY(s.start);
          const [x2, y2] = toXY(s.end);
          const largeArc = s.end - s.start > 0.5 ? 1 : 0;
          return (
            <path
              key={i}
              d={`M50,50 L${x1},${y1} A45,45 0 ${largeArc} 1 ${x2},${y2} Z`}
              fill={s.color}
            />
          );
        })}
      </svg>
      <div className="space-y-1 text-xs">
        {segments.map((s, i) => (
          <div key={i} className="flex items-center gap-1.5">
            <span style={{ width: 10, height: 10, background: s.color, display: "inline-block", borderRadius: 2 }} />
            <span style={{ color: "#6B6552" }}>
              {s.label} ({fmtHours(s.value)})
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Dashboard({ employees, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, lastBackupDate, setTab }) {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0, 10);
  const monthEnd = todayISO();

  // Masse salariale nette estimée du mois (même logique que Simulation paie)
  const bruts = useMemo(() => {
    const byEmp = {};
    entries
      .filter((e) => e.present && e.date >= monthStart && e.date <= monthEnd)
      .forEach((e) => {
        const wk = weekStart(e.date);
        if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
        if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
        byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
        byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    const result = {};
    for (const [empId, weeks] of Object.entries(byEmp)) {
      let normales = 0,
        majo1 = 0,
        majo2 = 0,
        extraPaye = 0;
      Object.values(weeks).forEach(({ eff, paye }) => {
        const s = splitOvertime(eff, heuresSup);
        normales += s.normales;
        majo1 += s.majo1;
        majo2 += s.majo2;
        extraPaye += Math.max(0, paye - eff);
      });
      result[empId] = { normales, majo1, majo2, extraPaye };
    }
    return result;
  }, [entries, monthStart, monthEnd, heuresSup]);

  let masseSalariale = 0;
  let heuresMajo1Total = 0;
  let heuresMajo2Total = 0;
  employees.forEach((emp) => {
    const b = bruts[emp.id];
    if (!b) return;
    const r = Number(emp.tauxHoraire) || 0;
    const brut = r
      ? b.normales * r + b.majo1 * r * (1 + heuresSup.tauxMajo1 / 100) + b.majo2 * r * (1 + heuresSup.tauxMajo2 / 100) + b.extraPaye * r
      : 0;
    const congesMois = congesPayesMontant(emp, entries, heuresDefaut, monthStart, monthEnd);
    const net = brut - (brut + congesMois.montant) * (Number(tauxCotisations) / 100);
    const primesMois = primes
      .filter((p) => p.employeeId === emp.id && p.date >= monthStart && p.date <= monthEnd)
      .reduce((s, p) => s + p.montant, 0);
    const loyerMois = loyerPourPeriode(emp, monthStart, monthEnd);
    masseSalariale += net + primesMois - loyerMois + congesMois.montant;
    heuresMajo1Total += b.majo1;
    heuresMajo2Total += b.majo2;
  });

  const avancesMois = transactions
    .filter((t) => (t.type === "avance" || t.type === "acompte") && t.date >= monthStart && t.date <= monthEnd)
    .reduce((s, t) => s + t.montant, 0);

  // Absences du mois (jours ouvrés pointés hors week-end/fériés où le salarié n'était pas présent)
  const joursPointesMois = useMemo(() => {
    const set = new Set(entries.filter((e) => e.date >= monthStart && e.date <= monthEnd).map((e) => e.date));
    return Array.from(set).filter((d) => !isWeekend(d) && !isJourFerie(d));
  }, [entries, monthStart, monthEnd]);

  let absencesMois = 0;
  employees.forEach((emp) => {
    joursPointesMois.forEach((date) => {
      const entry = entries.find((e) => e.date === date && e.employeeId === emp.id);
      if (!(entry && entry.present)) absencesMois += 1;
    });
  });

  // Alertes
  const alerts = [];
  const sansTaux = employees.filter((e) => !Number(e.tauxHoraire));
  if (sansTaux.length > 0) {
    alerts.push({
      text: `${sansTaux.length} salarié(s) sans taux horaire renseigné : ${sansTaux.map((e) => e.nom).join(", ")}`,
      tab: "salaries",
    });
  }
  employees.forEach((emp) => {
    const pris = entries.filter((e) => e.employeeId === emp.id && !e.present && e.motif === "Congé payé").length;
    const acquis = Number(emp.joursCPAcquis) || 0;
    if (acquis - pris < 0) {
      alerts.push({ text: `Solde de congés payés négatif pour ${emp.nom} (${acquis - pris} j)`, tab: "conges" });
    }
  });
  employees.forEach((emp) => {
    const b = bruts[emp.id];
    if (b && b.majo1 + b.majo2 > 10) {
      alerts.push({ text: `${emp.nom} a ${fmtHours(b.majo1 + b.majo2)} d'heures majorées ce mois-ci`, tab: "heuresSup" });
    }
  });
  employees.forEach((emp) => {
    if (!emp.dateFinContrat) return;
    const jours = Math.floor((new Date(emp.dateFinContrat + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    if (jours >= 0 && jours <= 30) {
      alerts.push({ text: `Contrat de ${emp.nom} (${emp.typeContrat}) se termine dans ${jours} jour(s)`, tab: "salaries" });
    }
  });
  transactions
    .filter((t) => t.type === "pret" && t.mensualite)
    .forEach((pret) => {
      const emp = employees.find((e) => e.id === pret.employeeId);
      if (!emp) return;
      const rembourse = transactions
        .filter((t) => t.type === "remboursement" && t.employeeId === pret.employeeId && t.date >= pret.date)
        .reduce((s, t) => s + t.montant, 0);
      if (rembourse >= pret.montant - 0.01) return;
      const nbEcheances = Math.ceil(pret.montant / pret.mensualite);
      let cumul = rembourse;
      let enRetard = 0;
      for (let n = 1; n <= nbEcheances; n++) {
        const d = new Date(pret.date + "T00:00:00");
        d.setMonth(d.getMonth() + n);
        const dueDate = d.toISOString().slice(0, 10);
        const montantEch = n < nbEcheances ? pret.mensualite : pret.montant - pret.mensualite * (nbEcheances - 1);
        if (cumul >= montantEch - 0.01) {
          cumul -= montantEch;
        } else if (dueDate <= todayISO()) {
          enRetard += 1;
        }
      }
      if (enRetard > 0) {
        alerts.push({ text: `Prêt de ${emp.nom} : ${enRetard} échéance(s) en retard à régulariser`, tab: "avances" });
      }
    });
  const joursDepuisSauvegarde = lastBackupDate
    ? Math.floor((Date.now() - new Date(lastBackupDate).getTime()) / 86400000)
    : null;
  if (joursDepuisSauvegarde === null || joursDepuisSauvegarde > 7) {
    alerts.push({
      text: joursDepuisSauvegarde === null ? "Aucune sauvegarde téléchargée pour l'instant" : `Dernière sauvegarde il y a ${joursDepuisSauvegarde} jours`,
      tab: "parametres",
    });
  }

  const monthLabel = now.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  // Masse salariale nette des 6 derniers mois (pour le graphique)
  const massesParMois = useMemo(() => {
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mStart = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0, 10);
      const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10);
      const byEmp = {};
      entries
        .filter((e) => e.present && e.date >= mStart && e.date <= mEnd)
        .forEach((e) => {
          const wk = weekStart(e.date);
          if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
          if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
          byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
          byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
        });
      let total = 0;
      employees.forEach((emp) => {
        const weeks = byEmp[emp.id];
        if (!weeks) return;
        let normales = 0,
          majo1 = 0,
          majo2 = 0,
          extraPaye = 0;
        Object.values(weeks).forEach(({ eff, paye }) => {
          const s = splitOvertime(eff, heuresSup);
          normales += s.normales;
          majo1 += s.majo1;
          majo2 += s.majo2;
          extraPaye += Math.max(0, paye - eff);
        });
        const r = Number(emp.tauxHoraire) || 0;
        const brut = r
          ? normales * r + majo1 * r * (1 + heuresSup.tauxMajo1 / 100) + majo2 * r * (1 + heuresSup.tauxMajo2 / 100) + extraPaye * r
          : 0;
        total += brut - brut * (Number(tauxCotisations) / 100);
      });
      months.push({ label: d.toLocaleDateString("fr-FR", { month: "short" }), value: Math.round(total) });
    }
    return months;
  }, [entries, employees, heuresSup, tauxCotisations, now.getFullYear(), now.getMonth()]);

  // Répartition des heures par tâche ce mois-ci (pour le camembert)
  const heuresParTache = useMemo(() => {
    const map = {};
    entries
      .filter((e) => e.present && e.date >= monthStart && e.date <= monthEnd)
      .forEach((e) => {
        map[e.tache] = (map[e.tache] || 0) + Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    return Object.entries(map)
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value)
      .slice(0, 8);
  }, [entries, monthStart, monthEnd]);

  return (
    <div>
      <h2 className="font-semibold mb-3 capitalize">{monthLabel}</h2>

      <div className="grid grid-cols-2 gap-3 mb-6">
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3">
          <div className="text-xs" style={{ color: "#8A8271" }}>
            Masse salariale nette estimée
          </div>
          <div className="text-lg font-bold" style={{ color: PALETTE.green }}>
            {fmtEuros(masseSalariale)}
          </div>
        </div>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3">
          <div className="text-xs" style={{ color: "#8A8271" }}>
            Avances/acomptes versés
          </div>
          <div className="text-lg font-bold" style={{ color: PALETTE.rust }}>
            {fmtEuros(avancesMois)}
          </div>
        </div>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3">
          <div className="text-xs" style={{ color: "#8A8271" }}>
            Heures majorées +{heuresSup.tauxMajo1}%
          </div>
          <div className="text-lg font-bold" style={{ color: PALETTE.ink }}>
            {fmtHours(heuresMajo1Total)}
          </div>
        </div>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3">
          <div className="text-xs" style={{ color: "#8A8271" }}>
            Heures majorées +{heuresSup.tauxMajo2}%
          </div>
          <div className="text-lg font-bold" style={{ color: PALETTE.ink }}>
            {fmtHours(heuresMajo2Total)}
          </div>
        </div>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3">
          <div className="text-xs" style={{ color: "#8A8271" }}>
            Absences (jours ouvrés)
          </div>
          <div className="text-lg font-bold" style={{ color: PALETTE.ink }}>
            {absencesMois}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
          <h3 className="text-sm font-semibold mb-3">Masse salariale nette — 6 derniers mois</h3>
          <BarChartSimple data={massesParMois} formatValue={(v) => `${Math.round(v / 100) / 10}k`} />
        </div>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
          <h3 className="text-sm font-semibold mb-3">Heures par tâche ce mois-ci</h3>
          {heuresParTache.length === 0 ? (
            <p className="text-sm" style={{ color: "#8A8271" }}>
              Aucune donnée pour l'instant.
            </p>
          ) : (
            <PieChartSimple data={heuresParTache} />
          )}
        </div>
      </div>

      {alerts.length > 0 && (
        <div>
          <h3 className="font-semibold mb-2">Alertes</h3>
          <div className="space-y-2 mb-6">
            {alerts.map((a, i) => (
              <button
                key={i}
                onClick={() => setTab(a.tab)}
                className="w-full text-left flex items-start gap-2 p-3 rounded-md text-sm"
                style={{ background: "#FBF0E9", border: `1px solid ${PALETTE.rust}` }}
              >
                <AlertTriangle size={16} color={PALETTE.rust} className="shrink-0 mt-0.5" />
                <span style={{ color: "#5A3320" }}>{a.text}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {employees.length === 0 && (
        <EmptyState text="Ajoutez vos salariés dans l'onglet « Salariés » pour commencer." />
      )}
    </div>
  );
}


// ---------- Compte rendu hebdomadaire (heures effectives / payées / majorées par semaine) ----------
function SyntheseHebdo({ employees, entries, heuresSup, heuresDefaut }) {
  const [selectedIds, setSelectedIds] = useState([]);
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  const employeesAffiches = selectedIds.length > 0 ? employees.filter((e) => selectedIds.includes(e.id)) : employees;

  const toggleSelected = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  // Regroupe les heures par semaine pour un salarié donné, sur la période choisie.
  // Les jours de congés payés sont ajoutés aux heures payées (maintien de salaire), pas aux
  // heures effectives, et ne comptent pas dans le calcul des heures majorées.
  const semainesPour = (empId) => {
    const weeks = {};
    entries
      .filter((e) => e.present && e.employeeId === empId && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = weekStart(e.date);
        if (!weeks[wk]) weeks[wk] = { eff: 0, paye: 0, congesPaye: 0 };
        weeks[wk].eff += Number(e.heuresEffectives || 0);
        weeks[wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    entries
      .filter((e) => !e.present && e.motif === "Congé payé" && e.employeeId === empId && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = weekStart(e.date);
        if (!weeks[wk]) weeks[wk] = { eff: 0, paye: 0, congesPaye: 0 };
        weeks[wk].congesPaye += Number(heuresDefaut || 0);
      });
    return Object.keys(weeks)
      .sort()
      .map((wk) => {
        const { eff, paye, congesPaye } = weeks[wk];
        const { majo1, majo2 } = splitOvertime(eff, heuresSup);
        return { wk, eff, paye: paye + congesPaye, congesPaye, majo1, majo2 };
      });
  };

  const exportCSV = () => {
    const rows = [
      [
        "Salarié",
        "Semaine",
        "Heures effectives",
        "Heures payées (dont congés payés)",
        `Majorées ${heuresSup.tauxMajo1}%`,
        `Majorées ${heuresSup.tauxMajo2}%`,
      ],
    ];
    employeesAffiches.forEach((emp) => {
      semainesPour(emp.id).forEach((s) => {
        rows.push([emp.nom, weekLabel(s.wk), s.eff.toFixed(2), s.paye.toFixed(2), s.majo1.toFixed(2), s.majo2.toFixed(2)]);
      });
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `compte_rendu_hebdo_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const exportPDF = () => window.print();

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Compte rendu hebdomadaire — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-3 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> CSV
        </button>
        <button
          onClick={exportPDF}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF
        </button>
      </div>

      <p className="text-xs mb-2 no-print" style={{ color: "#8A8271" }}>
        Salariés inclus : {selectedIds.length > 0 ? `${selectedIds.length} sélectionné(s)` : "tous"}. Les congés
        payés sont intégrés aux heures payées (maintien de salaire), pas aux heures effectives.
      </p>
      <div className="flex flex-wrap gap-2 mb-4 no-print">
        {employees.map((e) => {
          const checked = selectedIds.includes(e.id);
          return (
            <button
              key={e.id}
              onClick={() => toggleSelected(e.id)}
              className="px-3 py-1.5 rounded-full text-xs border"
              style={{
                borderColor: checked ? PALETTE.green : PALETTE.line,
                background: checked ? PALETTE.green : "#fff",
                color: checked ? "#fff" : PALETTE.ink,
              }}
            >
              {e.nom}
            </button>
          );
        })}
        {selectedIds.length > 0 && (
          <button onClick={() => setSelectedIds([])} className="text-xs underline" style={{ color: "#8A8271" }}>
            Tout désélectionner
          </button>
        )}
      </div>

      <div className="space-y-4">
        {employeesAffiches.map((emp) => {
          const semaines = semainesPour(emp.id);
          return (
            <div key={emp.id} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
              <div className="px-4 py-2.5 font-medium" style={{ background: PALETTE.bg, borderBottom: `1px solid ${PALETTE.line}` }}>
                {emp.nom}
              </div>
              {semaines.length === 0 ? (
                <div className="px-4 py-3 text-sm" style={{ color: "#8A8271" }}>
                  Aucune donnée sur cette période.
                </div>
              ) : (
                <>
                  <div
                    className="grid px-4 py-2 text-xs font-medium"
                    style={{ gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", color: "#8A8271", borderBottom: `1px solid ${PALETTE.line}` }}
                  >
                    <span>Semaine</span>
                    <span className="text-right">Effectives</span>
                    <span className="text-right">Payées</span>
                    <span className="text-right">+{heuresSup.tauxMajo1}%</span>
                    <span className="text-right">+{heuresSup.tauxMajo2}%</span>
                  </div>
                  {semaines.map((s, i) => (
                    <div
                      key={s.wk}
                      className="grid px-4 py-2 text-sm"
                      style={{ gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
                    >
                      <span style={{ color: "#6B6552" }}>
                        {weekLabel(s.wk)}
                        {s.congesPaye > 0 ? ` · dont ${fmtHours(s.congesPaye)} CP` : ""}
                      </span>
                      <span className="text-right">{fmtHours(s.eff)}</span>
                      <span className="text-right">{fmtHours(s.paye)}</span>
                      <span className="text-right" style={{ color: s.majo1 > 0 ? PALETTE.rust : PALETTE.ink }}>
                        {fmtHours(s.majo1)}
                      </span>
                      <span className="text-right" style={{ color: s.majo2 > 0 ? PALETTE.rust : PALETTE.ink }}>
                        {fmtHours(s.majo2)}
                      </span>
                    </div>
                  ))}
                  <div
                    className="grid px-4 py-2 text-sm font-semibold"
                    style={{ gridTemplateColumns: "2fr 1fr 1fr 1fr 1fr", borderTop: `1px solid ${PALETTE.line}`, background: PALETTE.bg }}
                  >
                    <span>Total</span>
                    <span className="text-right">{fmtHours(semaines.reduce((s, w) => s + w.eff, 0))}</span>
                    <span className="text-right">{fmtHours(semaines.reduce((s, w) => s + w.paye, 0))}</span>
                    <span className="text-right" style={{ color: PALETTE.rust }}>
                      {fmtHours(semaines.reduce((s, w) => s + w.majo1, 0))}
                    </span>
                    <span className="text-right" style={{ color: PALETTE.rust }}>
                      {fmtHours(semaines.reduce((s, w) => s + w.majo2, 0))}
                    </span>
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Recap({ employees, entries }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  const filtered = useMemo(
    () => entries.filter((e) => e.present && e.date >= start && e.date <= end),
    [entries, start, end]
  );

  const byEmployee = useMemo(() => {
    const map = {};
    for (const e of filtered) {
      if (!map[e.employeeId]) map[e.employeeId] = { eff: 0, paye: 0, jours: 0 };
      map[e.employeeId].eff += Number(e.heuresEffectives || 0);
      map[e.employeeId].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      map[e.employeeId].jours += 1;
    }
    return map;
  }, [filtered]);

  const byTache = useMemo(() => {
    const map = {};
    for (const e of filtered) {
      if (!map[e.tache]) map[e.tache] = { eff: 0, paye: 0 };
      map[e.tache].eff += Number(e.heuresEffectives || 0);
      map[e.tache].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
    }
    return Object.entries(map).sort((a, b) => b[1].paye - a[1].paye);
  }, [filtered]);

  const totalEff = filtered.reduce((s, e) => s + Number(e.heuresEffectives || 0), 0);
  const totalPaye = filtered.reduce((s, e) => s + Number(e.heuresPayees ?? e.heuresEffectives ?? 0), 0);

  const exportCSV = () => {
    const rows = [["Date", "Salarié", "Heures effectives", "Heures payées", "Tâche", "Parcelle", "Note"]];
    filtered
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date))
      .forEach((e) => {
        const emp = employees.find((x) => x.id === e.employeeId);
        rows.push([
          e.date,
          emp?.nom || "?",
          e.heuresEffectives,
          e.heuresPayees ?? e.heuresEffectives,
          e.tache,
          e.parcelle,
          e.note || "",
        ]);
      });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pointage_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Récapitulatif de pointage — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>
      <div className="flex flex-wrap items-end gap-3 mb-6 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> Exporter CSV
        </button>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> Exporter PDF
        </button>
      </div>

      <div className="mb-6 text-sm flex gap-4 flex-wrap" style={{ color: "#6B6552" }}>
        <span>
          Effectives : <strong style={{ color: PALETTE.green }}>{fmtHours(totalEff)}</strong>
        </span>
        <span>
          Payées : <strong style={{ color: PALETTE.rust }}>{fmtHours(totalPaye)}</strong>
        </span>
        <span>{new Set(filtered.map((e) => e.date)).size} jour(s) pointé(s)</span>
      </div>

      <h3 className="font-semibold mb-2">Par salarié</h3>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-6">
        {employees.length === 0 && <div className="p-3 text-sm" style={{ color: "#8A8271" }}>Aucun salarié.</div>}
        {employees.map((emp, i) => {
          const stats = byEmployee[emp.id];
          if (!stats) return null;
          const ecart = stats.eff !== stats.paye;
          return (
            <div
              key={emp.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <span>
                {emp.nom} <span style={{ color: "#8A8271" }}>({stats.jours} j)</span>
              </span>
              <span>
                {ecart && (
                  <span style={{ color: "#8A8271" }} className="mr-2">
                    eff. {fmtHours(stats.eff)} ·
                  </span>
                )}
                <strong style={{ color: ecart ? PALETTE.rust : PALETTE.ink }}>{fmtHours(stats.paye)}</strong>
                {ecart && (
                  <span style={{ color: "#8A8271" }} className="text-xs">
                    {" "}
                    payées
                  </span>
                )}
              </span>
            </div>
          );
        })}
      </div>

      <h3 className="font-semibold mb-2">Par tâche</h3>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        {byTache.length === 0 && <div className="p-3 text-sm" style={{ color: "#8A8271" }}>Aucune donnée sur cette période.</div>}
        {byTache.map(([tache, stats], i) => {
          const ecart = stats.eff !== stats.paye;
          return (
            <div
              key={tache}
              className="flex items-center justify-between px-4 py-2.5 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <span>{tache}</span>
              <span>
                {ecart && (
                  <span style={{ color: "#8A8271" }} className="mr-2">
                    eff. {fmtHours(stats.eff)} ·
                  </span>
                )}
                <strong style={{ color: ecart ? PALETTE.rust : PALETTE.ink }}>{fmtHours(stats.paye)}</strong>
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Empty state ----------
function EmptyState({ text }) {
  return (
    <div
      style={{ border: `1px dashed ${PALETTE.line}`, color: "#8A8271" }}
      className="rounded-md p-8 text-center text-sm"
    >
      {text}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<PointageApp />);
</script>
</body>
