// ---------- Stockage local (remplace window.storage de Claude) ----------
window.storage = {
  async get(key, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    const v = localStorage.getItem(k);
    if (v === null) return null;
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    localStorage.setItem(k, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    localStorage.removeItem(k);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    const base = shared ? "shared:" : "personal:";
    const pre = base + (prefix || "");
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(pre)) keys.push(k.slice(base.length));
    }
    return { keys, prefix: prefix || "", shared: !!shared };
  },
};

// Lundi de la semaine ISO contenant la date donnée
const weekStart = (iso) => {
  const d = new Date(iso + "T00:00:00");
  const day = d.getDay() || 7; // dimanche -> 7
  if (day !== 1) d.setDate(d.getDate() - (day - 1));
  return d.toISOString().slice(0, 10);
};

const weekLabel = (mondayISO) => {
  const start = new Date(mondayISO + "T00:00:00");
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  return `Semaine du ${fmt(start)} au ${fmt(end)}`;
};

// Vrai si la date (YYYY-MM-DD) tombe un samedi ou un dimanche
const isWeekend = (iso) => {
  const day = new Date(iso + "T00:00:00").getDay();
  return day === 0 || day === 6;
};

// Calcule la date de Pâques (algorithme de Gauss) pour une année donnée
const easterDate = (year) => {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
};

const addDays = (date, n) => {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
};

const toISO = (date) => date.toISOString().slice(0, 10);

// Liste des jours fériés légaux français pour une année donnée
const joursFeries = (year) => {
  const paques = easterDate(year);
  return [
    `${year}-01-01`, // Jour de l'an
    toISO(addDays(paques, 1)), // Lundi de Pâques
    `${year}-05-01`, // Fête du travail
    `${year}-05-08`, // Victoire 1945
    toISO(addDays(paques, 39)), // Ascension
    toISO(addDays(paques, 50)), // Lundi de Pentecôte
    `${year}-07-14`, // Fête nationale
    `${year}-08-15`, // Assomption
    `${year}-11-01`, // Toussaint
    `${year}-11-11`, // Armistice
    `${year}-12-25`, // Noël
  ];
};

const isJourFerie = (iso) => {
  const year = Number(iso.slice(0, 4));
  return joursFeries(year).includes(iso);
};

// Ajoute n mois à une date YYYY-MM-DD sans dérive (recalculé depuis la date d'origine à chaque fois,
// et le jour est ramené au dernier jour du mois si celui-ci n'existe pas, ex: 31 janvier + 1 mois = 28/29 février)
const addMonthsClamped = (dateStr, n) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const total = (m - 1) + n;
  const newY = y + Math.floor(total / 12);
  const newM = ((total % 12) + 12) % 12;
  const daysInMonth = new Date(newY, newM + 1, 0).getDate();
  const newD = Math.min(d, daysInMonth);
  return `${newY}-${String(newM + 1).padStart(2, "0")}-${String(newD).padStart(2, "0")}`;
};

// Calcule le loyer dû automatiquement pour une période, tant que le salarié a un loyer réglé,
// à partir de sa date de début, et jusqu'à la fin de son contrat (CDD/Saisonnier) le cas échéant.
// Compte les échéances mensuelles réelles (une par mois à partir de la date de début), peu importe
// si la période chevauche deux mois civils — pas un simple compte de mois calendaires touchés.
// S'arrête tout seul : fin de contrat dépassée, champ vidé, ou salarié supprimé.
const loyerPourPeriode = (emp, start, end) => {
  const montant = Number(emp.loyerMensuel);
  if (!(montant > 0) || !emp.loyerDebut) return 0;
  const finContrat = (emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && emp.dateFinContrat ? emp.dateFinContrat : null;
  const effectiveEnd = finContrat && finContrat < end ? finContrat : end;
  if (emp.loyerDebut > effectiveEnd) return 0;

  let count = 0;
  let n = 0;
  let due = emp.loyerDebut;
  let garde = 0;
  while (due <= effectiveEnd && garde < 1200) {
    if (due >= start) count++;
    n++;
    due = addMonthsClamped(emp.loyerDebut, n);
    garde++;
  }
  return count * montant;
};

// Calcule l'indemnité de congés payés dus sur une période (règle du maintien de salaire) :
// chaque jour de congé payé déclaré (samedi inclus, dimanche jamais présent puisque exclu à la
// déclaration) est payé comme une journée normale, aux heures par défaut et au taux horaire du salarié.
// Estimation indicative — la règle du 1/10e n'est pas calculée, à comparer avec votre logiciel de paie.
const congesPayesMontant = (emp, entries, heuresDefaut, start, end) => {
  const r = Number(emp.tauxHoraire) || 0;
  if (!r) return { heures: 0, jours: 0, montant: 0 };
  const jours = entries.filter(
    (e) => e.employeeId === emp.id && !e.present && e.motif === "Congé payé" && e.date >= start && e.date <= end
  ).length;
  const heures = jours * Number(heuresDefaut || 0);
  return { heures, jours, montant: heures * r };
};

// Calcule la répartition heures normales / majorées 1 / majorées 2 pour un total hebdo payé
const splitOvertime = (totalHeures, hs) => {
  const s1 = Number(hs.seuilNormal);
  const s2 = Number(hs.seuilMajo2);
  const normales = Math.min(totalHeures, s1);
  const majo1 = Math.max(0, Math.min(totalHeures, s2) - s1);
  const majo2 = Math.max(0, totalHeures - s2);
  return { normales, majo1, majo2 };
};

          window.storage.get("entries", false),
          window.storage.get("config", false),
          window.storage.get("teams", false),
          window.storage.get("transactions", false),
          window.storage.get("primes", false),
        ]);
        if (empRes.status === "fulfilled" && empRes.value) {
          setEmployees(JSON.parse(empRes.value.value));
        }
        if (entRes.status === "fulfilled" && entRes.value) {
          setEntries(JSON.parse(entRes.value.value));
        }
        if (teamRes.status === "fulfilled" && teamRes.value) {
          setTeams(JSON.parse(teamRes.value.value));
        }
        if (txRes.status === "fulfilled" && txRes.value) {
          setTransactions(JSON.parse(txRes.value.value));
        }
        if (primesRes.status === "fulfilled" && primesRes.value) {
          setPrimes(JSON.parse(primesRes.value.value));
        }

          setHeuresSup({ ...DEFAULT_HS, ...(cfg.heuresSup || {}) });

          setHeuresDefaut(cfg.heuresDefaut ?? 7);
          setTauxCotisations(cfg.tauxCotisations ?? DEFAULT_TAUX_COTISATIONS);
          setPinCode(cfg.pinCode || "");
          setPrimeTypes(cfg.primeTypes && cfg.primeTypes.length > 0 ? cfg.primeTypes : DEFAULT_PRIME_TYPES);
          setLastBackupDate(cfg.lastBackupDate || null);
        }
      } catch (e) {
        console.error("Erreur de chargement", e);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // ---------- Persist ----------
  const persist = async (key, value) => {

    try {
      await window.storage.set(key, JSON.stringify(value), false);
      setSaveState("saved");

    persist("entries", next);
  };

    setTeams(next);
    persist("teams", next);
  };

    persist("transactions", next);

    persist("config", { tachesEcart, heuresSup: next, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate, primeTypes });

    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut: next, tauxCotisations, pinCode, lastBackupDate, primeTypes });

    setPinCode(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode: next, lastBackupDate, primeTypes });
  };

    setLastBackupDate(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate: next, primeTypes });

      <div className="no-print">
        <Header saveState={saveState} />
        <TabBar tab={tab} setTab={setTab} />
      </div>
      <main className="max-w-5xl mx-auto px-4 pb-24 pt-6">
        {tab === "dashboard" && (
          <Dashboard
            employees={employees}
            entries={entries}
            transactions={transactions}
            primes={primes}
            heuresSup={heuresSup}
            tauxCotisations={tauxCotisations}
            heuresDefaut={heuresDefaut}
            lastBackupDate={lastBackupDate}
            setTab={setTab}
          />
        )}
        {tab === "pointage" && (
          <Pointage
            employees={employees}
            teams={teams}
            entries={entries}
            updateEntries={updateEntries}
            tachesEcart={tachesEcart}
            taches={taches}
            heuresDefaut={heuresDefaut}
            selectedDate={selectedDate}
            setSelectedDate={setSelectedDate}
          />
        )}
        {tab === "salaries" && <Salaries employees={employees} updateEmployees={updateEmployees} />}
        {tab === "equipes" && <Equipes employees={employees} teams={teams} updateTeams={updateTeams} />}
        {tab === "avances" && (
          <Avances employees={employees} transactions={transactions} updateTransactions={updateTransactions} />
        )}
        {tab === "primes" && (
          <Primes employees={employees} primes={primes} updatePrimes={updatePrimes} primeTypes={primeTypes} updatePrimeTypes={updatePrimeTypes} />
        )}
        {tab === "recap" && <Recap employees={employees} entries={entries} />}
        {tab === "synthese" && (
          <SyntheseSalarie
            employees={employees}
            entries={entries}
            transactions={transactions}
            primes={primes}
            heuresSup={heuresSup}
            tauxCotisations={tauxCotisations}
            heuresDefaut={heuresDefaut}
          />
        )}
        {tab === "syntheseHebdo" && <SyntheseHebdo employees={employees} entries={entries} heuresSup={heuresSup} heuresDefaut={heuresDefaut} />}
        {tab === "absences" && <Absences employees={employees} entries={entries} />}
        {tab === "conges" && (
          <CongesAbsences employees={employees} updateEmployees={updateEmployees} entries={entries} updateEntries={updateEntries} taches={taches} />
        )}
        {tab === "heuresSup" && <HeuresSup employees={employees} entries={entries} heuresSup={heuresSup} />}
        {tab === "simulation" && (
          <SimulationPaie employees={employees} entries={entries} transactions={transactions} primes={primes} heuresSup={heuresSup} tauxCotisations={tauxCotisations} heuresDefaut={heuresDefaut} />
        )}
        {tab === "parametres" && (
          <Parametres
            tachesEcart={tachesEcart}
            updateTachesEcart={updateTachesEcart}
            heuresSup={heuresSup}
            updateHeuresSup={updateHeuresSup}
            taches={taches}
            updateTaches={updateTaches}
            heuresDefaut={heuresDefaut}
            updateHeuresDefaut={updateHeuresDefaut}
            tauxCotisations={tauxCotisations}
            updateTauxCotisations={updateTauxCotisations}
            employees={employees}
            updateEmployees={updateEmployees}
            teams={teams}
            updateTeams={updateTeams}
            entries={entries}
            updateEntries={updateEntries}
            transactions={transactions}
            updateTransactions={updateTransactions}
            pinCode={pinCode}
            updatePinCode={updatePinCode}
            lastBackupDate={lastBackupDate}
            updateLastBackupDate={updateLastBackupDate}
          />
        )}
      </main>
    </div>
  );
}

// ---------- Écran de verrouillage (code PIN) ----------
function LockScreen({ pinCode, onUnlock }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState(false);

  const submit = () => {
    if (value === pinCode) {
      onUnlock();
    } else {
      setError(true);
      setValue("");
    }
  };

  return (
    <div style={{ background: PALETTE.greenDark }} className="min-h-screen flex items-center justify-center p-6">
      <div style={{ background: PALETTE.card }} className="rounded-md p-6 w-full max-w-xs text-center">
        <Lock size={28} color={PALETTE.green} className="mx-auto mb-3" />
        <h1 className="font-bold text-lg mb-1">Carnet de pointage</h1>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Entrez le code pour accéder aux données.
        </p>
        <input
          type="password"
          inputMode="numeric"
          value={value}
          onChange={(e) => {
            setValue(e.target.value);
            setError(false);
          }}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          autoFocus
          className="w-full px-3 py-2 rounded border text-center text-lg tracking-widest mb-3"
          style={{ borderColor: error ? PALETTE.rust : PALETTE.line }}
        />
        {error && (
          <p className="text-xs mb-3" style={{ color: PALETTE.rust }}>
            Code incorrect.
          </p>
        )}
        <button
          onClick={submit}
          style={{ background: PALETTE.green }}
          className="w-full py-2 rounded text-white text-sm font-medium"
        >
          Déverrouiller
        </button>
      </div>
    </div>
  );
}

        </div>
        <div className="text-xs opacity-70 h-4">
          {saveState === "saving" && "Enregistrement…"}
          {saveState === "saved" && "Enregistré ✓"}
        </div>
      </div>
    </div>
  );
}

// ---------- Pointage (daily entry by supervisor) ----------
function Pointage({ employees, teams, entries, updateEntries, tachesEcart, taches, heuresDefaut, selectedDate, setSelectedDate }) {
  const dayEntries = entries.filter((e) => e.date === selectedDate);
  const [selected, setSelected] = useState([]);
  const [bulkTache, setBulkTache] = useState(taches[0]);
  const [bulkEff, setBulkEff] = useState(heuresDefaut);
  const [bulkPaye, setBulkPaye] = useState(heuresDefaut);
  const [bulkParcelle, setBulkParcelle] = useState("");

  // La sélection est propre à chaque jour affiché
  useEffect(() => {
    setSelected([]);
  }, [selectedDate]);

  const shiftDate = (delta) => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    setSelectedDate(d.toISOString().slice(0, 10));
  };

  // Tous les postes (segments) du jour pour un salarié
  const segmentsFor = (empId) => dayEntries.filter((e) => e.employeeId === empId && e.present);
  // Entrée d'absence éventuelle (pas de segment présent, mais un motif a pu être saisi)
  const absenceFor = (empId) => dayEntries.find((e) => e.employeeId === empId && !e.present);

  const updateSegment = (entryId, patch) => {
    const existing = entries.find((e) => e.id === entryId);
    if (!existing) return;
    const merged = { ...existing, ...patch };
    if (!tachesEcart.includes(merged.tache)) {
      merged.heuresPayees = merged.heuresEffectives;
    }
    updateEntries(entries.map((e) => (e.id === entryId ? merged : e)));
  };

  const addSegment = (empId) => {
    const base = {
      id: uid(),
      date: selectedDate,
      employeeId: empId,
      present: true,
      heuresEffectives: heuresDefaut,
      heuresPayees: heuresDefaut,
      tache: taches[0],
      parcelle: "",
      note: "",
    };
    if (!tachesEcart.includes(base.tache)) base.heuresPayees = base.heuresEffectives;
    // Si une entrée d'absence existait pour ce jour, on la retire en ajoutant le premier poste
    const abs = absenceFor(empId);
    const next = abs ? entries.filter((e) => e.id !== abs.id) : entries;
    updateEntries([...next, base]);
  };

  const removeSegment = (entryId) => {
    updateEntries(entries.filter((e) => e.id !== entryId));
  };

  const setMotif = (empId, motif) => {
    const abs = absenceFor(empId);
    if (abs) {
      updateEntries(entries.map((e) => (e.id === abs.id ? { ...e, motif } : e)));
    } else {
      updateEntries([
        ...entries,
        { id: uid(), date: selectedDate, employeeId: empId, present: false, motif, heuresEffectives: 0, heuresPayees: 0, tache: taches[0], parcelle: "", note: "" },
      ]);
    }
  };

  const toggleSelected = (empId) => {
    setSelected((prev) => (prev.includes(empId) ? prev.filter((id) => id !== empId) : [...prev, empId]));
  };

  const selectTeam = (team) => {
    setSelected(team.employeeIds);
    setBulkTache(taches[0]);
  };

  const bulkSeparee = tachesEcart.includes(bulkTache);

  // Ajoute un nouveau poste (segment) à chaque salarié sélectionné, sans écraser ceux déjà pointés
  const applyBulk = () => {
    const additions = selected.map((empId) => ({
      id: uid(),
      date: selectedDate,
      employeeId: empId,
      present: true,
      tache: bulkTache,
      heuresEffectives: bulkEff,
      heuresPayees: bulkSeparee ? bulkPaye : bulkEff,
      parcelle: bulkParcelle,
      note: "",
    }));
    // Retire les éventuelles entrées d'absence des salariés sélectionnés
    const absentIds = new Set(selected.map((id) => absenceFor(id)?.id).filter(Boolean));
    const next = entries.filter((e) => !absentIds.has(e.id));
    updateEntries([...next, ...additions]);
    setSelected([]);
    setBulkParcelle("");
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés » pour commencer le pointage." />;
  }

  const presentEmpIds = new Set(dayEntries.filter((e) => e.present).map((e) => e.employeeId));
  const totalPresents = presentEmpIds.size;
  const totalEff = dayEntries.filter((e) => e.present).reduce((s, e) => s + Number(e.heuresEffectives || 0), 0);
  const totalPaye = dayEntries.filter((e) => e.present).reduce((s, e) => s + Number(e.heuresPayees ?? e.heuresEffectives ?? 0), 0);

  return (
    <div>
      {/* Date navigator */}
      <div className="flex items-center justify-between mb-5">
        <button onClick={() => shiftDate(-1)} className="p-2 rounded-full hover:bg-black/5">
          <ChevronLeft size={20} />
        </button>
        <div className="text-center">
          <div className="font-semibold text-lg capitalize">{fmtDateLong(selectedDate)}</div>
          <input
            type="date"
            value={selectedDate}
            onChange={(e) => setSelectedDate(e.target.value)}
            className="text-xs mt-1 bg-transparent underline decoration-dotted"
            style={{ color: "#8A8271" }}
          />
        </div>
        <button onClick={() => shiftDate(1)} className="p-2 rounded-full hover:bg-black/5">
          <ChevronRight size={20} />
        </button>
      </div>

      <div className="flex gap-4 text-sm mb-4 flex-wrap" style={{ color: "#6B6552" }}>
        <span>
          <strong style={{ color: PALETTE.green }}>{totalPresents}</strong> présent(s)
        </span>
        <span>
          Effectives : <strong style={{ color: PALETTE.green }}>{fmtHours(totalEff)}</strong>
        </span>
        <span>
          Payées : <strong style={{ color: PALETTE.rust }}>{fmtHours(totalPaye)}</strong>
        </span>
      </div>

      {teams.length > 0 && (
        <div className="flex items-center gap-2 flex-wrap mb-3">
          <span className="text-xs" style={{ color: "#8A8271" }}>
            Sélectionner une équipe :
          </span>
          {teams.map((team) => (
            <button
              key={team.id}
              onClick={() => selectTeam(team)}
              className="px-3 py-1.5 rounded-full text-xs border"
              style={{ borderColor: PALETTE.green, color: PALETTE.green, background: "#fff" }}
            >
              {team.nom} ({team.employeeIds.length})
            </button>
          ))}
        </div>
      )}

      {selected.length > 0 && (
        <div
          style={{ background: "#EFEADA", border: `1px solid ${PALETTE.green}` }}
          className="rounded-md p-3 mb-4 flex items-center gap-2 flex-wrap"
        >
          <span className="text-sm font-medium" style={{ color: PALETTE.greenDark }}>
            {selected.length} sélectionné(s)
          </span>
          <select
            value={bulkTache}
            onChange={(e) => setBulkTache(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
          >
            {taches.map((t) => (
              <option key={t} value={t}>
                {t}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.25"
            min="0"
            value={bulkEff}
            onChange={(e) => setBulkEff(e.target.value)}
            className="w-20 px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
            title="Heures effectives"
          />
          {bulkSeparee && (
            <input
              type="number"
              step="0.25"
              min="0"
              value={bulkPaye}
              onChange={(e) => setBulkPaye(e.target.value)}
              className="w-20 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
              title="Heures payées"
            />
          )}
          <input
            type="text"
            placeholder="Parcelle"
            value={bulkParcelle}
            onChange={(e) => setBulkParcelle(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm w-28"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
          />
          <button
            onClick={applyBulk}
            style={{ background: PALETTE.green }}
            className="px-4 py-1.5 rounded text-white text-sm font-medium"
          >
            Ajouter ce poste
          </button>
          <button onClick={() => setSelected([])} className="text-sm" style={{ color: "#8A8271" }}>
            Annuler
          </button>
        </div>
      )}

      <div className="space-y-2">
        {employees.map((emp) => {
          const segments = segmentsFor(emp.id);
          const abs = absenceFor(emp.id);
          const present = segments.length > 0;
          const isSelected = selected.includes(emp.id);
          return (
            <div
              key={emp.id}
              style={{
                background: isSelected ? "#EFEADA" : PALETTE.card,
                border: `1px solid ${isSelected ? PALETTE.green : PALETTE.line}`,
                borderLeft: `4px solid ${present ? PALETTE.green : "#D8CDAE"}`,
              }}
              className="rounded-md p-3"
            >
              <div className="flex items-center gap-3 flex-wrap mb-1.5">
                <input
                  type="checkbox"
                  checked={isSelected}
                  onChange={() => toggleSelected(emp.id)}
                  className="w-4 h-4 shrink-0"
                  style={{ accentColor: PALETTE.green }}
                  title="Sélectionner pour un pointage groupé"
                />
                <div className="min-w-[140px] font-medium">{emp.nom}</div>
                {present && (
                  <span className="text-xs" style={{ color: "#8A8271" }}>
                    {segments.length} poste{segments.length > 1 ? "s" : ""}
                  </span>
                )}
                <button
                  onClick={() => addSegment(emp.id)}
                  className="text-xs px-2 py-1 rounded flex items-center gap-1"
                  style={{ border: `1px solid ${PALETTE.green}`, color: PALETTE.green }}
                >
                  <Plus size={12} /> {present ? "Ajouter un poste" : "Marquer présent"}
                </button>
                {!present && (
                  <>
                    <span className="text-sm italic" style={{ color: "#B5AA88" }}>
                      Absent ce jour
                    </span>
                    <select
                      value={abs?.motif ?? ""}
                      onChange={(e) => setMotif(emp.id, e.target.value)}
                      className="px-2 py-1 rounded border text-xs"
                      style={{ borderColor: PALETTE.line, background: "#fff", color: "#6B6552" }}
                    >
                      <option value="">Motif (optionnel)</option>
                      {ABSENCE_MOTIFS.map((m) => (
                        <option key={m} value={m}>
                          {m}
                        </option>
                      ))}
                    </select>
                  </>
                )}
              </div>

              {segments.map((seg, i) => {
                const separee = tachesEcart.includes(seg.tache);
                return (
                  <div
                    key={seg.id}
                    className="flex items-center gap-2 flex-wrap ml-7 mt-1.5 pl-2"
                    style={{ borderLeft: `2px solid ${PALETTE.line}` }}
                  >
                    <span className="text-xs w-4 shrink-0" style={{ color: "#8A8271" }}>
                      {i + 1}.
                    </span>
                    <select
                      value={seg.tache}
                      onChange={(e) => updateSegment(seg.id, { tache: e.target.value })}
                      className="px-2 py-1.5 rounded border text-sm min-w-[160px]"
                      style={{ borderColor: PALETTE.line, background: "#fff" }}
                    >
                      {taches.map((t) => (
                        <option key={t} value={t}>
                          {t}
                          {tachesEcart.includes(t) ? " ⚑" : ""}
                        </option>
                      ))}
                    </select>

                    <div className="flex items-center gap-1.5">
                      <input
                        type="number"
                        step="0.25"
                        min="0"
                        max="24"
                        value={seg.heuresEffectives ?? heuresDefaut}
                        onChange={(e) =>
                          updateSegment(seg.id, {
                            heuresEffectives: e.target.value,
                            ...(separee ? {} : { heuresPayees: e.target.value }),
                          })
                        }
                        className="w-20 px-2 py-1.5 rounded border text-sm"
                        style={{ borderColor: PALETTE.line, background: "#fff" }}
                      />
                      <span className="text-xs" style={{ color: "#8A8271" }}>
                        {separee ? "h eff." : "heures"}
                      </span>
                    </div>

                    {separee && (
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number"
                          step="0.25"
                          min="0"
                          max="24"
                          value={seg.heuresPayees ?? seg.heuresEffectives ?? heuresDefaut}
                          onChange={(e) => updateSegment(seg.id, { heuresPayees: e.target.value })}
                          className="w-20 px-2 py-1.5 rounded border text-sm"
                          style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
                        />
                        <span className="text-xs" style={{ color: PALETTE.rust }}>
                          h payées
                        </span>
                      </div>
                    )}

                    <input
                      type="text"
                      placeholder="Parcelle (ex: P4)"
                      value={seg.parcelle ?? ""}
                      onChange={(e) => updateSegment(seg.id, { parcelle: e.target.value })}
                      className="px-2 py-1.5 rounded border text-sm w-32"
                      style={{ borderColor: PALETTE.line, background: "#fff" }}
                    />
                    <button
                      onClick={() => removeSegment(seg.id)}
                      className="p-1.5 rounded hover:bg-black/5"
                      style={{ color: PALETTE.rust }}
                      title="Supprimer ce poste"
                    >
                      <Trash2 size={14} />
                    </button>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Salariés (employee management) ----------
const TYPES_CONTRAT = ["CDI", "CDD", "Saisonnier", "Autre"];

function Salaries({ employees, updateEmployees }) {
  const [nom, setNom] = useState("");
  const [poste, setPoste] = useState("");
  const [tauxHoraire, setTauxHoraire] = useState("");
  const [search, setSearch] = useState("");

  const addEmployee = () => {
    if (!nom.trim()) return;
    updateEmployees([
      ...employees,
      { id: uid(), nom: nom.trim(), poste: poste.trim(), tauxHoraire: tauxHoraire || "", typeContrat: "CDI", dateFinContrat: "" },
    ]);
    setNom("");
    setPoste("");
    setTauxHoraire("");
  };

  const removeEmployee = (id) => {
    updateEmployees(employees.filter((e) => e.id !== id));
  };

  const updateRate = (id, value) => {
    updateEmployees(employees.map((e) => (e.id === id ? { ...e, tauxHoraire: value } : e)));
  };

  const updateField = (id, field, value) => {
    updateEmployees(employees.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const filtered = employees.filter((e) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return e.nom.toLowerCase().includes(q) || (e.poste || "").toLowerCase().includes(q);
  });

  const finProche = (dateFin) => {
    if (!dateFin) return false;
    const jours = Math.floor((new Date(dateFin + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    return jours >= 0 && jours <= 30;
  };

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Ajouter un salarié</h2>
        <div className="flex flex-wrap gap-2">
          <input
            placeholder="Nom et prénom"
            value={nom}
            onChange={(e) => setNom(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addEmployee()}
            className="px-3 py-2 rounded border text-sm flex-1 min-w-[180px]"
            style={{ borderColor: PALETTE.line }}
          />
          <input
            placeholder="Poste (ex: coupeur, tractoriste)"
            value={poste}
            onChange={(e) => setPoste(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addEmployee()}
            className="px-3 py-2 rounded border text-sm flex-1 min-w-[180px]"
            style={{ borderColor: PALETTE.line }}
          />
          <input
            placeholder="Taux horaire (€, optionnel)"
            type="number"
            step="0.01"
            value={tauxHoraire}
            onChange={(e) => setTauxHoraire(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addEmployee()}
            className="px-3 py-2 rounded border text-sm w-48"
            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addEmployee}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
          </button>
        </div>
      </div>

      {employees.length > 0 && (
        <input
          type="text"
          placeholder="Rechercher un salarié ou un poste..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          className="px-3 py-2 rounded border text-sm w-full mb-4"
          style={{ borderColor: PALETTE.line }}
        />
      )}

      {employees.length === 0 ? (
        <EmptyState text="Aucun salarié pour le moment. Ajoutez votre équipe ci-dessus." />
      ) : filtered.length === 0 ? (
        <EmptyState text="Aucun résultat pour cette recherche." />
      ) : (
        <div className="space-y-2">
          {filtered.map((emp) => (
            <div
              key={emp.id}
              style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
              className="rounded-md p-3"
            >
              <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                <div>
                  <div className="font-medium">{emp.nom}</div>
                  <div className="text-xs" style={{ color: "#8A8271" }}>
                    {emp.poste || "Poste non renseigné"}
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <div className="flex items-center gap-1.5">
                    <input
                      type="number"
                      step="0.01"
                      min="0"
                      placeholder="Taux"
                      value={emp.tauxHoraire ?? ""}
                      onChange={(e) => updateRate(emp.id, e.target.value)}
                      className="w-24 px-2 py-1.5 rounded border text-sm"
                      style={{ borderColor: PALETTE.line }}
                    />
                    <span className="text-xs" style={{ color: "#8A8271" }}>
                      €/h
                    </span>
                  </div>
                  <button onClick={() => removeEmployee(emp.id)} className="p-2 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                    <Trash2 size={16} />
                  </button>
                </div>
              </div>
              <div
                className="flex items-center gap-2 flex-wrap pt-2"
                style={{ borderTop: `1px solid ${PALETTE.line}` }}
              >
                <select
                  value={emp.typeContrat || "CDI"}
                  onChange={(e) => updateField(emp.id, "typeContrat", e.target.value)}
                  className="px-2 py-1.5 rounded border text-xs"
                  style={{ borderColor: PALETTE.line }}
                >
                  {TYPES_CONTRAT.map((t) => (
                    <option key={t} value={t}>
                      {t}
                    </option>
                  ))}
                </select>
                {(emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && (
                  <>
                    <span className="text-xs" style={{ color: "#8A8271" }}>
                      Fin de contrat :
                    </span>
                    <input
                      type="date"
                      value={emp.dateFinContrat || ""}
                      onChange={(e) => updateField(emp.id, "dateFinContrat", e.target.value)}
                      className="px-2 py-1.5 rounded border text-xs"
                      style={{ borderColor: finProche(emp.dateFinContrat) ? PALETTE.rust : PALETTE.line }}
                    />
                    {finProche(emp.dateFinContrat) && (
                      <span className="text-xs font-medium" style={{ color: PALETTE.rust }}>
                        ⚠ Fin proche
                      </span>
                    )}
                  </>
                )}
                <span className="text-xs" style={{ color: "#8A8271" }}>
                  Loyer prélevé :
                </span>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  placeholder="€/mois"
                  value={emp.loyerMensuel ?? ""}
                  onChange={(e) => {
                    const val = e.target.value;
                    updateEmployees(
                      employees.map((x) =>
                        x.id === emp.id
                          ? { ...x, loyerMensuel: val, loyerDebut: val && !x.loyerDebut ? todayISO() : x.loyerDebut }
                          : x
                      )
                    );
                  }}
                  className="px-2 py-1.5 rounded border text-xs w-24"
                  style={{ borderColor: PALETTE.line }}
                />
                {Number(emp.loyerMensuel) > 0 && (
                  <>
                    <span className="text-xs" style={{ color: "#8A8271" }}>
                      depuis le
                    </span>
                    <input
                      type="date"
                      value={emp.loyerDebut || todayISO()}
                      onChange={(e) => updateField(emp.id, "loyerDebut", e.target.value)}
                      className="px-2 py-1.5 rounded border text-xs"
                      style={{ borderColor: PALETTE.line }}
                    />
                    <span className="text-xs" style={{ color: PALETTE.green }} title="Déduit automatiquement chaque mois du net, jusqu'à la fin du contrat ou tant que ce champ n'est pas vidé">
                      ⚙ auto
                    </span>
                  </>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- Équipes (groupes fixes réutilisables) ----------
function Equipes({ employees, teams, updateTeams }) {
  const [nom, setNom] = useState("");
  const [membres, setMembres] = useState([]);
  const [editingId, setEditingId] = useState(null);

  const resetForm = () => {
    setNom("");
    setMembres([]);
    setEditingId(null);
  };

  const toggleMembre = (empId) => {
    setMembres((prev) => (prev.includes(empId) ? prev.filter((id) => id !== empId) : [...prev, empId]));
  };

  const saveTeam = () => {
    if (!nom.trim() || membres.length === 0) return;
    if (editingId) {
      updateTeams(teams.map((t) => (t.id === editingId ? { ...t, nom: nom.trim(), employeeIds: membres } : t)));
    } else {
      updateTeams([...teams, { id: uid(), nom: nom.trim(), employeeIds: membres }]);
    }
    resetForm();
  };

  const editTeam = (team) => {
    setEditingId(team.id);
    setNom(team.nom);
    setMembres(team.employeeIds);
  };

  const removeTeam = (id) => {
    updateTeams(teams.filter((t) => t.id !== id));
    if (editingId === id) resetForm();
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés » avant de créer des équipes." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">{editingId ? "Modifier l'équipe" : "Créer une équipe"}</h2>
        <input
          placeholder="Nom de l'équipe (ex: Équipe coupe)"
          value={nom}
          onChange={(e) => setNom(e.target.value)}
          className="px-3 py-2 rounded border text-sm w-full mb-3"
          style={{ borderColor: PALETTE.line }}
        />
        <div className="flex flex-wrap gap-2 mb-3">
          {employees.map((emp) => {
            const checked = membres.includes(emp.id);
            return (
              <button
                key={emp.id}
                onClick={() => toggleMembre(emp.id)}
                className="px-3 py-1.5 rounded-full text-sm border transition-colors"
                style={{
                  borderColor: checked ? PALETTE.green : PALETTE.line,
                  background: checked ? PALETTE.green : "#fff",
                  color: checked ? "#fff" : PALETTE.ink,
                }}
              >
                {emp.nom}
              </button>
            );
          })}
        </div>
        <div className="flex gap-2">
          <button
            onClick={saveTeam}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> {editingId ? "Enregistrer" : "Créer l'équipe"}
          </button>
          {editingId && (
            <button onClick={resetForm} className="px-4 py-2 rounded text-sm font-medium" style={{ color: "#8A8271" }}>
              Annuler
            </button>
          )}
        </div>
      </div>

      {teams.length === 0 ? (
        <EmptyState text="Aucune équipe pour le moment. Créez-en une ci-dessus pour pointer un groupe en un clic." />
      ) : (
        <div className="space-y-2">
          {teams.map((team) => (
            <div
              key={team.id}
              style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
              className="rounded-md p-3 flex items-center justify-between"
            >
              <div>
                <div className="font-medium">{team.nom}</div>
                <div className="text-xs" style={{ color: "#8A8271" }}>
                  {team.employeeIds
                    .map((id) => employees.find((e) => e.id === id)?.nom)
                    .filter(Boolean)
                    .join(", ")}
                </div>
              </div>
              <div className="flex gap-1">
                <button onClick={() => editTeam(team)} className="px-2 py-1 rounded hover:bg-black/5 text-xs" style={{ color: PALETTE.green }}>
                  Modifier
                </button>
                <button onClick={() => removeTeam(team.id)} className="p-2 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                  <Trash2 size={16} />
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ---------- Avances, acomptes et prêts ----------
const TX_TYPES = [
  { id: "avance", label: "Avance" },
  { id: "acompte", label: "Acompte" },
  { id: "pret", label: "Prêt" },
  { id: "remboursement", label: "Remboursement" },
];

const fmtEuros = (n) => `${Number(n).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;

function Avances({ employees, transactions, updateTransactions }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [type, setType] = useState("avance");
  const [montant, setMontant] = useState("");
  const [mensualite, setMensualite] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");
  const [filterEmp, setFilterEmp] = useState("all");

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  const addTx = () => {
    if (!employeeId || !montant || Number(montant) <= 0) return;
    updateTransactions([
      ...transactions,
      {
        id: uid(),
        employeeId,
        type,
        montant: Number(montant),
        date,
        note: note.trim(),
        ...(type === "pret" && mensualite ? { mensualite: Number(mensualite) } : {}),
      },
    ]);
    setMontant("");
    setMensualite("");
    setNote("");
  };

  const removeTx = (id) => {
    updateTransactions(transactions.filter((t) => t.id !== id));
  };

  // Solde dû = avances + acomptes + prêts - remboursements, par salarié
  const balances = useMemo(() => {
    const map = {};
    for (const t of transactions) {
      if (t.type === "loyer") continue; // le loyer n'est pas une dette à rembourser
      if (!map[t.employeeId]) map[t.employeeId] = 0;
      map[t.employeeId] += t.type === "remboursement" ? -t.montant : t.montant;
    }
    return map;
  }, [transactions]);

  const totalDu = Object.values(balances).reduce((s, v) => s + v, 0);

  // Prêts avec mensualité, non totalement remboursés (remboursements comptés depuis la date du prêt)
  // Ajoute N mois à une date ISO
  const addMonths = (iso, n) => {
    const d = new Date(iso + "T00:00:00");
    d.setMonth(d.getMonth() + n);
    return d.toISOString().slice(0, 10);
  };

  // Échéancier complet par prêt : une échéance par mois jusqu'à épuration de la dette
  const pretsEnCours = useMemo(() => {
    return transactions
      .filter((t) => t.type === "pret" && t.mensualite)
      .map((pret) => {
        const rembourse = transactions
          .filter((t) => t.type === "remboursement" && t.employeeId === pret.employeeId && t.date >= pret.date)
          .reduce((s, t) => s + t.montant, 0);
        const restant = Math.max(0, pret.montant - rembourse);

        // Construit l'échéancier théorique : une échéance par mois, montant = mensualité (dernière = solde)
        const nbEcheances = Math.ceil(pret.montant / pret.mensualite);
        let cumulPaye = rembourse;
        const echeances = [];
        for (let n = 1; n <= nbEcheances; n++) {
          const dueDate = addMonths(pret.date, n);
          const montantEcheance = n < nbEcheances ? pret.mensualite : pret.montant - pret.mensualite * (nbEcheances - 1);
          let statut;
          if (cumulPaye >= montantEcheance - 0.01) {
            statut = "payee";
            cumulPaye -= montantEcheance;
          } else if (dueDate <= todayISO()) {
            statut = "retard";
          } else {
            statut = "avenir";
          }
          echeances.push({ n, dueDate, montant: montantEcheance, statut });
        }

        const enRetard = echeances.filter((e) => e.statut === "retard");
        const emp = employees.find((e) => e.id === pret.employeeId);
        return { pret, emp, rembourse, restant, echeances, enRetard };
      })
      .filter((p) => p.restant > 0 && p.emp);
  }, [transactions, employees]);

  const regulariser = (p) => {
    const additions = p.enRetard.map((e) => ({
      id: uid(),
      employeeId: p.pret.employeeId,
      type: "remboursement",
      montant: e.montant,
      date: e.dueDate,
      note: `Mensualité prêt — échéance du ${e.dueDate}`,
    }));
    updateTransactions([...transactions, ...additions]);
  };

  // Salariés avec un loyer automatique actif (informatif — géré dans l'onglet Salariés)
  const loyersActifs = employees.filter((emp) => Number(emp.loyerMensuel) > 0 && emp.loyerDebut);

  const filtered = transactions
    .filter((t) => filterEmp === "all" || t.employeeId === filterEmp)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const exportCSV = () => {
    const rows = [["Date", "Salarié", "Type", "Montant", "Note"]];
    filtered.forEach((t) => {
      const emp = employees.find((e) => e.id === t.employeeId);
      rows.push([t.date, emp?.nom || "?", TX_TYPES.find((x) => x.id === t.type)?.label || t.type, t.montant, t.note || ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "avances_acomptes_prets.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Nouvelle opération</h2>
        <div className="flex flex-wrap gap-2">
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <select
            value={type}
            onChange={(e) => setType(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          >
            {TX_TYPES.map((t) => (
              <option key={t.id} value={t.id}>
                {t.label}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.01"
            min="0"
            placeholder="Montant (€)"
            value={montant}
            onChange={(e) => setMontant(e.target.value)}
            className="px-3 py-2 rounded border text-sm w-32"
            style={{ borderColor: PALETTE.line }}
          />
          {type === "pret" && (
            <input
              type="number"
              step="0.01"
              min="0"
              placeholder="Mensualité (€, optionnel)"
              value={mensualite}
              onChange={(e) => setMensualite(e.target.value)}
              className="px-3 py-2 rounded border text-sm w-40"
              style={{ borderColor: PALETTE.line }}
            />
          )}
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
          <input
            type="text"
            placeholder="Note (optionnel)"
            value={note}
            onChange={(e) => setNote(e.target.value)}
            className="px-3 py-2 rounded border text-sm flex-1 min-w-[140px]"
            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addTx}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
          </button>
        </div>
        <p className="text-xs mt-2" style={{ color: "#8A8271" }}>
          Pour un prêt, indiquez une mensualité pour suivre le remboursement mois par mois ci-dessous. Les
          remboursements sont déduits du net dans Simulation paie et Synthèse salarié.
        </p>
      </div>

      {loyersActifs.length > 0 && (
        <>
          <h3 className="font-semibold mb-2">Loyers automatiques actifs</h3>
          <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-6">
            {loyersActifs.map((emp, i) => (
              <div
                key={emp.id}
                className="flex items-center justify-between px-4 py-3 text-sm flex-wrap gap-2"
                style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
              >
                <span className="font-medium">{emp.nom}</span>
                <span style={{ color: "#8A8271" }} className="text-xs">
                  {fmtEuros(emp.loyerMensuel)}/mois depuis le {emp.loyerDebut}
                  {emp.dateFinContrat ? ` · jusqu'au ${emp.dateFinContrat}` : ""} — déduit automatiquement, rien à
                  faire ici
                </span>
              </div>
            ))}
          </div>
          <p className="text-xs mb-6" style={{ color: "#8A8271" }}>
            Réglable dans l'onglet Salariés. Pour arrêter un loyer, videz le champ « Loyer prélevé » du salarié
            concerné, ou définissez sa date de fin de contrat.
          </p>
        </>
      )}

      {pretsEnCours.length > 0 && (
        <>
          <h3 className="font-semibold mb-2">Prêts en cours</h3>
          <div className="space-y-2 mb-6">
            {pretsEnCours.map((p) => (
              <div
                key={p.pret.id}
                style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
                className="rounded-md overflow-hidden"
              >
                <div className="flex items-center justify-between px-4 py-3 flex-wrap gap-2" style={{ background: PALETTE.bg }}>
                  <div>
                    <div className="font-medium">{p.emp.nom}</div>
                    <div className="text-xs" style={{ color: "#8A8271" }}>
                      Prêté : {fmtEuros(p.pret.montant)} · Mensualité : {fmtEuros(p.pret.mensualite)} · Remboursé :{" "}
                      {fmtEuros(p.rembourse)} · Restant : <strong style={{ color: PALETTE.rust }}>{fmtEuros(p.restant)}</strong>
                    </div>
                  </div>
                  {p.enRetard.length > 0 && (
                    <button
                      onClick={() => regulariser(p)}
                      style={{ background: PALETTE.green }}
                      className="px-3 py-1.5 rounded text-white text-xs font-medium"
                    >
                      Régulariser {p.enRetard.length} échéance{p.enRetard.length > 1 ? "s" : ""} en retard (
                      {fmtEuros(p.enRetard.reduce((s, e) => s + e.montant, 0))})
                    </button>
                  )}
                </div>
                <div className="px-4 py-2 text-xs space-y-1">
                  {p.echeances.map((e) => (
                    <div key={e.n} className="flex items-center justify-between">
                      <span style={{ color: "#8A8271" }}>
                        Échéance {e.n} — {e.dueDate}
                      </span>
                      <span className="flex items-center gap-2">
                        <span>{fmtEuros(e.montant)}</span>
                        {e.statut === "payee" && (
                          <span style={{ color: PALETTE.green }} className="font-medium">
                            ✓ Payée
                          </span>
                        )}
                        {e.statut === "retard" && (
                          <span style={{ color: PALETTE.rust }} className="font-medium">
                            En retard
                          </span>
                        )}
                        {e.statut === "avenir" && <span style={{ color: "#B5AA88" }}>À échoir</span>}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <p className="text-xs mb-6" style={{ color: "#8A8271" }}>
            L'échéancier se met à jour automatiquement chaque mois — appuyez sur « Régulariser » pour enregistrer
            en une fois toutes les mensualités échues depuis votre dernière visite, jusqu'à ce que le prêt soit
            entièrement soldé.
          </p>
        </>
      )}

      <h3 className="font-semibold mb-2">Soldes par salarié</h3>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-6">
        {employees.map((emp, i) => {
          const solde = balances[emp.id] || 0;
          return (
            <div
              key={emp.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <span>{emp.nom}</span>
              <strong style={{ color: solde > 0 ? PALETTE.rust : "#8A8271" }}>{fmtEuros(solde)}</strong>
            </div>
          );
        })}
        <div
          className="flex items-center justify-between px-4 py-2.5 text-sm font-semibold"
          style={{ borderTop: `1px solid ${PALETTE.line}`, background: PALETTE.bg }}
        >
          <span>Total dû</span>
          <span style={{ color: PALETTE.rust }}>{fmtEuros(totalDu)}</span>
        </div>
      </div>

      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <h3 className="font-semibold">Historique</h3>
        <div className="flex gap-2 items-center">
          <select
            value={filterEmp}
            onChange={(e) => setFilterEmp(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          >
            <option value="all">Tous les salariés</option>
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <button
            onClick={exportCSV}
            style={{ background: PALETTE.rust }}
            className="px-3 py-1.5 rounded text-white text-xs font-medium flex items-center gap-1.5"
          >
            <Download size={14} /> CSV
          </button>
        </div>
      </div>

      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        {filtered.length === 0 && <div className="p-3 text-sm" style={{ color: "#8A8271" }}>Aucune opération.</div>}
        {filtered.map((t, i) => {
          const emp = employees.find((e) => e.id === t.employeeId);
          const isNeg = t.type === "remboursement";
          return (
            <div
              key={t.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm gap-2 flex-wrap"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <div>
                <span className="font-medium">{emp?.nom || "?"}</span>{" "}
                <span style={{ color: "#8A8271" }}>
                  · {TX_TYPES.find((x) => x.id === t.type)?.label} · {t.date}
                  {t.note ? ` · ${t.note}` : ""}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <strong style={{ color: isNeg ? PALETTE.green : PALETTE.rust }}>
                  {isNeg ? "-" : "+"}
                  {fmtEuros(t.montant)}
                </strong>
                <button onClick={() => removeTx(t.id)} className="p-1.5 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                  <Trash2 size={14} />
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Primes (diverses primes versées aux salariés) ----------
const DEFAULT_PRIME_TYPES = ["Prime de rendement", "Prime d'ancienneté", "Prime exceptionnelle", "13e mois", "Prime de fin de contrat", "Autre"];

function Primes({ employees, primes, updatePrimes, primeTypes, updatePrimeTypes }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [type, setType] = useState(primeTypes[0]);
  const [montant, setMontant] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");
  const [filterEmp, setFilterEmp] = useState("all");
  const [nouveauType, setNouveauType] = useState("");
  const [showTypeManager, setShowTypeManager] = useState(false);

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  useEffect(() => {
    if (!primeTypes.includes(type)) setType(primeTypes[0] || "");
  }, [primeTypes]);

  const addPrime = () => {
    if (!employeeId || !montant || Number(montant) <= 0) return;
    updatePrimes([
      ...primes,
      { id: uid(), employeeId, type, montant: Number(montant), date, note: note.trim() },
    ]);
    setMontant("");
    setNote("");
  };

  const removePrime = (id) => {
    updatePrimes(primes.filter((p) => p.id !== id));
  };

  const addType = () => {
    const val = nouveauType.trim();
    if (!val || primeTypes.includes(val)) return;
    updatePrimeTypes([...primeTypes, val]);
    setNouveauType("");
  };

  const removeType = (t) => {
    updatePrimeTypes(primeTypes.filter((x) => x !== t));
  };

  const totalParEmp = useMemo(() => {
    const map = {};
    for (const p of primes) {
      map[p.employeeId] = (map[p.employeeId] || 0) + p.montant;
    }
    return map;
  }, [primes]);

  const totalGeneral = Object.values(totalParEmp).reduce((s, v) => s + v, 0);

  const filtered = primes
    .filter((p) => filterEmp === "all" || p.employeeId === filterEmp)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const exportCSV = () => {
    const rows = [["Date", "Salarié", "Type", "Montant", "Note"]];
    filtered.forEach((p) => {
      const emp = employees.find((e) => e.id === p.employeeId);
      rows.push([p.date, emp?.nom || "?", p.type, p.montant, p.note || ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "primes.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Nouvelle prime</h2>
        <div className="flex flex-wrap gap-2">
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <select
            value={type}

function Parametres({
  tachesEcart,
  updateTachesEcart,
  heuresSup,
  updateHeuresSup,
  taches,
  updateTaches,
  heuresDefaut,
  updateHeuresDefaut,
  tauxCotisations,
  updateTauxCotisations,
  employees,
  updateEmployees,
  teams,
  updateTeams,
  entries,
  updateEntries,
  transactions,
  updateTransactions,
  pinCode,
  updatePinCode,
  lastBackupDate,
  updateLastBackupDate,
}) {
  const [nouvelleTache, setNouvelleTache] = useState("");
  const [editingTache, setEditingTache] = useState(null); // ancien nom en cours d'édition
  const [editValue, setEditValue] = useState("");
  const [restoreMsg, setRestoreMsg] = useState("");
  const [pinInput, setPinInput] = useState(pinCode || "");

  const exportBackup = () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      employees,
      teams,
      entries,
      transactions,
      config: { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations },
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pointage-sauvegarde-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    updateLastBackupDate(new Date().toISOString());
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || typeof data !== "object") throw new Error("format invalide");
        if (Array.isArray(data.employees)) updateEmployees(data.employees);
        if (Array.isArray(data.teams)) updateTeams(data.teams);
        if (Array.isArray(data.entries)) updateEntries(data.entries);
        if (Array.isArray(data.transactions)) updateTransactions(data.transactions);
        if (data.config) {
          if (Array.isArray(data.config.tachesEcart)) updateTachesEcart(data.config.tachesEcart);
          if (data.config.heuresSup) updateHeuresSup(data.config.heuresSup);
          if (Array.isArray(data.config.taches) && data.config.taches.length > 0) updateTaches(data.config.taches);
          if (data.config.heuresDefaut !== undefined) updateHeuresDefaut(data.config.heuresDefaut);
        }
        setRestoreMsg("Sauvegarde restaurée avec succès.");
      } catch (err) {
        setRestoreMsg("Fichier invalide — impossible de restaurer cette sauvegarde.");
      }
    };
    reader.readAsText(file);
  };

  const toggle = (tache) => {
    if (tachesEcart.includes(tache)) {
      updateTachesEcart(tachesEcart.filter((t) => t !== tache));
    } else {
      updateTachesEcart([...tachesEcart, tache]);
    }
  };

  const setHS = (patch) => updateHeuresSup({ ...heuresSup, ...patch });

  const addTache = () => {
    const val = nouvelleTache.trim();
    if (!val || taches.includes(val)) return;
    updateTaches([...taches, val]);
    setNouvelleTache("");
  };

  const removeTache = (t) => {
    updateTaches(taches.filter((x) => x !== t));
    if (tachesEcart.includes(t)) {
      updateTachesEcart(tachesEcart.filter((x) => x !== t));
    }
  };

  const startEdit = (t) => {
    setEditingTache(t);
    setEditValue(t);
  };

  const saveEdit = () => {
    const val = editValue.trim();
    if (!val || !editingTache) {
      setEditingTache(null);
      return;
    }
    if (val !== editingTache) {
      updateTaches(taches.map((t) => (t === editingTache ? val : t)));
      if (tachesEcart.includes(editingTache)) {
        updateTachesEcart(tachesEcart.map((t) => (t === editingTache ? val : t)));
      }
    }
    setEditingTache(null);
  };

  return (
    <div className="space-y-8">
      <div>
        <h2 className="font-semibold mb-1">Tâches</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Ajoutez, renommez ou supprimez les tâches disponibles au pointage. Cochez celles pour lesquelles le temps
          réellement travaillé et le temps payé au salarié peuvent différer (ex : temps de route, forfait tâche) —
          deux champs d'heures apparaîtront alors dans le pointage pour ces tâches.
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-3">
          {taches.map((t, i) => (
            <div
              key={t}
              className="flex items-center justify-between gap-2 px-4 py-3 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              {editingTache === t ? (
                <input
                  autoFocus
                  value={editValue}
                  onChange={(e) => setEditValue(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && saveEdit()}
                  onBlur={saveEdit}
                  className="px-2 py-1 rounded border text-sm flex-1"
                  style={{ borderColor: PALETTE.green }}
                />
              ) : (
                <button onClick={() => startEdit(t)} className="text-left flex-1" title="Appuyer pour renommer">
                  {t}
                </button>
              )}
              <label className="flex items-center gap-1.5 text-xs shrink-0" style={{ color: "#8A8271" }}>
                <input
                  type="checkbox"
                  checked={tachesEcart.includes(t)}
                  onChange={() => toggle(t)}
                  className="w-4 h-4"
                  style={{ accentColor: PALETTE.green }}
                />
                heures séparées
              </label>
              <button onClick={() => removeTache(t)} className="p-1.5 rounded hover:bg-black/5 shrink-0" style={{ color: PALETTE.rust }}>
                <Trash2 size={14} />
              </button>
            </div>
          ))}
          {taches.length === 0 && (
            <div className="p-3 text-sm" style={{ color: "#8A8271" }}>
              Aucune tâche. Ajoutez-en une ci-dessous.
            </div>
          )}
        </div>
        <div className="flex gap-2">
          <input
            placeholder="Nouvelle tâche"
            value={nouvelleTache}
            onChange={(e) => setNouvelleTache(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addTache()}
            className="px-3 py-2 rounded border text-sm flex-1"
            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addTache}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
          </button>
        </div>
      </div>

      <div>
        <h2 className="font-semibold mb-1">Heures par défaut</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Valeur pré-remplie (heures effectives et payées) quand vous marquez un salarié présent au pointage. Vous
          pouvez toujours l'ajuster ligne par ligne.
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Heures par défaut</label>
            <div className="flex items-center gap-1.5">
              <input
                type="number"
                step="0.25"
                min="0"
                value={heuresDefaut}
                onChange={(e) => updateHeuresDefaut(e.target.value)}
                className="w-24 px-2 py-1.5 rounded border text-sm"
                style={{ borderColor: PALETTE.line }}
              />
              <span className="text-xs" style={{ color: "#8A8271" }}>
                h
              </span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <h2 className="font-semibold mb-1">Cotisations sociales salariales</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Taux moyen déduit du brut pour estimer le net à payer dans Simulation paie et Synthèse salarié. La valeur
          par défaut (22%) est indicative — vérifiez le taux réel sur un bulletin de paie de votre exploitation,
          il varie selon le statut et les caisses agricoles (MSA).
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Taux de cotisations salariales (%)</label>
            <input
              type="number"
              step="0.1"
              min="0"
              max="100"
              value={tauxCotisations}
              onChange={(e) => updateTauxCotisations(e.target.value)}
              className="w-24 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
        </div>
      </div>

      <div>
        <h2 className="font-semibold mb-1">Heures supplémentaires</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Valeurs par défaut = Code du travail (référence 35h/semaine). Ajustez-les si un avenant de la convention
          IDCC 9971 prévoit des taux différents pour votre exploitation — à vérifier avec votre expert-comptable.
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 space-y-3">
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Seuil hebdomadaire normal (h)</label>
            <input
              type="number"
              value={heuresSup.seuilNormal}
              onChange={(e) => setHS({ seuilNormal: e.target.value })}
              className="w-24 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Majoration 1 — de {heuresSup.seuilNormal + 1}h à ... (%)</label>
            <input
              type="number"
              value={heuresSup.tauxMajo1}
              onChange={(e) => setHS({ tauxMajo1: e.target.value })}
              className="w-24 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Seuil majoration 2 (h/semaine)</label>
            <input
              type="number"
              value={heuresSup.seuilMajo2}
              onChange={(e) => setHS({ seuilMajo2: e.target.value })}
              className="w-24 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}

          </div>
          <div className="flex items-center justify-between gap-3">
            <label className="text-sm">Majoration 2 — au-delà (%)</label>
            <input
              type="number"
              value={heuresSup.tauxMajo2}
              onChange={(e) => setHS({ tauxMajo2: e.target.value })}
              className="w-24 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />

        </div>
      </div>

      <div>
        <h2 className="font-semibold mb-1">Sauvegarde et restauration</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Toutes vos données (salariés, pointages, avances, réglages) sont stockées uniquement dans ce navigateur.
          Téléchargez une sauvegarde régulièrement — c'est le seul moyen de tout récupérer si vous videz le cache
          Safari ou changez d'appareil.
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 space-y-4">
          <div>
            <button
              onClick={exportBackup}
              style={{ background: PALETTE.green }}
              className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
            >
              <Download size={16} /> Télécharger une sauvegarde complète
            </button>
            <p className="text-xs mt-2" style={{ color: "#8A8271" }}>
              {lastBackupDate
                ? `Dernière sauvegarde : ${new Date(lastBackupDate).toLocaleDateString("fr-FR")} à ${new Date(lastBackupDate).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`
                : "Aucune sauvegarde téléchargée pour l'instant."}

      <div>

          sensibles (avances, taux horaires). Ce n'est pas un chiffrement fort, juste une barrière d'accès simple.
        </p>
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
