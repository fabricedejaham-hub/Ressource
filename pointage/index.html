// ---------- Primes (diverses primes versées aux salariés) ----------
const DEFAULT_PRIME_TYPES = ["Prime de rendement", "Prime d'ancienneté", "Prime exceptionnelle", "13e mois", "Prime de fin de contrat", "Autre"];

function Primes({ employees, primes, updatePrimes, primeTypes, updatePrimeTypes }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [type, setType] = useState(primeTypes[0]);
  const [montant, setMontant] = useState("");
  const [date, setDate] = useState(todayISO());
  const [note, setNote] = useState("");
  const [filterEmp, setFilterEmp] = useState("all");
  const [nouveauType, setNouveauType] = useState("");
  const [showTypeManager, setShowTypeManager] = useState(false);

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  useEffect(() => {
    if (!primeTypes.includes(type)) setType(primeTypes[0] || "");
  }, [primeTypes]);

  const addPrime = () => {
    if (!employeeId || !montant || Number(montant) <= 0) return;
    updatePrimes([
      ...primes,
      { id: uid(), employeeId, type, montant: Number(montant), date, note: note.trim() },
    ]);
    setMontant("");
    setNote("");
  };

  const removePrime = (id) => {
    updatePrimes(primes.filter((p) => p.id !== id));
  };

  const addType = () => {
    const val = nouveauType.trim();
    if (!val || primeTypes.includes(val)) return;
    updatePrimeTypes([...primeTypes, val]);
    setNouveauType("");
  };

  const removeType = (t) => {
    updatePrimeTypes(primeTypes.filter((x) => x !== t));
  };

  const totalParEmp = useMemo(() => {
    const map = {};
    for (const p of primes) {
      map[p.employeeId] = (map[p.employeeId] || 0) + p.montant;
    }
    return map;
  }, [primes]);

  const totalGeneral = Object.values(totalParEmp).reduce((s, v) => s + v, 0);

  const filtered = primes
    .filter((p) => filterEmp === "all" || p.employeeId === filterEmp)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const exportCSV = () => {
    const rows = [["Date", "Salarié", "Type", "Montant", "Note"]];
    filtered.forEach((p) => {
      const emp = employees.find((e) => e.id === p.employeeId);
      rows.push([p.date, emp?.nom || "?", p.type, p.montant, p.note || ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "primes.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Nouvelle prime</h2>
        <div className="flex flex-wrap gap-2">
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <select
            value={type}
            onChange={(e) => setType(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {primeTypes.map((t) => (
              <option key={t} value={t}>
                {t}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.01"
            min="0"
            placeholder="Montant (€)"
            value={montant}
            onChange={(e) => setMontant(e.target.value)}
            className="px-3 py-2 rounded border text-sm w-32"
            style={{ borderColor: PALETTE.line }}
          />
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
          <input
            type="text"
            placeholder="Note (optionnel)"
            value={note}
            onChange={(e) => setNote(e.target.value)}
            className="px-3 py-2 rounded border text-sm flex-1 min-w-[140px]"
            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addPrime}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
          </button>
        </div>
        <p className="text-xs mt-2" style={{ color: "#8A8271" }}>
          Les primes sont ajoutées au net estimé dans Simulation paie et Synthèse salarié pour la période où elles
          sont enregistrées.
        </p>
        <button
          onClick={() => setShowTypeManager((v) => !v)}
          className="text-xs mt-2 underline"
          style={{ color: PALETTE.green }}
        >
          {showTypeManager ? "Masquer" : "Gérer mes types de primes"}
        </button>
        {showTypeManager && (
          <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${PALETTE.line}` }}>
            <div className="flex flex-wrap gap-2 mb-2">
              {primeTypes.map((t) => (
                <span
                  key={t}
                  className="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs"
                  style={{ background: PALETTE.bg, border: `1px solid ${PALETTE.line}` }}
                >
                  {t}
                  <button onClick={() => removeType(t)} style={{ color: PALETTE.rust }} title="Supprimer ce type">
                    ×
                  </button>
                </span>
              ))}
            </div>
            <div className="flex gap-2">
              <input
                placeholder="Nouveau type de prime"
                value={nouveauType}
                onChange={(e) => setNouveauType(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && addType()}
                className="px-3 py-1.5 rounded border text-sm flex-1"
                style={{ borderColor: PALETTE.line }}
              />
              <button
                onClick={addType}
                style={{ background: PALETTE.green }}
                className="px-3 py-1.5 rounded text-white text-xs font-medium"
              >
                Ajouter
              </button>
            </div>
          </div>
        )}
      </div>

      <h3 className="font-semibold mb-2">Total par salarié</h3>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-6">
        {employees.map((emp, i) => {
          const total = totalParEmp[emp.id];
          if (!total) return null;
          return (
            <div
              key={emp.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <span>{emp.nom}</span>
              <strong style={{ color: PALETTE.green }}>{fmtEuros(total)}</strong>
            </div>
          );
        })}
        <div
          className="flex items-center justify-between px-4 py-2.5 text-sm font-semibold"
          style={{ borderTop: `1px solid ${PALETTE.line}`, background: PALETTE.bg }}
        >
          <span>Total général</span>
          <span style={{ color: PALETTE.green }}>{fmtEuros(totalGeneral)}</span>
        </div>
      </div>

      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <h3 className="font-semibold">Historique</h3>
        <div className="flex gap-2 items-center">
          <select
            value={filterEmp}
            onChange={(e) => setFilterEmp(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          >
            <option value="all">Tous les salariés</option>
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <button
            onClick={exportCSV}
            style={{ background: PALETTE.green }}
            className="px-3 py-1.5 rounded text-white text-xs font-medium flex items-center gap-1.5"
          >
            <Download size={14} /> CSV
          </button>
        </div>
      </div>

      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        {filtered.length === 0 && <div className="p-3 text-sm" style={{ color: "#8A8271" }}>Aucune prime.</div>}
        {filtered.map((p, i) => {
          const emp = employees.find((e) => e.id === p.employeeId);
          return (
            <div
              key={p.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm gap-2 flex-wrap"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <div>
                <span className="font-medium">{emp?.nom || "?"}</span>{" "}
                <span style={{ color: "#8A8271" }}>
                  · {p.type} · {p.date}
                  {p.note ? ` · ${p.note}` : ""}
                </span>
              </div>
              <div className="flex items-center gap-2">
                <strong style={{ color: PALETTE.green }}>+{fmtEuros(p.montant)}</strong>
                <button onClick={() => removePrime(p.id)} className="p-1.5 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                  <Trash2 size={14} />
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Parametres({
  tachesEcart,
  updateTachesEcart,
  heuresSup,
  updateHeuresSup,
  taches,
  updateTaches,
  heuresDefaut,
  updateHeuresDefaut,
  tauxCotisations,
  updateTauxCotisations,
  employees,
  updateEmployees,
  teams,
  updateTeams,
  entries,
  updateEntries,
  transactions,
  updateTransactions,
  pinCode,
  updatePinCode,
  lastBackupDate,
  updateLastBackupDate,
}) {
  const [nouvelleTache, setNouvelleTache] = useState("");
  const [editingTache, setEditingTache] = useState(null); // ancien nom en cours d'édition
  const [editValue, setEditValue] = useState("");
  const [restoreMsg, setRestoreMsg] = useState("");
  const [pinInput, setPinInput] = useState(pinCode || "");
  const [nettoyageMsg, setNettoyageMsg] = useState("");

  // Retire les entrées d'absence en double (même salarié + même jour, plusieurs entrées non
  // présentes) — garde celle qui a un motif renseigné en priorité, sinon la plus récente.
  const nettoyerDoublonsAbsences = () => {
    const absences = entries.filter((e) => !e.present);
    const groupes = {};
    absences.forEach((e) => {
      const cle = `${e.employeeId}|${e.date}`;
      if (!groupes[cle]) groupes[cle] = [];
      groupes[cle].push(e);
    });
    const idsAGarder = new Set();
    let doublonsSupprimes = 0;
    Object.values(groupes).forEach((groupe) => {
      if (groupe.length <= 1) {
        idsAGarder.add(groupe[0].id);
        return;
      }
      const avecMotif = groupe.filter((e) => e.motif);
      const choisi = (avecMotif.length > 0 ? avecMotif : groupe)[avecMotif.length > 0 ? avecMotif.length - 1 : groupe.length - 1];
      idsAGarder.add(choisi.id);
      doublonsSupprimes += groupe.length - 1;
    });
    if (doublonsSupprimes === 0) {
      setNettoyageMsg("Aucun doublon trouvé — vos données sont propres.");
      return;
    }
    const next = entries.filter((e) => e.present || idsAGarder.has(e.id));
    updateEntries(next);
    setNettoyageMsg(`${doublonsSupprimes} entrée(s) en double supprimée(s).`);
  };

  const exportBackup = () => {
    const backup = {
      version: 1,
      exportedAt: new Date().toISOString(),
      employees,
      teams,
      entries,
      transactions,
      config: { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations },
    };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pointage-sauvegarde-${todayISO()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    updateLastBackupDate(new Date().toISOString());
  };

  const importBackup = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || typeof data !== "object") throw new Error("format invalide");
        if (Array.isArray(data.employees)) updateEmployees(data.employees);
        if (Array.isArray(data.teams)) updateTeams(data.teams);
        if (Array.isArray(data.entries)) updateEntries(data.entries);
        if (Array.isArray(data.transactions)) updateTransactions(data.transactions);
        if (data.config) {
          if (Array.isArray(data.config.tachesEcart)) updateTachesEcart(data.config.tachesEcart);
          if (data.config.heuresSup) updateHeuresSup(data.config.heuresSup);
          if (Array.isArray(data.config.taches) && data.config.taches.length > 0) updateTaches(data.config.taches);
          if (data.config.heuresDefaut !== undefined) updateHeuresDefaut(data.config.heuresDefaut);
        }
        setRestoreMsg("Sauvegarde restaurée avec succès.");
      } catch (err) {
        setRestoreMsg("Fichier invalide — impossible de restaurer cette sauvegarde.");
      }
    };
    reader.readAsText(file);
  };

  const toggle = (tache) => {
    if (tachesEcart.includes(tache)) {
      updateTachesEcart(tachesEcart.filter((t) => t !== tache));
    } else {
      updateTachesEcart([...tachesEcart, tache]);
    }
  };

  const setHS = (patch) => updateHeuresSup({ ...heuresSup, ...patch });

  const addTache = () => {
    const val = nouvelleTache.trim();
    if (!val || taches.includes(val)) return;
    updateTaches([...taches, val]);
    setNouvelleTache("");
  };

  const removeTache = (t) => {
    updateTaches(taches.filter((x) => x !== t));
    if (tachesEcart.includes(t)) {
      updateTachesEcart(tachesEcart.filter((x) => x !== t));
    }
  };

  const startEdit = (t) => {
    setEditingTache(t);
    setEditValue(t);
  };

  const saveEdit = () => {
    const val = editValue.trim();
    if (!val || !editingTache) {
      setEditingTache(null);
      return;
    }
    if (val !== editingTache) {
      updateTaches(taches.map((t) => (t === editingTache ? val : t)));
      if (tachesEcart.includes(editingTache)) {
        updateTachesEcart(tachesEcart.map((t) => (t === editingTache ? val : t)));
      }
    }
    setEditingTache(null);
  };

  return (
    <div className="space-y-8">
      <div>
        <h2 className="font-semibold mb-1">Tâches</h2>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Ajoutez, renommez ou supprimez les tâches disponibles au pointage. Cochez celles pour lesquelles le temps
          réellement travaillé et le temps payé au salarié peuvent différer (ex : temps de route, forfait tâche) —

// ---------- Heures supplémentaires (weekly breakdown) ----------
function HeuresSup({ employees, entries, heuresSup }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  // Regroupe les heures par salarié puis par semaine/mois (selon le mode choisi) — effectives ET payées séparément
  const data = useMemo(() => {
    const byEmp = {};
    entries
      .filter((e) => e.present && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = overtimeGroupKey(e.date, heuresSup);
        if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
        if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
        byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
        byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    return byEmp;
  }, [entries, start, end, heuresSup]);

  const rate = (emp) => Number(emp.tauxHoraire) || 0;

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Heures supplémentaires — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> Exporter PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Seuils calculés sur les <strong>heures effectivement travaillées</strong> (pas les heures payées), par{" "}
        {heuresSup.mode === "mensuel" ? "mois (période choisie)" : "semaine"} : normal jusqu'à{" "}
        {heuresSup.mode === "mensuel" ? heuresSup.seuilNormalMensuel : heuresSup.seuilNormal}h, majoration{" "}
        {heuresSup.tauxMajo1}% sur les{" "}
        {heuresSup.mode === "mensuel"
          ? heuresSup.plageMajo1Mensuel
          : heuresSup.seuilMajo2 - heuresSup.seuilNormal}
        h suivantes, puis {heuresSup.tauxMajo2}% au-delà. Réglable dans Paramètres.
        {heuresSup.mode === "mensualise" && (
          <>
            {" "}
            En mode mensualisé, le montant « ≈ » ci-dessous ne montre que le surcoût des heures sup par semaine —
            la base fixe de {heuresSup.heuresBaseMensualisee}h n'est comptée qu'une fois par mois dans Simulation
            paie et Synthèse salarié.
          </>
        )}
      </p>

      {employees.length === 0 && <EmptyState text="Aucun salarié." />}

      <div className="space-y-4">
        {employees.map((emp) => {
          const weeks = data[emp.id];
          if (!weeks) return null;
          const weekKeys = Object.keys(weeks).sort();
          return (
            <div key={emp.id} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
              <div className="px-4 py-2.5 font-medium" style={{ background: PALETTE.bg, borderBottom: `1px solid ${PALETTE.line}` }}>
                {emp.nom}
              </div>
              {weekKeys.map((wk, i) => {
                const { eff, paye } = weeks[wk];
                const { normales, majo1, majo2 } = splitOvertime(overtimeBase(heuresSup, eff, paye), heuresSup);
                const extraPaye = heuresSup.base === "payees" ? 0 : Math.max(0, paye - eff);
                const r = rate(emp);
                // En mode mensualisé, la base fixe (151,67h) n'est comptée qu'une fois pour tout le mois
                // (voir Simulation paie) — ici, par semaine, on n'affiche que le surcoût des heures sup.
                const cost = r
                  ? (heuresSup.mode === "mensualise" ? 0 : normales * r) +
                    majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
                    majo2 * r * (1 + heuresSup.tauxMajo2 / 100) +
                    extraPaye * r
                  : null;
                return (
                  <div
                    key={wk}
                    className="px-4 py-2.5 text-sm"
                    style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
                  >
                    <div className="flex items-center justify-between flex-wrap gap-2">
                      <span style={{ color: "#6B6552" }}>{periodLabel(wk, heuresSup, start, end)}</span>
                      <span className="flex gap-3 flex-wrap">
                        <span>Normales : <strong>{fmtHours(normales)}</strong></span>
                        {majo1 > 0 && (
                          <span style={{ color: PALETTE.rust }}>
                            +{heuresSup.tauxMajo1}% : <strong>{fmtHours(majo1)}</strong>
                          </span>
                        )}
                        {majo2 > 0 && (
                          <span style={{ color: PALETTE.rust }}>
                            +{heuresSup.tauxMajo2}% : <strong>{fmtHours(majo2)}</strong>
                          </span>
                        )}
                        {extraPaye > 0 && (
                          <span style={{ color: "#8A8271" }}>
                            + payé hors travail effectif : <strong>{fmtHours(extraPaye)}</strong>
                          </span>
                        )}
                        {cost !== null && (
                          <span style={{ color: PALETTE.green }}>≈ {cost.toFixed(2)} €</span>
                        )}
                      </span>
                    </div>
                    <div className="text-xs mt-1" style={{ color: "#8A8271" }}>
                      {overtimeExplanation(normales, majo1, majo2, heuresSup)}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Simulation de paie (brut estimé + avances/acomptes/prêts) ----------
function SimulationPaie({ employees, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  // Brut estimé par salarié : regroupement par semaine ISO, avec majorations
  const bruts = useMemo(() => {
    const byEmp = {};
    entries
      .filter((e) => e.present && e.date >= start && e.date <= end)
      .forEach((e) => {
        const wk = overtimeGroupKey(e.date, heuresSup);
        if (!byEmp[e.employeeId]) byEmp[e.employeeId] = {};
        if (!byEmp[e.employeeId][wk]) byEmp[e.employeeId][wk] = { eff: 0, paye: 0 };
        byEmp[e.employeeId][wk].eff += Number(e.heuresEffectives || 0);
        byEmp[e.employeeId][wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
      });
    const result = {};
    for (const [empId, weeks] of Object.entries(byEmp)) {
      let normales = 0,
        majo1 = 0,
        majo2 = 0,
        extraPaye = 0;
      Object.values(weeks).forEach(({ eff, paye }) => {
        const s = splitOvertime(overtimeBase(heuresSup, eff, paye), heuresSup);
        normales += s.normales;
        majo1 += s.majo1;
        majo2 += s.majo2;
        if (heuresSup.base !== "payees") extraPaye += Math.max(0, paye - eff);
      });
      result[empId] = { normales, majo1, majo2, extraPaye };
    }
    return result;
  }, [entries, start, end, heuresSup]);

  // Avances/acomptes/prêts/remboursements de la période, par salarié
  const mouvements = useMemo(() => {
    const byEmp = {};
    transactions
      .filter((t) => txDeductionDate(t) >= start && txDeductionDate(t) <= end)
      .forEach((t) => {
        if (!byEmp[t.employeeId]) byEmp[t.employeeId] = { avance: 0, acompte: 0, pret: 0, remboursement: 0, loyer: 0 };
        byEmp[t.employeeId][t.type] += t.montant;
      });
    return byEmp;
  }, [transactions, start, end]);

  // Primes de la période, par salarié
  const primesParEmp = useMemo(() => {
    const byEmp = {};
    primes
      .filter((p) => p.date >= start && p.date <= end)
      .forEach((p) => {
        byEmp[p.employeeId] = (byEmp[p.employeeId] || 0) + p.montant;
      });
    return byEmp;
  }, [primes, start, end]);

  const rate = (emp) => Number(emp.tauxHoraire) || 0;

  const lignes = employees.map((emp) => {
    const b = bruts[emp.id] || { normales: 0, majo1: 0, majo2: 0, extraPaye: 0 };
    const r = rate(emp);
    const mensualise = heuresSup.mode === "mensualise";
    const conges = congesPayesMontant(emp, entries, heuresDefaut, start, end);
    const { joursAbsenceNonPayee, retenueHeures, datesAbsenceNonPayee } = mensualise
      ? absenceRetenueInfo(emp, entries, start, end, heuresDefaut)
      : { joursAbsenceNonPayee: 0, retenueHeures: 0, datesAbsenceNonPayee: [] };
    const baseNominale = mensualise ? baseNominaleProratisee(emp, start, end, heuresSup.heuresBaseMensualisee) : 0;
    const baseAjustee = mensualise ? Math.max(0, baseNominale - retenueHeures) : 0;
    // En mode mensualisé, les jours de congé payé comptent comme des heures normales pour ne pas
    // faire artificiellement chuter la base (sinon la ligne "heures non travaillées" les compterait
    // comme un manque, alors que l'indemnité congés payés viendrait les rajouter séparément —
    // double comptage). Les congés payés sont donc inclus ici, et ne sont plus ajoutés à part.
    const { base: heuresBase, excedent: heuresExcedent } = mensualise
      ? splitBaseEtExcedent(b.normales + b.extraPaye + conges.heures, baseAjustee)
      : { base: 0, excedent: 0 };
    const brut = r
      ? (mensualise ? (heuresBase + heuresExcedent) * r : b.normales * r + b.extraPaye * r + conges.montant) +
        b.majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
        b.majo2 * r * (1 + heuresSup.tauxMajo2 / 100)
      : 0;
    const primesMontant = primesParEmp[emp.id] || 0;
    // Les primes sont soumises aux cotisations, comme le salaire normal. Les congés payés le sont
    // aussi, mais sont déjà inclus dans "brut" (dans les deux branches ci-dessus) — ne pas les
    // rajouter ici, sinon ils seraient comptés deux fois dans le net.
    const cotisations = (brut + primesMontant) * (Number(tauxCotisations) / 100);
    const m = mouvements[emp.id] || { avance: 0, acompte: 0, pret: 0, remboursement: 0, loyer: 0 };
    const loyerAuto = loyerPourPeriode(emp, start, end);
    const deductions = m.avance + m.acompte + m.remboursement + loyerAuto;
    const net = brut - cotisations - deductions + primesMontant;
    return {
      emp,
      b,
      brut,
      cotisations,
      m,
      deductions,
      loyerAuto,
      conges,
      primesMontant,
      baseNominale,
      heuresBase,
      heuresExcedent,
      joursAbsenceNonPayee,
      datesAbsenceNonPayee,
      retenueHeures,
      net,
    };
  });

  const totalBrut = lignes.reduce((s, l) => s + l.brut, 0);
  const totalCotisations = lignes.reduce((s, l) => s + l.cotisations, 0);
  const totalDeductions = lignes.reduce((s, l) => s + l.deductions, 0);
  const totalPrimes = lignes.reduce((s, l) => s + l.primesMontant, 0);
  const totalNet = lignes.reduce((s, l) => s + l.net, 0);

  const exportCSV = () => {
    const rows = [
      [
        "Salarié",
        "Heures normales",
        "Heures majo 1",
        "Heures majo 2",
        "Brut estimé (€)",
        "Cotisations salariales (€)",
        "Avances/acomptes/remboursements période (€)",
        "Net estimé (€)",
      ],
    ];
    lignes.forEach((l) => {
      rows.push([
        l.emp.nom,
        l.b.normales.toFixed(2),
        l.b.majo1.toFixed(2),
        l.b.majo2.toFixed(2),
        l.brut.toFixed(2),
        l.cotisations.toFixed(2),
        l.deductions.toFixed(2),
        l.net.toFixed(2),
      ]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `simulation_paie_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Simulation de paie — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> CSV
        </button>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Mode de calcul des heures sup :{" "}
        <strong>
          {heuresSup.mode === "mensuel"
            ? `mensuel simplifié — ${heuresSup.seuilNormalMensuel}h normales, +${heuresSup.tauxMajo1}% sur les ${heuresSup.plageMajo1Mensuel}h suivantes, +${heuresSup.tauxMajo2}% au-delà`
            : heuresSup.mode === "mensualise"
            ? `mensualisé — base fixe de ${heuresSup.heuresBaseMensualisee}h, heures sup calculées semaine par semaine (seuil ${heuresSup.seuilNormal}h)`
            : `hebdomadaire — ${heuresSup.seuilNormal}h normales, +${heuresSup.tauxMajo1}% de ${heuresSup.seuilNormal + 1}h à ${heuresSup.seuilMajo2}h, +${heuresSup.tauxMajo2}% au-delà`}
        </strong>{" "}
        (réglable dans Paramètres). Estimation indicative à partir des heures pointées et du taux horaire de chaque
        salarié. Le net déduit un taux de cotisations sociales estimé ({tauxCotisations}%, sur brut + congés payés +
        primes) ainsi que les avances/acomptes de la période — ceci reste indicatif, pas une fiche de paie officielle.
      </p>

      <div className="space-y-2">
        {lignes.map(
          ({ emp, b, brut, cotisations, m, deductions, loyerAuto, conges, primesMontant, heuresBase, heuresExcedent, baseNominale, joursAbsenceNonPayee, retenueHeures, datesAbsenceNonPayee, net }) => {
          const hasRate = Number(emp.tauxHoraire) > 0;
          return (
            <div
              key={emp.id}
              style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
              className="rounded-md p-3"
            >
              <div className="flex items-center justify-between flex-wrap gap-2 mb-2">
                <span className="font-medium">{emp.nom}</span>
                <span className="font-semibold" style={{ color: PALETTE.green }}>
                  Net estimé : {fmtEuros(net)}
                </span>
              </div>
              {!hasRate ? (
                <div className="text-xs" style={{ color: PALETTE.rust }}>
                  Aucun taux horaire renseigné (onglet Salariés) — impossible d'estimer le brut.
                  {primesMontant > 0 && ` Primes de la période : ${fmtEuros(primesMontant)}.`}
                </div>
              ) : (
                <div className="text-xs space-y-1" style={{ color: "#6B6552" }}>
                  {heuresSup.mode === "mensualise" ? (
                    <>
                      <div className="flex justify-between">
                        <span>Salaire de base{Number(emp.heuresBaseMensuelle) > 0 ? " (temps partiel)" : ""}</span>
                        <span>{fmtHoursDecimal(baseRefFor(emp, heuresSup))}</span>
                      </div>
                      {baseNominale < baseRefFor(emp, heuresSup) - 0.01 && (
                        <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                          <span>
                            − Prorata (entrée{emp.dateDebutContrat && emp.dateDebutContrat > start ? ` le ${emp.dateDebutContrat}` : ""}
                            {(emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && emp.dateFinContrat && emp.dateFinContrat < end
                              ? ` / sortie le ${emp.dateFinContrat}`
                              : ""}
                            )
                          </span>
                          <span>{fmtHours(baseRefFor(emp, heuresSup) - baseNominale)}</span>
                        </div>
                      )}
                      {retenueHeures > 0 && (
                        <>
                          <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                            <span>
                              − Absence non payée ({joursAbsenceNonPayee} j{joursAbsenceNonPayee > 1 ? "ours" : "our"})
                            </span>
                            <span>{fmtHours(retenueHeures)}</span>
                          </div>
                          <div className="pl-3" style={{ color: "#8A8271" }}>
                            {datesAbsenceNonPayee.map((a) => `${fmtDateLong(a.date)} (${a.motif})`).join(" · ")}
                          </div>
                        </>
                      )}
                      {conges.jours > 0 && (
                        <>
                          <div className="flex justify-between" style={{ color: "#8A8271" }}>
                            <span>dont congés payés inclus dans la base</span>
                            <span>
                              {conges.jours} j ({fmtHours(conges.heures)})
                            </span>
                          </div>
                          <div className="pl-3" style={{ color: "#8A8271" }}>
                            {conges.datesConges.map((d) => fmtDateLong(d)).join(" · ")}
                          </div>
                        </>
                      )}
                      {heuresExcedent > 0 && (
                        <div className="flex justify-between">
                          <span>Heures normales 100% (au-delà de la base)</span>
                          <span>{fmtHours(heuresExcedent)}</span>
                        </div>
                      )}
                      {b.majo1 > 0 && (
                        <div className="flex justify-between">
                          <span>Heures sup +{heuresSup.tauxMajo1}%</span>
                          <span>{fmtHours(b.majo1)}</span>
                        </div>
                      )}
                      {b.majo2 > 0 && (
                        <div className="flex justify-between">
                          <span>Heures sup +{heuresSup.tauxMajo2}%</span>
                          <span>{fmtHours(b.majo2)}</span>
                        </div>
                      )}
                    </>
                  ) : (
                    <div style={{ color: "#8A8271" }}>
                      {overtimeExplanation(b.normales, b.majo1, b.majo2, heuresSup)}
                      {b.extraPaye > 0 ? ` · +${fmtHours(b.extraPaye)} payées hors travail effectif` : ""}
                    </div>
                  )}
                  <div className="flex justify-between pt-1" style={{ borderTop: `1px solid ${PALETTE.line}` }}>
                    <span>Brut estimé</span>
                    <strong>{fmtEuros(brut)}</strong>
                  </div>
                  <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                    <span>− Cotisations ({tauxCotisations}%)</span>
                    <strong>{fmtEuros(cotisations)}</strong>
                  </div>
                  {m.avance > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                      <span>− Avances</span>
                      <strong>{fmtEuros(m.avance)}</strong>
                    </div>
                  )}
                  {m.acompte > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                      <span>− Acomptes</span>
                      <strong>{fmtEuros(m.acompte)}</strong>
                    </div>
                  )}
                  {m.remboursement > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                      <span>− Remboursement(s) prêt</span>
                      <strong>{fmtEuros(m.remboursement)}</strong>
                    </div>
                  )}
                  {loyerAuto > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                      <span>− Loyer (auto)</span>
                      <strong>{fmtEuros(loyerAuto)}</strong>
                    </div>
                  )}
                  {heuresSup.mode !== "mensualise" && conges.montant > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.green }}>
                      <span>+ Congés payés ({conges.jours} j, maintien de salaire)</span>
                      <strong>{fmtEuros(conges.montant)}</strong>
                    </div>
                  )}
                  {primesMontant > 0 && (
                    <div className="flex justify-between" style={{ color: PALETTE.green }}>
                      <span>+ Primes</span>
                      <strong>{fmtEuros(primesMontant)}</strong>
                    </div>
                  )}
                  <div className="flex justify-between pt-1 mt-1 font-semibold" style={{ borderTop: `1px solid ${PALETTE.line}`, color: PALETTE.green }}>
                    <span>= Net estimé</span>
                    <strong>{fmtEuros(net)}</strong>
                  </div>
                  {m.pret > 0 && (
                    <div className="pt-1" style={{ color: "#8A8271" }}>
                      Prêt(s) versé(s) ce mois : {fmtEuros(m.pret)} (capital prêté, ne réduit pas le net — voir Avances)
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div
        style={{ background: PALETTE.bg, border: `1px solid ${PALETTE.line}` }}
        className="rounded-md p-3 mt-4 flex flex-wrap justify-between gap-2 text-sm font-semibold"
      >
        <span>Total brut estimé : {fmtEuros(totalBrut)}</span>
        <span style={{ color: PALETTE.rust }}>− Cotisations : {fmtEuros(totalCotisations)}</span>
        <span style={{ color: PALETTE.rust }}>− Avances/acomptes/remboursements : {fmtEuros(totalDeductions)}</span>
        <span style={{ color: PALETTE.green }}>+ Primes : {fmtEuros(totalPrimes)}</span>
        <span style={{ color: PALETTE.green }}>= Net estimé : {fmtEuros(totalNet)}</span>
      </div>
    </div>
  );
}


// ---------- Absences par salarié ----------
function Absences({ employees, entries }) {
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());

  const filtered = entries.filter((e) => e.date >= start && e.date <= end);

  // Jours où au moins un pointage a été fait (pour ne pas compter les jours non travaillés) — le
  // samedi est inclus (jour ouvrable comme partout ailleurs dans l'appli), seul le dimanche et les
  // jours fériés sont exclus.
  const joursPointes = useMemo(() => {
    const set = new Set(filtered.map((e) => e.date));
    return Array.from(set)
      .filter((d) => new Date(d + "T00:00:00").getDay() !== 0 && !isJourFerie(d))
      .sort();
  }, [filtered]);

  // Pour chaque salarié : liste des jours où il n'était pas présent. Lundi-vendredi : si le jour a
  // été pointé pour d'autres salariés mais pas pour lui, c'est probablement un oubli → signalé
  // « Non pointé ». Le samedi n'étant pas systématique, on ne signale QUE les absences explicitement
  // déclarées (une entrée existe réellement, congé payé auto-généré depuis le vendredi inclus) —
  // jamais une absence déduite du simple fait qu'il n'a pas de pointage ce jour-là.
  const absences = useMemo(() => {
    const byEmp = {};
    employees.forEach((emp) => {
      const list = [];
      joursPointes.forEach((date) => {
        const estSamedi = new Date(date + "T00:00:00").getDay() === 6;
        const entry = filtered.find((e) => e.date === date && e.employeeId === emp.id);
        const present = entry ? entry.present : false;
        if (present) return;
        if (estSamedi && !entry) return; // samedi sans aucune entrée : pas d'absence déduite
        list.push({ date, motif: entry?.motif || "Non pointé" });
      });
      byEmp[emp.id] = list;
    });
    return byEmp;
  }, [employees, joursPointes, filtered]);

  const exportCSV = () => {
    const rows = [["Salarié", "Date", "Motif"]];
    employees.forEach((emp) => {
      (absences[emp.id] || []).forEach((a) => {
        rows.push([emp.nom, a.date, a.motif]);
      });
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `absences_${start}_${end}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Absences — Habitation Ressource</div>
        <div className="text-sm">
          Du {start} au {end}
        </div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-4 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportCSV}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> CSV
        </button>
        <button
          onClick={() => window.print()}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF
        </button>
      </div>

      <p className="text-xs mb-4" style={{ color: "#8A8271" }}>
        Compte les jours où du pointage a eu lieu ({joursPointes.length} jour(s) sur la période) et où le salarié
        n'était pas marqué présent. Un salarié jamais pointé sur un jour où d'autres l'ont été apparaît comme «
        Non pointé ».
      </p>

      <div className="space-y-2">
        {employees.map((emp) => {
          const list = absences[emp.id] || [];
          return (
            <div key={emp.id} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
              <div className="px-4 py-2.5 flex items-center justify-between" style={{ background: PALETTE.bg }}>
                <span className="font-medium">{emp.nom}</span>
                <span
                  className="text-sm font-semibold"
                  style={{ color: list.length > 0 ? PALETTE.rust : "#8A8271" }}
                >
                  {list.length} absence{list.length > 1 ? "s" : ""}
                </span>
              </div>
              {list.length > 0 && (
                <div className="px-4 py-2 text-xs space-y-1">
                  {list.map((a) => (
                    <div key={a.date} className="flex justify-between" style={{ color: "#6B6552" }}>
                      <span>{fmtDateLong(a.date)}</span>
                      <span style={{ color: a.motif === "Non pointé" ? "#B5AA88" : PALETTE.rust }}>{a.motif}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Congés & absences (déclaration multi-jours + solde CP) ----------
function CongesAbsences({ employees, updateEmployees, entries, updateEntries, taches }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [motif, setMotif] = useState(ABSENCE_MOTIFS[0]);
  const [debut, setDebut] = useState(todayISO());
  const [fin, setFin] = useState(todayISO());
  const [filterEmp, setFilterEmp] = useState("all");
  const [msg, setMsg] = useState("");

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  // Liste des dates en jours ouvrables (lundi-samedi, hors dimanche et jours fériés) entre début et fin inclus
  const datesRange = (d1, d2) => {
    const dates = [];
    let cur = new Date(d1 + "T00:00:00");
    const last = new Date(d2 + "T00:00:00");
    while (cur <= last) {
      const iso = cur.toISOString().slice(0, 10);
      // Jours ouvrables : le samedi compte, dimanche et jours fériés sont exclus
      if (cur.getDay() !== 0 && !isJourFerie(iso)) dates.push(iso);
      cur.setDate(cur.getDate() + 1);
    }
    return dates;
  };

  const declarer = () => {
    if (!employeeId || !debut || !fin || debut > fin) return;
    const dates = datesRange(debut, fin);
    if (dates.length === 0) {
      setMsg("Aucun jour ouvrable dans cette plage (uniquement des dimanches ou jours fériés).");
      return;
    }
    // Retire toutes les entrées existantes de ce salarié sur ces dates (postes ou absence), puis pose l'absence
    let next = entries.filter((e) => !(e.employeeId === employeeId && dates.includes(e.date)));
    dates.forEach((date) => {
      next = [
        ...next,
        {
          id: uid(),
          date,
          employeeId,
          present: false,
          motif,
          heuresEffectives: 0,
          heuresPayees: 0,
          tache: taches[0],
          parcelle: "",
          note: "",
        },
      ];
    });
    updateEntries(next);
    setMsg(`${dates.length} jour(s) enregistré(s) en « ${motif} ».`);
  };

  // Toutes les absences/congés explicitement déclarés (motif renseigné)
  const declarations = entries
    .filter((e) => !e.present && e.motif && (filterEmp === "all" || e.employeeId === filterEmp))
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const supprimer = (id) => {
    updateEntries(entries.filter((e) => e.id !== id));
  };

  const updateJoursAcquis = (empId, value) => {
    updateEmployees(employees.map((e) => (e.id === empId ? { ...e, joursCPAcquis: value } : e)));
  };

  // Solde congés payés par salarié : jours acquis (saisi manuellement) - jours de CP pris (tous temps)
  const soldesCP = employees.map((emp) => {
    const pris = entries.filter((e) => e.employeeId === emp.id && !e.present && e.motif === "Congé payé").length;
    const acquis = Number(emp.joursCPAcquis) || 0;
    return { emp, pris, acquis, solde: acquis - pris };
  });

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      {/* Déclarer un congé/absence */}
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Déclarer un congé ou une absence</h2>
        <div className="flex flex-wrap gap-2 items-end">
          <div>
            <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
              Salarié
            </label>
            <select
              value={employeeId}
              onChange={(e) => setEmployeeId(e.target.value)}
              className="px-2 py-2 rounded border text-sm min-w-[150px]"
              style={{ borderColor: PALETTE.line }}
            >
              {employees.map((emp) => (
                <option key={emp.id} value={emp.id}>
                  {emp.nom}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
              Motif
            </label>
            <select
              value={motif}
              onChange={(e) => setMotif(e.target.value)}
              className="px-2 py-2 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            >
              {ABSENCE_MOTIFS.map((m) => (
                <option key={m} value={m}>
                  {m}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
              Du
            </label>
            <input
              type="date"
              value={debut}
              onChange={(e) => setDebut(e.target.value)}
              className="px-2 py-2 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
          <div>
            <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
              Au
            </label>
            <input
              type="date"
              value={fin}
              onChange={(e) => setFin(e.target.value)}
              className="px-2 py-2 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
          <button
            onClick={declarer}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Enregistrer
          </button>
        </div>
        <p className="text-xs mt-2" style={{ color: "#8A8271" }}>
          Comptage en jours ouvrables : le samedi est inclus, le dimanche et les jours fériés légaux sont exclus
          automatiquement. Un jour
          déjà pointé présent sera écrasé par cette
          déclaration.
        </p>
        {msg && (
          <p className="text-xs mt-2" style={{ color: PALETTE.green }}>
            {msg}
          </p>
        )}
      </div>

      {/* Solde congés payés */}
      <h3 className="font-semibold mb-2">Solde de congés payés</h3>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden mb-6">
        {soldesCP.map(({ emp, pris, acquis, solde }, i) => (
          <div
            key={emp.id}
            className="flex items-center justify-between px-4 py-2.5 text-sm flex-wrap gap-2"
            style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
          >
            <span className="font-medium">{emp.nom}</span>
            <div className="flex items-center gap-3 text-xs" style={{ color: "#8A8271" }}>
              <span>Pris : {pris} j</span>
              <span className="flex items-center gap-1">
                Acquis :
                <input
                  type="number"
                  step="0.5"
                  value={emp.joursCPAcquis ?? ""}
                  onChange={(e) => updateJoursAcquis(emp.id, e.target.value)}
                  className="w-16 px-1.5 py-1 rounded border text-xs"
                  style={{ borderColor: PALETTE.line }}
                />
                j
              </span>
              <span className="font-semibold" style={{ color: solde < 0 ? PALETTE.rust : PALETTE.green }}>
                Solde : {solde} j
              </span>
            </div>
          </div>
        ))}
      </div>
      <p className="text-xs mb-6" style={{ color: "#8A8271" }}>
        « Jours acquis » se met à jour manuellement (ex : 2,5 jours par mois travaillé selon la règle habituelle) —
        le solde se recalcule automatiquement en fonction des congés payés déclarés ci-dessus.
      </p>

      {/* Historique des déclarations */}
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <h3 className="font-semibold">Historique des déclarations</h3>
        <select
          value={filterEmp}
          onChange={(e) => setFilterEmp(e.target.value)}
          className="px-2 py-1.5 rounded border text-sm"
          style={{ borderColor: PALETTE.line }}
        >
          <option value="all">Tous les salariés</option>
          {employees.map((emp) => (
            <option key={emp.id} value={emp.id}>
              {emp.nom}
            </option>
          ))}
        </select>
      </div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        {declarations.length === 0 && (
          <div className="p-3 text-sm" style={{ color: "#8A8271" }}>
            Aucune déclaration.
          </div>
        )}
        {declarations.map((d, i) => {
          const emp = employees.find((e) => e.id === d.employeeId);
          return (
            <div
              key={d.id}
              className="flex items-center justify-between px-4 py-2.5 text-sm"
              style={{ borderTop: i === 0 ? "none" : `1px solid ${PALETTE.line}` }}
            >
              <span>
                <span className="font-medium">{emp?.nom || "?"}</span>{" "}
                <span style={{ color: "#8A8271" }}>
                  · {d.date} · {d.motif}
                </span>
              </span>
              <button onClick={() => supprimer(d.id)} className="p-1.5 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                <Trash2 size={14} />
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ---------- Synthèse par salarié (tout regroupé pour une période) ----------
// ---------- Calcul des données de synthèse pour un salarié (réutilisé pour l'impression groupée) ----------
function computeSyntheseData(emp, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end) {
  const employeeId = emp.id;
  const joursPointes = Array.from(
    new Set(entries.filter((e) => e.date >= start && e.date <= end).map((e) => e.date))
  )
    .filter((d) => new Date(d + "T00:00:00").getDay() !== 0 && !isJourFerie(d))
    .sort();

  const entriesEmp = entries.filter((e) => e.employeeId === employeeId && e.date >= start && e.date <= end);
  const presences = entriesEmp.filter((e) => e.present);
  const totalEff = presences.reduce((s, e) => s + Number(e.heuresEffectives || 0), 0);
  const totalPaye = presences.reduce((s, e) => s + Number(e.heuresPayees ?? e.heuresEffectives ?? 0), 0);

  const weeks = {};
  presences.forEach((e) => {
    const wk = overtimeGroupKey(e.date, heuresSup);
    if (!weeks[wk]) weeks[wk] = { eff: 0, paye: 0 };
    weeks[wk].eff += Number(e.heuresEffectives || 0);
    weeks[wk].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
  });
  let normales = 0,
    majo1 = 0,
    majo2 = 0,
    extraPaye = 0;
  Object.values(weeks).forEach(({ eff, paye }) => {
    const s = splitOvertime(overtimeBase(heuresSup, eff, paye), heuresSup);
    normales += s.normales;
    majo1 += s.majo1;
    majo2 += s.majo2;
    if (heuresSup.base !== "payees") extraPaye += Math.max(0, paye - eff);
  });
  const heuresSupCalc = { normales, majo1, majo2, extraPaye };

  const parTacheMap = {};
  presences.forEach((e) => {
    if (!parTacheMap[e.tache]) parTacheMap[e.tache] = { eff: 0, paye: 0, jours: 0 };
    parTacheMap[e.tache].eff += Number(e.heuresEffectives || 0);
    parTacheMap[e.tache].paye += Number(e.heuresPayees ?? e.heuresEffectives ?? 0);
    parTacheMap[e.tache].jours += 1;
  });
  const parTache = Object.entries(parTacheMap).sort((a, b) => b[1].paye - a[1].paye);

  // Lundi-vendredi : absence déduite si le jour est pointé pour d'autres mais pas pour lui. Le
  // samedi n'étant pas systématique, on ne retient que les absences explicitement déclarées (une
  // entrée existe réellement) — jamais une absence déduite de la simple absence de pointage.
  const absences = joursPointes
    .filter((date) => {
      const entry = entries.find((e) => e.date === date && e.employeeId === employeeId);
      if (entry && entry.present) return false;
      const estSamedi = new Date(date + "T00:00:00").getDay() === 6;
      if (estSamedi && !entry) return false;
      return true;
    })
    .map((date) => {
      const entry = entries.find((e) => e.date === date && e.employeeId === employeeId);
      return { date, motif: entry?.motif || "Non pointé" };
    });

  const mouvementsPeriode = transactions.filter((t) => t.employeeId === employeeId && txDeductionDate(t) >= start && txDeductionDate(t) <= end);
  const soldeTotal = transactions
    .filter((t) => t.employeeId === employeeId && t.type !== "loyer")
    .reduce((s, t) => s + (t.type === "remboursement" ? -t.montant : t.montant), 0);

  const r = Number(emp?.tauxHoraire) || 0;
  const mensualise = heuresSup.mode === "mensualise";
  const conges = congesPayesMontant(emp, entries, heuresDefaut, start, end);
  const { joursAbsenceNonPayee, retenueHeures, datesAbsenceNonPayee } = mensualise
    ? absenceRetenueInfo(emp, entries, start, end, heuresDefaut)
    : { joursAbsenceNonPayee: 0, retenueHeures: 0, datesAbsenceNonPayee: [] };
  const baseNominale = mensualise ? baseNominaleProratisee(emp, start, end, heuresSup.heuresBaseMensualisee) : 0;
  const baseAjustee = mensualise ? Math.max(0, baseNominale - retenueHeures) : 0;
  // En mode mensualisé, les congés payés comptent comme des heures normales dans la base (voir la
  // note détaillée dans SimulationPaie) — pas ajoutés une seconde fois séparément.
  const { base: heuresBase, excedent: heuresExcedent } = mensualise
    ? splitBaseEtExcedent(heuresSupCalc.normales + heuresSupCalc.extraPaye + conges.heures, baseAjustee)
    : { base: 0, excedent: 0 };
  const brut = r
    ? (mensualise
        ? (heuresBase + heuresExcedent) * r
        : heuresSupCalc.normales * r + heuresSupCalc.extraPaye * r + conges.montant) +
      heuresSupCalc.majo1 * r * (1 + heuresSup.tauxMajo1 / 100) +
      heuresSupCalc.majo2 * r * (1 + heuresSup.tauxMajo2 / 100)
    : 0;
  const primesPeriode = primes.filter((p) => p.employeeId === employeeId && p.date >= start && p.date <= end);
  const primesMontant = primesPeriode.reduce((s, p) => s + p.montant, 0);
  // Les primes sont soumises aux cotisations comme le salaire normal. Les congés payés le sont
  // aussi, mais sont déjà inclus dans "brut" (dans les deux branches ci-dessus) — ne pas les
  // rajouter ici, sinon ils seraient comptés deux fois dans le net.
  const cotisations = (brut + primesMontant) * (Number(tauxCotisations) / 100);
  const avancesPeriode = mouvementsPeriode.filter((t) => t.type === "avance").reduce((s, t) => s + t.montant, 0);
  const acomptesPeriode = mouvementsPeriode.filter((t) => t.type === "acompte").reduce((s, t) => s + t.montant, 0);
  const remboursementsPeriode = mouvementsPeriode.filter((t) => t.type === "remboursement").reduce((s, t) => s + t.montant, 0);
  const loyerPeriode = loyerPourPeriode(emp, start, end);
  const deductionsPeriode = avancesPeriode + acomptesPeriode + remboursementsPeriode + loyerPeriode;
  const net = brut - cotisations - deductionsPeriode + primesMontant;

  return {
    presences,
    totalEff,
    totalPaye,
    heuresSupCalc,
    baseNominale,
    heuresBase,
    heuresExcedent,
    joursAbsenceNonPayee,
    datesAbsenceNonPayee,
    retenueHeures,
    parTache,
    absences,
    mouvementsPeriode,
    soldeTotal,
    r,
    brut,
    cotisations,
    avancesPeriode,
    acomptesPeriode,
    remboursementsPeriode,
    loyerPeriode,
    deductionsPeriode,
    primesPeriode,
    primesMontant,
    conges,
    net,
  };
}

// ---------- Contenu d'une fiche salarié (réutilisé à l'écran et à l'impression groupée) ----------
function FicheSalarieContent({ emp, data, start, end, heuresSup, tauxCotisations, pageBreak }) {

    presences,
    totalEff,
    totalPaye,
    heuresSupCalc,
    baseNominale,
    heuresBase,
    heuresExcedent,
    joursAbsenceNonPayee,
    datesAbsenceNonPayee,
    retenueHeures,
    parTache,
    absences,
    mouvementsPeriode,
    soldeTotal,
    r,
    brut,
    cotisations,
    avancesPeriode,
    acomptesPeriode,
    remboursementsPeriode,
    loyerPeriode,
    primesMontant,
    conges,
    net,
  } = data;
  return (
    <div className="space-y-5" style={pageBreak ? { pageBreakBefore: "always" } : undefined}>
      {/* En-tête fiche */}
      <div style={{ background: PALETTE.greenDark }} className="rounded-md p-4 text-white">
        <div className="text-xl font-bold">{emp.nom}</div>
        <div className="text-sm opacity-80">
          {emp.poste || "Poste non renseigné"}
          {emp.tauxHoraire ? ` · ${emp.tauxHoraire} €/h` : " · Taux horaire non renseigné"}
        </div>
        <div className="text-xs opacity-70 mt-1">
          Du {start} au {end}
        </div>
      </div>

      {/* Heures */}
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-semibold">Heures</h3>
          <span className="text-xs" style={{ color: "#8A8271" }}>
            Heures sup : mode{" "}
            {heuresSup.mode === "mensuel" ? "mensuel simplifié" : heuresSup.mode === "mensualise" ? "mensualisé" : "hebdomadaire"}
          </span>
        </div>
        <div className="grid grid-cols-2 gap-3 text-sm">
          <div>
            <div style={{ color: "#8A8271" }} className="text-xs">
              Jours présent
            </div>
            <div className="font-semibold">{presences.length}</div>
          </div>
          <div>
            <div style={{ color: "#8A8271" }} className="text-xs">
              Heures effectives
            </div>
            <div className="font-semibold">{fmtHours(totalEff)}</div>
          </div>
          <div>
            <div style={{ color: "#8A8271" }} className="text-xs">
              Heures payées
            </div>
            <div className="font-semibold">{fmtHours(totalPaye)}</div>
          </div>
          <div>
            <div style={{ color: "#8A8271" }} className="text-xs">
              Dont majorées
            </div>
            <div className="font-semibold" style={{ color: PALETTE.rust }}>
              {fmtHours(heuresSupCalc.majo1 + heuresSupCalc.majo2)}
            </div>
          </div>
        </div>
        {(heuresSupCalc.normales > 0 || heuresSupCalc.majo1 > 0 || heuresSupCalc.majo2 > 0 || heuresSupCalc.extraPaye > 0) && (
          <div className="text-xs mt-3 pt-3" style={{ borderTop: `1px solid ${PALETTE.line}`, color: "#6B6552" }}>
            <div>{overtimeExplanation(heuresSupCalc.normales, heuresSupCalc.majo1, heuresSupCalc.majo2, heuresSup)}</div>
            {heuresSupCalc.extraPaye > 0 && <div className="mt-1">Payé hors travail effectif : {fmtHours(heuresSupCalc.extraPaye)}</div>}

        )}
      </div>

      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        <h3 className="font-semibold px-4 pt-4 pb-2">Répartition par tâche</h3>
        {parTache.length === 0 && (
          <div className="px-4 pb-4 text-sm" style={{ color: "#8A8271" }}>
            Aucune donnée sur cette période.
          </div>
        )}
        {parTache.map(([tache, stats], i) => (
          <div
            key={tache}
            className="flex items-center justify-between px-4 py-2.5 text-sm"
            style={{ borderTop: i === 0 ? `1px solid ${PALETTE.line}` : `1px solid ${PALETTE.line}` }}
          >

            <strong>{fmtHours(stats.paye)}</strong>

      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
        <div className="flex items-center justify-between px-4 pt-4 pb-2">
          <h3 className="font-semibold">Absences</h3>
          <span className="text-sm font-semibold" style={{ color: absences.length > 0 ? PALETTE.rust : "#8A8271" }}>

                <span>{fmtDateLong(a.date)}</span>
                <span style={{ color: a.motif === "Non pointé" ? "#B5AA88" : PALETTE.rust }}>{a.motif}</span>

        <div className="flex items-center justify-between px-4 pt-4 pb-2">
          <h3 className="font-semibold">Avances, acomptes et prêts</h3>
          <span className="text-sm font-semibold" style={{ color: PALETTE.rust }}>
            Solde total dû : {fmtEuros(soldeTotal)}
          </span>
        </div>
        {mouvementsPeriode.length === 0 ? (
          <div className="px-4 pb-4 text-sm" style={{ color: "#8A8271" }}>

          <div className="px-4 pb-4 text-xs space-y-1">
            {mouvementsPeriode
              .slice()
              .sort((a, b) => a.date.localeCompare(b.date))
              .map((t) => (
                <div key={t.id} className="flex justify-between" style={{ color: "#6B6552" }}>
                  <span>
                    {t.date} · {TX_TYPES.find((x) => x.id === t.type)?.label}
                  </span>
                  <strong style={{ color: t.type === "remboursement" ? PALETTE.green : PALETTE.rust }}>
                    {t.type === "remboursement" ? "-" : "+"}
                    {fmtEuros(t.montant)}
                  </strong>
                </div>
              ))}
          </div>
        )}
      </div>

      {/* Estimation paie */}
      <div style={{ background: PALETTE.bg, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4">
        <h3 className="font-semibold mb-2">Estimation paie</h3>
        {r === 0 ? (
          <div className="text-sm" style={{ color: PALETTE.rust }}>
            Taux horaire non renseigné — impossible d'estimer.
          </div>
        ) : (
          <div className="space-y-1 text-sm">
            {heuresSup.mode === "mensualise" && (
              <>
                <div className="flex justify-between">
                  <span>Salaire de base{Number(emp.heuresBaseMensuelle) > 0 ? " (temps partiel)" : ""}</span>
                  <span>{fmtHoursDecimal(baseRefFor(emp, heuresSup))}</span>
                </div>
                {baseNominale < baseRefFor(emp, heuresSup) - 0.01 && (
                  <div className="flex justify-between" style={{ color: PALETTE.rust }}>
                    <span>

          Estimation indicative — taux de cotisations réglable dans Paramètres, pas un bulletin de paie officiel.

  );
}

function SyntheseSalarie({ employees, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [selectedIds, setSelectedIds] = useState([]);
  const [showSelector, setShowSelector] = useState(false);
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(todayISO());
  const [batchPrint, setBatchPrint] = useState(false);

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  const emp = employees.find((e) => e.id === employeeId);

  // Salariés à afficher à l'écran : la sélection multiple si active, sinon le salarié choisi dans le menu
  const employeesAffiches = selectedIds.length > 0 ? employees.filter((e) => selectedIds.includes(e.id)) : emp ? [emp] : [];

  const toggleSelected = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const exportPDF = () => window.print();

  // Attend que le rendu de toutes les fiches soit bien affiché avant de lancer l'impression,
  // sinon le navigateur peut imprimer l'ancien état (un seul salarié) trop tôt.
  useEffect(() => {
    if (!batchPrint) return;
    const id1 = requestAnimationFrame(() => {
      const id2 = requestAnimationFrame(() => {
        window.print();
        setBatchPrint(false);
      });
      return () => cancelAnimationFrame(id2);
    });
    return () => cancelAnimationFrame(id1);
  }, [batchPrint]);

  const printAll = () => setBatchPrint(true);

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  // Salariés à imprimer en groupé : la sélection si active, sinon tous
  const employeesAImprimer = selectedIds.length > 0 ? employees.filter((e) => selectedIds.includes(e.id)) : employees;

  return (
    <div>
      <div className="print-only mb-4">
        <div className="font-bold text-lg">Synthèse salarié — Habitation Ressource</div>
      </div>

      <div className="flex flex-wrap items-end gap-3 mb-3 no-print">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Salarié
          </label>
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            disabled={selectedIds.length > 0}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line, opacity: selectedIds.length > 0 ? 0.5 : 1 }}
          >
            {employees.map((e) => (
              <option key={e.id} value={e.id}>
                {e.nom}
              </option>
            ))}
          </select>
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <button
          onClick={exportPDF}
          style={{ background: PALETTE.rust }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <Download size={16} /> PDF (ce salarié)
        </button>
        <button
          onClick={printAll}
          style={{ background: PALETTE.green }}
          className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
        >
          <FileText size={16} />{" "}
          {selectedIds.length > 0 ? `PDF (${selectedIds.length} sélectionné(s))` : "PDF (tous les salariés)"}
        </button>
      </div>

      <button onClick={() => setShowSelector((v) => !v)} className="text-xs underline mb-4 no-print" style={{ color: PALETTE.green }}>
        {showSelector ? "Masquer" : "Sélectionner plusieurs salariés"}
      </button>

      {showSelector && (
        <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-3 mb-4 no-print">
          <div className="flex flex-wrap gap-2 mb-2">
            {employees.map((e) => {
              const checked = selectedIds.includes(e.id);
              return (
                <button
                  key={e.id}
                  onClick={() => toggleSelected(e.id)}
                  className="px-3 py-1.5 rounded-full text-xs border"
                  style={{
                    borderColor: checked ? PALETTE.green : PALETTE.line,
                    background: checked ? PALETTE.green : "#fff",
                    color: checked ? "#fff" : PALETTE.ink,
                  }}
                >
                  {e.nom}
                </button>
              );
            })}
          </div>
          <div className="flex gap-3">
            <button onClick={() => setSelectedIds(employees.map((e) => e.id))} className="text-xs underline" style={{ color: PALETTE.green }}>
              Tout sélectionner
            </button>
            {selectedIds.length > 0 && (
              <button onClick={() => setSelectedIds([])} className="text-xs underline" style={{ color: "#8A8271" }}>
                Aucun (revenir au menu)
              </button>
            )}
          </div>
        </div>
      )}

      {employeesAffiches.length === 0 ? (
        <EmptyState text="Sélectionnez un ou plusieurs salariés." />
      ) : (
        <div className={`space-y-8 ${batchPrint ? "no-print" : ""}`}>
          {employeesAffiches.map((e) => (
            <FicheSalarieContent
              key={e.id}
              emp={e}
              data={computeSyntheseData(e, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end)}
              start={start}
              end={end}
              heuresSup={heuresSup}
              tauxCotisations={tauxCotisations}
            />
          ))}
        </div>
      )}

      {batchPrint && (
        <div className="print-only">
          {employeesAImprimer.map((e, i) => (
            <FicheSalarieContent
              key={e.id}
              emp={e}
              data={computeSyntheseData(e, entries, transactions, primes, heuresSup, tauxCotisations, heuresDefaut, start, end)}
              start={start}
              end={end}
              heuresSup={heuresSup}
              tauxCotisations={tauxCotisations}
              pageBreak={i > 0}
            />
          ))}
        </div>
      )}
    </div>
  );
}
