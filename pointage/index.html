// ---------- Stockage local (remplace window.storage de Claude) ----------
window.storage = {
  async get(key, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    const v = localStorage.getItem(k);
    if (v === null) return null;
    return { key, value: v, shared: !!shared };
  },
  async set(key, value, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    localStorage.setItem(k, value);
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    const k = (shared ? "shared:" : "personal:") + key;
    localStorage.removeItem(k);
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared) {
    const base = shared ? "shared:" : "personal:";
    const pre = base + (prefix || "");
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(pre)) keys.push(k.slice(base.length));
    }
    return { keys, prefix: prefix || "", shared: !!shared };
  },
};

const fmtHours = (h) => {

// Seuils par défaut = Code du travail (à vérifier / ajuster selon avenants IDCC 9971)
const DEFAULT_HS = {
  mode: "mensualise", // "hebdo" (35h/semaine) / "mensualise" (151,67h fixe + sup hebdo, méthode légale par défaut) / "mensuel" (151,67h simplifié sur la période)
  base: "effectives", // "effectives" ou "payees" — quelle heure sert de base au calcul des heures sup
  seuilNormal: 35, // heures/semaine avant majoration (hebdo et mensualisé — les heures sup restent hebdomadaires)
  seuilMajo2: 43, // heures/semaine à partir desquelles la 2e majoration s'applique (hebdo et mensualisé)
  heuresBaseMensualisee: 151.67, // heures de base fixe payées chaque mois (mode mensualisé)
  seuilNormalMensuel: 151.67, // heures/mois avant majoration (mode mensuel simplifié)
  plageMajo1Mensuel: 34.67, // heures supplémentaires au taux 1 avant de passer au taux 2 (mode mensuel simplifié)
  tauxMajo1: 25, // % de la 36e à la 43e heure (hebdo/mensualisé) / des 34,67 premières heures sup (mensuel simplifié)
  tauxMajo2: 50, // % au-delà
};

// Renvoie la valeur d'heures à utiliser comme base pour le calcul des heures sup,
// selon le réglage choisi (heures effectives, ou heures payées)
const overtimeBase = (hs, eff, paye) => ((hs && hs.base) === "payees" ? paye : eff);

// Compte les jours ouvrables (lundi-samedi, hors dimanche et jours fériés) dans une période
const countJoursOuvres = (start, end) => {
  let count = 0;
  let d = new Date(start + "T00:00:00");
  const endDate = new Date(end + "T00:00:00");
  let garde = 0;
  while (d <= endDate && garde < 400) {
    const iso = d.toISOString().slice(0, 10);
    if (d.getDay() !== 0 && !isJourFerie(iso)) count++;
    d.setDate(d.getDate() + 1);
    garde++;
  }
  return count;
};

// Proratise la base mensuelle si la période dépasse la date d'embauche ou la date de fin de contrat
// du salarié (ex: entrée le 11 du mois → pas de base complète payée pour les jours avant son arrivée).
// Base de référence effective pour un salarié : la sienne si réglée (temps partiel), sinon celle
// réglée par défaut dans Paramètres (151,67h, temps plein)
const baseRefFor = (emp, heuresSup) =>
  Number(emp.heuresBaseMensuelle) > 0 ? Number(emp.heuresBaseMensuelle) : Number(heuresSup.heuresBaseMensualisee);

const baseNominaleProratisee = (emp, start, end, heuresBaseMensualisee) => {
  const baseRef = Number(emp.heuresBaseMensuelle) > 0 ? Number(emp.heuresBaseMensuelle) : Number(heuresBaseMensualisee);
  const finContrat = (emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && emp.dateFinContrat ? emp.dateFinContrat : null;
  const effectiveStart = emp.dateDebutContrat && emp.dateDebutContrat > start ? emp.dateDebutContrat : start;
  const effectiveEnd = finContrat && finContrat < end ? finContrat : end;
  if (effectiveStart > effectiveEnd) return 0;
  const joursOuvresTotal = countJoursOuvres(start, end);
  if (joursOuvresTotal === 0) return 0;
  const joursOuvresEffectifs = countJoursOuvres(effectiveStart, effectiveEnd);
  return baseRef * (joursOuvresEffectifs / joursOuvresTotal);
};

// Base mensuelle (151,67h par défaut) réduite au prorata des jours d'absence NON payée sur la période
// (le congé payé n'entre pas dans cette retenue, il est déjà rémunéré séparément ailleurs)
const absenceRetenueInfo = (emp, entries, start, end, heuresDefaut) => {
  const datesAbsenceNonPayee = entries
    .filter(
      (e) =>
        e.employeeId === emp.id &&
        !e.present &&
        e.date >= start &&
        e.date <= end &&
        e.motif !== "Congé payé" &&
        new Date(e.date + "T00:00:00").getDay() !== 0 &&
        !isJourFerie(e.date)
    )
    .map((e) => ({ date: e.date, motif: e.motif || "Autre" }))
    .sort((a, b) => a.date.localeCompare(b.date));
  const joursAbsenceNonPayee = datesAbsenceNonPayee.length;
  // Retenue = heures habituelles DE CE SALARIÉ (temps partiel pris en compte si réglé), par jour
  // d'absence non payée — même logique que le maintien de salaire des congés payés (cohérence).
  const heuresParJour = Number(emp.heuresJournalieres) > 0 ? Number(emp.heuresJournalieres) : Number(heuresDefaut || 0);
  const retenueHeures = joursAbsenceNonPayee * heuresParJour;
  return { joursAbsenceNonPayee, retenueHeures, datesAbsenceNonPayee };
};

const baseMensuelleAjustee = (emp, entries, start, end, heuresBaseMensualisee, heuresDefaut) => {
  const baseNominale = baseNominaleProratisee(emp, start, end, heuresBaseMensualisee);
  const { retenueHeures } = absenceRetenueInfo(emp, entries, start, end, heuresDefaut);
  return Math.max(0, baseNominale - retenueHeures);
};

// Découpe les heures normales (effectives + hors travail effectif, hors majorations) en une ligne
// "base" (toujours la base ajustée, garantie chaque mois — c'est le principe même de la
// mensualisation) et une ligne "excédent" pour ce qui dépasse. La base n'est jamais plafonnée par
// l'activité réelle du mois : elle n'est réduite que pour une vraie absence non payée enregistrée.
const splitBaseEtExcedent = (totalNormales, baseAjustee) => {
  const base = baseAjustee;
  const excedent = Math.max(0, totalNormales - base);
  return { base, excedent };
};

// Date à utiliser pour savoir sur quelle période une avance/acompte/prêt/loyer est déduit du salaire.
// Par défaut, c'est la date de l'opération elle-même — mais si une date de remboursement différente
// a été choisie, c'est elle qui détermine la période de déduction.
const txDeductionDate = (t) => t.dateRemboursement || t.date;

// Taux moyen indicatif de cotisations sociales salariales (non-cadre) — à ajuster avec votre bulletin de paie réel
const DEFAULT_TAUX_COTISATIONS = 22;

// Lundi de la semaine ISO contenant la date donnée
const weekStart = (iso) => {
  const d = new Date(iso + "T00:00:00");
  const day = d.getDay() || 7; // dimanche -> 7
  if (day !== 1) d.setDate(d.getDate() - (day - 1));
  return d.toISOString().slice(0, 10);
};

const weekLabel = (mondayISO) => {
  const start = new Date(mondayISO + "T00:00:00");
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  return `Semaine du ${fmt(start)} au ${fmt(end)}`;
};

// Clé de regroupement pour le calcul des heures sup : semaine (lundi) en mode hebdo.
// En mode mensuel, on regroupe TOUTE la période choisie en un seul bloc (pas par mois civil) —
// sinon une période à cheval sur deux mois (ex: 25 juin au 24 juillet) diviserait les heures en
// deux paquets qui passeraient chacun sous le seuil, cachant des heures sup pourtant réelles.
const overtimeGroupKey = (iso, hs) => ((hs && hs.mode) === "mensuel" ? "periode" : weekStart(iso));

// Libellé affiché pour une clé de regroupement, dans le même mode
const periodLabel = (key, hs, start, end) => {
  if ((hs && hs.mode) === "mensuel") {
    if (start && end) {
      const fmt = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
      return `Période du ${fmt(start)} au ${fmt(end)}`;
    }
    return "Période sélectionnée";
  }
  return weekLabel(key);
};

// Vrai si la date (YYYY-MM-DD) tombe un samedi ou un dimanche
const isWeekend = (iso) => {
  const day = new Date(iso + "T00:00:00").getDay();
  return day === 0 || day === 6;
};

// Si on pose un congé payé sur un jour isolé, prolonge automatiquement le congé jusqu'à la veille
// du prochain jour normalement travaillé par CE salarié (planning habituel), en comptant les jours
// ouvrables (lundi-samedi, hors dimanche et jours fériés) entre les deux — conforme à la règle légale
// du décompte continu jusqu'au retour effectif. Pour un temps plein classique (planning par défaut
// lundi-samedi), ça revient à prolonger un vendredi posé jusqu'au samedi inclus.
// Ne s'applique qu'au motif « Congé payé », jamais aux absences — et n'écrase jamais une entrée
// existante sur les jours concernés.
const withCongeExtension = (entriesList, employeeId, date, motif, emp) => {
  if (motif !== "Congé payé") return entriesList;
  const jours = emp && emp.joursTravailHabituels && emp.joursTravailHabituels.length > 0 ? emp.joursTravailHabituels : [1, 2, 3, 4, 5];
  let d = new Date(date + "T00:00:00");
  d.setDate(d.getDate() + 1);
  let next = entriesList;
  let garde = 0;
  while (garde < 60) {
    const dow = d.getDay();
    const iso = d.toISOString().slice(0, 10);
    if (dow !== 0 && jours.includes(dow)) break; // prochain jour normalement travaillé : le congé s'arrête ici
    if (dow !== 0 && !isJourFerie(iso)) {
      const has = next.some((e) => e.employeeId === employeeId && e.date === iso);
      if (!has) {
        next = [
          ...next,
          { id: uid(), date: iso, employeeId, present: false, motif: "Congé payé", heuresEffectives: 0, heuresPayees: 0, tache: "", parcelle: "", note: "" },
        ];
      }
    }
    d.setDate(d.getDate() + 1);
    garde++;
  }
  return next;
};

// Calcule la date de Pâques (algorithme de Gauss) pour une année donnée
const easterDate = (year) => {
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
};

const addDays = (date, n) => {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
};

const toISO = (date) => date.toISOString().slice(0, 10);

// Liste des jours fériés légaux français pour une année donnée
const joursFeries = (year) => {
  const paques = easterDate(year);
  return [
    `${year}-01-01`, // Jour de l'an
    toISO(addDays(paques, 1)), // Lundi de Pâques
    `${year}-05-01`, // Fête du travail
    `${year}-05-08`, // Victoire 1945
    `${year}-05-22`, // Abolition de l'esclavage (jour férié local, Martinique)
    toISO(addDays(paques, 39)), // Ascension
    toISO(addDays(paques, 50)), // Lundi de Pentecôte
    `${year}-07-14`, // Fête nationale
    `${year}-08-15`, // Assomption
    `${year}-11-01`, // Toussaint
    `${year}-11-11`, // Armistice
    `${year}-12-25`, // Noël
  ];
};

const isJourFerie = (iso) => {
  const year = Number(iso.slice(0, 4));
  return joursFeries(year).includes(iso);
};

// Ajoute n mois à une date YYYY-MM-DD sans dérive (recalculé depuis la date d'origine à chaque fois,
// et le jour est ramené au dernier jour du mois si celui-ci n'existe pas, ex: 31 janvier + 1 mois = 28/29 février)
const addMonthsClamped = (dateStr, n) => {
  const [y, m, d] = dateStr.split("-").map(Number);
  const total = (m - 1) + n;
  const newY = y + Math.floor(total / 12);
  const newM = ((total % 12) + 12) % 12;
  const daysInMonth = new Date(newY, newM + 1, 0).getDate();
  const newD = Math.min(d, daysInMonth);
  return `${newY}-${String(newM + 1).padStart(2, "0")}-${String(newD).padStart(2, "0")}`;
};

// Calcule le loyer dû automatiquement pour une période, tant que le salarié a un loyer réglé,
// à partir de sa date de début, et jusqu'à la fin de son contrat (CDD/Saisonnier) le cas échéant.
// Compte les échéances mensuelles réelles (une par mois à partir de la date de début), peu importe
// si la période chevauche deux mois civils — pas un simple compte de mois calendaires touchés.
// S'arrête tout seul : fin de contrat dépassée, champ vidé, ou salarié supprimé.
const loyerPourPeriode = (emp, start, end) => {
  const montant = Number(emp.loyerMensuel);
  if (!(montant > 0) || !emp.loyerDebut) return 0;
  const finContrat = (emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && emp.dateFinContrat ? emp.dateFinContrat : null;
  const effectiveEnd = finContrat && finContrat < end ? finContrat : end;
  if (emp.loyerDebut > effectiveEnd) return 0;

  let count = 0;
  let n = 0;
  let due = emp.loyerDebut;
  let garde = 0;
  while (due <= effectiveEnd && garde < 1200) {
    if (due >= start) count++;
    n++;
    due = addMonthsClamped(emp.loyerDebut, n);
    garde++;
  }
  return count * montant;
};

// Calcule l'indemnité de congés payés dus sur une période (règle du maintien de salaire) :
// chaque jour de congé payé déclaré (samedi inclus, dimanche jamais présent puisque exclu à la
// déclaration) est payé comme une journée normale, aux heures habituelles DE CE SALARIÉ (temps
// partiel pris en compte si réglé) et au taux horaire du salarié. Sans réglage propre au salarié,
// utilise les heures par défaut globales (Paramètres) — comportement inchangé pour un temps plein.
// Estimation indicative — la règle du 1/10e n'est pas calculée, à comparer avec votre logiciel de paie.
const congesPayesMontant = (emp, entries, heuresDefaut, start, end) => {
  const r = Number(emp.tauxHoraire) || 0;
  const datesConges = entries
    .filter((e) => e.employeeId === emp.id && !e.present && e.motif === "Congé payé" && e.date >= start && e.date <= end)
    .map((e) => e.date)
    .sort();
  if (!r) return { heures: 0, jours: 0, montant: 0, datesConges };
  const heuresParJour = Number(emp.heuresJournalieres) > 0 ? Number(emp.heuresJournalieres) : Number(heuresDefaut || 0);
  const jours = datesConges.length;
  const heures = jours * heuresParJour;
  return { heures, jours, montant: heures * r, datesConges };
};

// Calcule la répartition heures normales / majorées 1 / majorées 2 pour un total hebdo payé
const splitOvertime = (totalHeures, hs) => {
  const mensuel = hs && hs.mode === "mensuel";
  const s1 = mensuel ? Number(hs.seuilNormalMensuel) : Number(hs.seuilNormal);
  const s2 = mensuel ? Number(hs.seuilNormalMensuel) + Number(hs.plageMajo1Mensuel) : Number(hs.seuilMajo2);
  const normales = Math.min(totalHeures, s1);
  const majo1 = Math.max(0, Math.min(totalHeures, s2) - s1);
  const majo2 = Math.max(0, totalHeures - s2);
  return { normales, majo1, majo2 };
};

// Phrase explicative du calcul des heures sup, pour affichage à titre d'information à côté des totaux.
// Prend les heures normales/majorées DÉJÀ calculées (sommées correctement semaine par semaine si besoin),
// et les met en phrase — ne refait jamais le calcul sur un total déjà cumulé, pour éviter de réappliquer
// un seuil hebdomadaire à plusieurs semaines cumulées d'un coup (ce qui donnerait un résultat faux).
const overtimeExplanation = (normales, majo1, majo2, hs) => {
  const mensuel = hs && hs.mode === "mensuel";
  const mensualise = hs && hs.mode === "mensualise";
  const total = normales + majo1 + majo2;
  const baseLabel = (hs && hs.base) === "payees" ? "payées" : "effectives";
  const parts = [];

  if (mensuel) {
    const s1 = Number(hs.seuilNormalMensuel);
    const s2 = s1 + Number(hs.plageMajo1Mensuel);
    parts.push(`${fmtHours(normales)} normales (jusqu'à ${s1}h)`);
    if (majo1 > 0) parts.push(`${fmtHours(majo1)} à +${hs.tauxMajo1}% (de ${s1}h à ${s2}h)`);
    if (majo2 > 0) parts.push(`${fmtHours(majo2)} à +${hs.tauxMajo2}% (au-delà de ${s2}h)`);
    return `${fmtHours(total)} ${baseLabel} sur la période = ${parts.join(" + ")}`;
  }

  // Hebdomadaire ou mensualisé : le calcul réel se fait semaine par semaine (seuil 35h), puis les
  // heures normales/majorées de chaque semaine sont additionnées — on affiche ces totaux déjà justes,
  // sans reprendre le calcul sur le cumul (qui donnerait un résultat faux si la période fait plusieurs semaines).
  parts.push(`${fmtHours(normales)} normales`);
  if (majo1 > 0) parts.push(`${fmtHours(majo1)} à +${hs.tauxMajo1}%`);
  if (majo2 > 0) parts.push(`${fmtHours(majo2)} à +${hs.tauxMajo2}%`);
  let note = ` (calcul fait semaine civile par semaine civile, seuil ${hs.seuilNormal}h)`;
  if (mensualise) {
    const forfait = Number(hs.heuresBaseMensualisee);
    const depassement = Math.max(0, total - forfait);
    note =
      ` (calcul fait semaine civile par semaine civile, seuil ${hs.seuilNormal}h — base de ${forfait}h payée par` +
      ` ailleurs). Repère indicatif : ${fmtHours(total)} au total ce mois, dont ${fmtHours(depassement)} au-delà` +
      ` du forfait de ${forfait}h (ce repère ne sert qu'à titre indicatif — le montant réellement dû reste celui` +
      ` calculé semaine par semaine ci-dessus, qui peut différer)`;
  }
  return `${fmtHours(total)} ${baseLabel} cumulées sur la période = ${parts.join(" + ")}${note}`;
};

// ---------- Main App ----------
function PointageApp() {
  const [loading, setLoading] = useState(true);
  const [employees, setEmployees] = useState([]);
  const [teams, setTeams] = useState([]);
  const [entries, setEntries] = useState([]);
  const [transactions, setTransactions] = useState([]); // avances, acomptes, prêts, remboursements
  const [primes, setPrimes] = useState([]); // primes diverses versées aux salariés
  const [tachesEcart, setTachesEcart] = useState([]); // tâches où heures effectives != heures payées
  const [taches, setTaches] = useState(DEFAULT_TACHES);
  const [heuresDefaut, setHeuresDefaut] = useState(7);
  const [heuresSup, setHeuresSup] = useState(DEFAULT_HS);
  const [tauxCotisations, setTauxCotisations] = useState(DEFAULT_TAUX_COTISATIONS);
  const [pinCode, setPinCode] = useState("");
  const [primeTypes, setPrimeTypes] = useState(DEFAULT_PRIME_TYPES);
  const [lastBackupDate, setLastBackupDate] = useState(null);
  const [unlocked, setUnlocked] = useState(false);
  const [tab, setTab] = useState("pointage");
  const [selectedDate, setSelectedDate] = useState(todayISO());
  const [saveState, setSaveState] = useState("idle"); // idle | saving | saved

  // ---------- Load from storage ----------
  useEffect(() => {
    (async () => {
      try {
        const [empRes, entRes, cfgRes, teamRes, txRes, primesRes] = await Promise.allSettled([
          window.storage.get("employees", false),
          window.storage.get("entries", false),
          window.storage.get("config", false),
          window.storage.get("teams", false),
          window.storage.get("transactions", false),
          window.storage.get("primes", false),
        ]);
        if (empRes.status === "fulfilled" && empRes.value) {
          setEmployees(JSON.parse(empRes.value.value));
        }
        if (entRes.status === "fulfilled" && entRes.value) {
          setEntries(JSON.parse(entRes.value.value));
        }
        if (teamRes.status === "fulfilled" && teamRes.value) {
          setTeams(JSON.parse(teamRes.value.value));
        }
        if (txRes.status === "fulfilled" && txRes.value) {
          setTransactions(JSON.parse(txRes.value.value));
        }
        if (primesRes.status === "fulfilled" && primesRes.value) {
          setPrimes(JSON.parse(primesRes.value.value));
        }
        if (cfgRes.status === "fulfilled" && cfgRes.value) {
          const cfg = JSON.parse(cfgRes.value.value);
          setTachesEcart(cfg.tachesEcart || []);
          setHeuresSup({ ...DEFAULT_HS, ...(cfg.heuresSup || {}) });
          setTaches(cfg.taches && cfg.taches.length > 0 ? cfg.taches : DEFAULT_TACHES);
          setHeuresDefaut(cfg.heuresDefaut ?? 7);
          setTauxCotisations(cfg.tauxCotisations ?? DEFAULT_TAUX_COTISATIONS);
          setPinCode(cfg.pinCode || "");
          setPrimeTypes(cfg.primeTypes && cfg.primeTypes.length > 0 ? cfg.primeTypes : DEFAULT_PRIME_TYPES);
          setLastBackupDate(cfg.lastBackupDate || null);
        }
      } catch (e) {
        console.error("Erreur de chargement", e);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  // ---------- Persist ----------
  const persist = async (key, value) => {
    setSaveState("saving");
    try {
      await window.storage.set(key, JSON.stringify(value), false);
      setSaveState("saved");
      setTimeout(() => setSaveState("idle"), 1200);
    } catch (e) {
      console.error("Erreur de sauvegarde", e);
      setSaveState("idle");
    }
  };

  const updateEmployees = (next) => {
    setEmployees(next);
    persist("employees", next);
  };

  const updateEntries = (next) => {
    setEntries(next);
    persist("entries", next);
  };

  const updateTeams = (next) => {
    setTeams(next);
    persist("teams", next);
  };

  const updateTransactions = (next) => {
    setTransactions(next);
    persist("transactions", next);
  };

  const updatePrimes = (next) => {
    setPrimes(next);
    persist("primes", next);
  };

  const updateTachesEcart = (next) => {
    setTachesEcart(next);
    persist("config", { tachesEcart: next, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate, primeTypes });
  };

  const updateHeuresSup = (next) => {
    setHeuresSup(next);
    persist("config", { tachesEcart, heuresSup: next, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate, primeTypes });
  };

  const updateTaches = (next) => {
    setTaches(next);
    persist("config", { tachesEcart, heuresSup, taches: next, heuresDefaut, tauxCotisations, pinCode, lastBackupDate, primeTypes });
  };

  const updateHeuresDefaut = (next) => {
    setHeuresDefaut(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut: next, tauxCotisations, pinCode, lastBackupDate, primeTypes });
  };

  const updateTauxCotisations = (next) => {
    setTauxCotisations(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations: next, pinCode, lastBackupDate, primeTypes });
  };

  const updatePinCode = (next) => {
    setPinCode(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode: next, lastBackupDate, primeTypes });
  };

  const updateLastBackupDate = (next) => {
    setLastBackupDate(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate: next, primeTypes });
  };

  const updatePrimeTypes = (next) => {
    setPrimeTypes(next);
    persist("config", { tachesEcart, heuresSup, taches, heuresDefaut, tauxCotisations, pinCode, lastBackupDate, primeTypes: next });
  };

  if (loading) {
    return (
      <div style={{ background: PALETTE.bg, minHeight: "100vh" }} className="flex items-center justify-center">
        <Loader2 className="animate-spin" size={28} color={PALETTE.green} />
      </div>
    );

  }

    <div style={{ background: PALETTE.bg, color: PALETTE.ink, minHeight: "100vh" }} className="font-sans">
      <style>{`
        .print-only { display: none; }
        @media print {
          @page { margin: 14mm 12mm; }
          .no-print { display: none !important; }
          .print-only { display: block !important; }
          body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          main { max-width: none !important; padding: 0 !important; }
          .rounded-md { break-inside: avoid; }
          h3 { break-after: avoid; }

      `}</style>
      <div className="no-print">
        <Header saveState={saveState} />
        <TabBar tab={tab} setTab={setTab} />
      </div>
      <main className="max-w-5xl mx-auto px-4 pb-24 pt-6">
        {tab === "dashboard" && (
          <Dashboard
            employees={employees}
            entries={entries}
            transactions={transactions}
            primes={primes}

            tauxCotisations={tauxCotisations}

        {tab === "pointage" && (

          />
        )}
        {tab === "salaries" && <Salaries employees={employees} updateEmployees={updateEmployees} />}
        {tab === "equipes" && <Equipes employees={employees} teams={teams} updateTeams={updateTeams} />}
        {tab === "avances" && (
          <Avances employees={employees} transactions={transactions} updateTransactions={updateTransactions} />
        )}
        {tab === "primes" && (
          <Primes employees={employees} primes={primes} updatePrimes={updatePrimes} primeTypes={primeTypes} updatePrimeTypes={updatePrimeTypes} />
        )}
        {tab === "recap" && <Recap employees={employees} entries={entries} />}
        {tab === "syntheseTache" && <SyntheseParTache employees={employees} entries={entries} />}
        {tab === "synthese" && (
          <SyntheseSalarie

            heuresSup={heuresSup}

          />
        )}
        {tab === "syntheseHebdo" && <SyntheseHebdo employees={employees} entries={entries} heuresSup={heuresSup} heuresDefaut={heuresDefaut} />}
        {tab === "recapHeures" && (
          <RecapHeures employees={employees} entries={entries} transactions={transactions} primes={primes} heuresSup={heuresSup} tauxCotisations={tauxCotisations} heuresDefaut={heuresDefaut} />
        )}
        {tab === "feuillePointage" && <FeuillePointage employees={employees} entries={entries} heuresSup={heuresSup} />}
        {tab === "absences" && <Absences employees={employees} entries={entries} />}
        {tab === "conges" && (
          <CongesAbsences employees={employees} updateEmployees={updateEmployees} entries={entries} updateEntries={updateEntries} taches={taches} />
        )}
        {tab === "heuresSup" && <HeuresSup employees={employees} entries={entries} heuresSup={heuresSup} />}
        {tab === "simulation" && (
          <SimulationPaie employees={employees} entries={entries} transactions={transactions} primes={primes} heuresSup={heuresSup} tauxCotisations={tauxCotisations} heuresDefaut={heuresDefaut} />
        )}
        {tab === "parametres" && (
          <Parametres
            tachesEcart={tachesEcart}

            taches={taches}
            updateTaches={updateTaches}
            heuresDefaut={heuresDefaut}
            updateHeuresDefaut={updateHeuresDefaut}
            tauxCotisations={tauxCotisations}
            updateTauxCotisations={updateTauxCotisations}
            employees={employees}
            updateEmployees={updateEmployees}
            teams={teams}
            updateTeams={updateTeams}
            entries={entries}

function LockScreen({ pinCode, onUnlock }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState(false);

  const submit = () => {
    if (value === pinCode) {
      onUnlock();
    } else {
      setError(true);
      setValue("");
    }
  };

  return (
    <div style={{ background: PALETTE.greenDark }} className="min-h-screen flex items-center justify-center p-6">
      <div style={{ background: PALETTE.card }} className="rounded-md p-6 w-full max-w-xs text-center">
        <Lock size={28} color={PALETTE.green} className="mx-auto mb-3" />
        <h1 className="font-bold text-lg mb-1">Carnet de pointage</h1>
        <p className="text-sm mb-4" style={{ color: "#8A8271" }}>
          Entrez le code pour accéder aux données.
        </p>
        <input
          type="password"
          inputMode="numeric"
          value={value}
          onChange={(e) => {
            setValue(e.target.value);
            setError(false);
          }}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          autoFocus
          className="w-full px-3 py-2 rounded border text-center text-lg tracking-widest mb-3"
          style={{ borderColor: error ? PALETTE.rust : PALETTE.line }}
        />
        {error && (
          <p className="text-xs mb-3" style={{ color: PALETTE.rust }}>
            Code incorrect.
          </p>
        )}
        <button
          onClick={submit}
          style={{ background: PALETTE.green }}
          className="w-full py-2 rounded text-white text-sm font-medium"
        >
          Déverrouiller
        </button>
      </div>
    </div>
  );
}

// ---------- Pointage (daily entry by supervisor) ----------
function Pointage({ employees, teams, entries, updateEntries, tachesEcart, taches, heuresDefaut, selectedDate, setSelectedDate }) {
  const dayEntries = entries.filter((e) => e.date === selectedDate);
  const [selected, setSelected] = useState([]);
  const [bulkTache, setBulkTache] = useState(taches[0]);
  const [bulkEff, setBulkEff] = useState(heuresDefaut);
  const [bulkPaye, setBulkPaye] = useState(heuresDefaut);
  const [bulkParcelle, setBulkParcelle] = useState("");

  // La sélection est propre à chaque jour affiché
  useEffect(() => {
    setSelected([]);
  }, [selectedDate]);

  const shiftDate = (delta) => {
    const d = new Date(selectedDate + "T00:00:00");
    d.setDate(d.getDate() + delta);
    setSelectedDate(d.toISOString().slice(0, 10));
  };

  // Tous les postes (segments) du jour pour un salarié
  const segmentsFor = (empId) => dayEntries.filter((e) => e.employeeId === empId && e.present);
  // Entrée d'absence éventuelle (pas de segment présent, mais un motif a pu être saisi)
  const absenceFor = (empId) => dayEntries.find((e) => e.employeeId === empId && !e.present);

  const updateSegment = (entryId, patch) => {
    const existing = entries.find((e) => e.id === entryId);
    if (!existing) return;
    const merged = { ...existing, ...patch };
    if (!tachesEcart.includes(merged.tache)) {
      merged.heuresPayees = merged.heuresEffectives;
    }
    updateEntries(entries.map((e) => (e.id === entryId ? merged : e)));
  };

  const addSegment = (empId) => {
    const emp = employees.find((e) => e.id === empId);
    const heuresParJour = emp && Number(emp.heuresJournalieres) > 0 ? Number(emp.heuresJournalieres) : heuresDefaut;
    const base = {
      id: uid(),
      date: selectedDate,
      employeeId: empId,
      present: true,
      heuresEffectives: heuresParJour,
      heuresPayees: heuresParJour,
      tache: taches[0],
      parcelle: "",
      note: "",
    };
    if (!tachesEcart.includes(base.tache)) base.heuresPayees = base.heuresEffectives;
    // Retire TOUTE entrée d'absence existante pour ce jour (pas juste la première trouvée, au cas
    // où un doublon se serait glissé dans les données) avant d'ajouter le premier poste.
    const next = entries.filter((e) => !(e.employeeId === empId && e.date === selectedDate && !e.present));
    updateEntries([...next, base]);
  };

  const removeSegment = (entryId) => {
    updateEntries(entries.filter((e) => e.id !== entryId));
  };

  const setMotif = (empId, motif) => {
    // Retire TOUTE entrée d'absence existante pour ce jour (au cas où un doublon existerait) et la
    // remplace par une seule entrée propre avec le nouveau motif.
    const sansAncienneAbsence = entries.filter((e) => !(e.employeeId === empId && e.date === selectedDate && !e.present));
    let next = [
      ...sansAncienneAbsence,
      { id: uid(), date: selectedDate, employeeId: empId, present: false, motif, heuresEffectives: 0, heuresPayees: 0, tache: taches[0], parcelle: "", note: "" },
    ];
    next = withCongeExtension(next, empId, selectedDate, motif, employees.find((e) => e.id === empId));
    updateEntries(next);
  };

  const toggleSelected = (empId) => {
    setSelected((prev) => (prev.includes(empId) ? prev.filter((id) => id !== empId) : [...prev, empId]));
  };

  const selectTeam = (team) => {
    setSelected(team.employeeIds);
    setBulkTache(taches[0]);
  };

  const bulkSeparee = tachesEcart.includes(bulkTache);

  // Ajoute un nouveau poste (segment) à chaque salarié sélectionné, sans écraser ceux déjà pointés
  const applyBulk = () => {
    const additions = selected.map((empId) => ({
      id: uid(),
      date: selectedDate,
      employeeId: empId,
      present: true,
      tache: bulkTache,
      heuresEffectives: bulkEff,
      heuresPayees: bulkSeparee ? bulkPaye : bulkEff,
      parcelle: bulkParcelle,
      note: "",
    }));
    // Retire les éventuelles entrées d'absence des salariés sélectionnés
    const absentIds = new Set(selected.map((id) => absenceFor(id)?.id).filter(Boolean));
    const next = entries.filter((e) => !absentIds.has(e.id));
    updateEntries([...next, ...additions]);
    setSelected([]);
    setBulkParcelle("");
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés » pour commencer le pointage." />;
  }

  const presentEmpIds = new Set(dayEntries.filter((e) => e.present).map((e) => e.employeeId));
  const totalPresents = presentEmpIds.size;
  const totalEff = dayEntries.filter((e) => e.present).reduce((s, e) => s + Number(e.heuresEffectives || 0), 0);
  const totalPaye = dayEntries.filter((e) => e.present).reduce((s, e) => s + Number(e.heuresPayees ?? e.heuresEffectives ?? 0), 0);

  return (
    <div>
      {/* Date navigator */}
      <div className="flex items-center justify-between mb-5">
        <button onClick={() => shiftDate(-1)} className="p-2 rounded-full hover:bg-black/5">
          <ChevronLeft size={20} />
        </button>
        <div className="text-center">
          <div className="font-semibold text-lg capitalize">{fmtDateLong(selectedDate)}</div>
          <input
            type="date"
            value={selectedDate}
            onChange={(e) => setSelectedDate(e.target.value)}
            className="text-xs mt-1 bg-transparent underline decoration-dotted"
            style={{ color: "#8A8271" }}
          />
        </div>
        <button onClick={() => shiftDate(1)} className="p-2 rounded-full hover:bg-black/5">
          <ChevronRight size={20} />
        </button>
      </div>

      <div className="flex gap-4 text-sm mb-4 flex-wrap" style={{ color: "#6B6552" }}>
        <span>
          <strong style={{ color: PALETTE.green }}>{totalPresents}</strong> présent(s)
        </span>
        <span>
          Effectives : <strong style={{ color: PALETTE.green }}>{fmtHours(totalEff)}</strong>
        </span>
        <span>
          Payées : <strong style={{ color: PALETTE.rust }}>{fmtHours(totalPaye)}</strong>
        </span>
      </div>

      {teams.length > 0 && (
        <div className="flex items-center gap-2 flex-wrap mb-3">
          <span className="text-xs" style={{ color: "#8A8271" }}>
            Sélectionner une équipe :
          </span>
          {teams.map((team) => (
            <button
              key={team.id}
              onClick={() => selectTeam(team)}
              className="px-3 py-1.5 rounded-full text-xs border"
              style={{ borderColor: PALETTE.green, color: PALETTE.green, background: "#fff" }}
            >
              {team.nom} ({team.employeeIds.length})
            </button>
          ))}
        </div>
      )}

      {selected.length > 0 && (
        <div
          style={{ background: "#EFEADA", border: `1px solid ${PALETTE.green}` }}
          className="rounded-md p-3 mb-4 flex items-center gap-2 flex-wrap"
        >
          <span className="text-sm font-medium" style={{ color: PALETTE.greenDark }}>
            {selected.length} sélectionné(s)
          </span>
          <select
            value={bulkTache}
            onChange={(e) => setBulkTache(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
          >
            {taches.map((t) => (
              <option key={t} value={t}>
                {t}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.25"
            min="0"
            value={bulkEff}
            onChange={(e) => setBulkEff(e.target.value)}
            className="w-20 px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
            title="Heures effectives"
          />
          {bulkSeparee && (
            <input
              type="number"
              step="0.25"
              min="0"
              value={bulkPaye}

              className="w-20 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
              title="Heures payées"

          <input
            type="text"
            placeholder="Parcelle"
            value={bulkParcelle}

          <button

                <div className="min-w-[140px] font-medium">{emp.nom}</div>
                {present && (
                  <span className="text-xs" style={{ color: "#8A8271" }}>

                <button
                  onClick={() => addSegment(emp.id)}

                  style={{ border: `1px solid ${PALETTE.green}`, color: PALETTE.green }}

                {!present && (
                  <>
                    <span className="text-sm italic" style={{ color: "#B5AA88" }}>
                      Absent ce jour
                    </span>
                    <select
                      value={abs?.motif ?? ""}
                      onChange={(e) => setMotif(emp.id, e.target.value)}

                      style={{ borderColor: PALETTE.line, background: "#fff", color: "#6B6552" }}

              {segments.map((seg, i) => {

                      {i + 1}.
                    </span>
                    <select
                      value={seg.tache}
                      onChange={(e) => updateSegment(seg.id, { tache: e.target.value })}
                      className="px-2 py-1.5 rounded border text-sm min-w-[160px]"
                      style={{ borderColor: PALETTE.line, background: "#fff" }}

                      ))}

                    <div className="flex items-center gap-1.5">
                      <input
                        type="number"
                        step="0.25"
                        min="0"
                        max="24"
                        value={seg.heuresEffectives ?? heuresDefaut}
                        onChange={(e) =>
                          updateSegment(seg.id, {
                            heuresEffectives: e.target.value,

                        className="w-20 px-2 py-1.5 rounded border text-sm"
                        style={{ borderColor: PALETTE.line, background: "#fff" }}

                        {separee ? "h eff." : "heures"}
                      </span>
                    </div>

                    {separee && (
                      <div className="flex items-center gap-1.5">
                        <input
                          type="number"
                          step="0.25"
                          min="0"
                          max="24"
                          value={seg.heuresPayees ?? seg.heuresEffectives ?? heuresDefaut}
                          onChange={(e) => updateSegment(seg.id, { heuresPayees: e.target.value })}

                          style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
                        />
                        <span className="text-xs" style={{ color: PALETTE.rust }}>
                          h payées
                        </span>

                    <button

                    >

                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Salariés (employee management) ----------
const TYPES_CONTRAT = ["CDI", "CDD", "Saisonnier", "Autre"];

// ---------- Pointage par salarié (saisie d'un salarié sur plusieurs jours/semaines d'un coup) ----------
function PointageMensuel({ employees, entries, updateEntries, tachesEcart, taches, heuresDefaut }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [start, setStart] = useState(() => {
    const d = new Date();
    d.setDate(1);
    return d.toISOString().slice(0, 10);
  });
  const [end, setEnd] = useState(() => {
    const d = new Date();
    d.setMonth(d.getMonth() + 1, 0); // dernier jour du mois en cours
    return d.toISOString().slice(0, 10);
  });

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  const [selectedDates, setSelectedDates] = useState([]);
  const [bulkTache, setBulkTache] = useState(taches[0]);
  const [bulkEff, setBulkEff] = useState(heuresDefaut);
  const [bulkPaye, setBulkPaye] = useState(heuresDefaut);
  const [bulkParcelle, setBulkParcelle] = useState("");

  // La sélection est propre au salarié affiché
  useEffect(() => {
    setSelectedDates([]);
  }, [employeeId]);

  // Liste des dates entre start et end (inclus)
  const dates = useMemo(() => {
    const list = [];
    let d = new Date(start + "T00:00:00");
    const endDate = new Date(end + "T00:00:00");
    let garde = 0;
    while (d <= endDate && garde < 400) {
      list.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() + 1);
      garde++;
    }
    return list;
  }, [start, end]);

  // Regroupe les dates par semaine (lundi) pour l'affichage
  const semaines = useMemo(() => {
    const map = {};
    dates.forEach((date) => {
      const wk = weekStart(date);
      if (!map[wk]) map[wk] = [];
      map[wk].push(date);
    });
    return Object.keys(map)
      .sort()
      .map((wk) => ({ wk, dates: map[wk] }));
  }, [dates]);

  const segmentsFor = (date) => entries.filter((e) => e.employeeId === employeeId && e.date === date && e.present);
  const absenceFor = (date) => entries.find((e) => e.employeeId === employeeId && e.date === date && !e.present);

  const toggleDateSelected = (date) => {
    setSelectedDates((prev) => (prev.includes(date) ? prev.filter((d) => d !== date) : [...prev, date]));
  };

  const selectWeek = (weekDates) => {
    setSelectedDates((prev) => {
      const allSelected = weekDates.every((d) => prev.includes(d));
      if (allSelected) return prev.filter((d) => !weekDates.includes(d));
      return Array.from(new Set([...prev, ...weekDates]));
    });
  };

  const bulkSeparee = tachesEcart.includes(bulkTache);

  // Ajoute un poste identique à tous les jours sélectionnés, sans écraser ce qui existe déjà
  const applyBulk = () => {
    const additions = selectedDates.map((date) => ({
      id: uid(),
      date,
      employeeId,
      present: true,
      tache: bulkTache,
      heuresEffectives: bulkEff,
      heuresPayees: bulkSeparee ? bulkPaye : bulkEff,
      parcelle: bulkParcelle,
      note: "",
    }));
    // Retire les éventuelles entrées d'absence des jours sélectionnés
    const absentIds = new Set(selectedDates.map((d) => absenceFor(d)?.id).filter(Boolean));
    const next = entries.filter((e) => !absentIds.has(e.id));
    updateEntries([...next, ...additions]);
    setSelectedDates([]);
    setBulkParcelle("");
  };

  const addSegment = (date) => {
    const emp = employees.find((e) => e.id === employeeId);
    const heuresParJour = emp && Number(emp.heuresJournalieres) > 0 ? Number(emp.heuresJournalieres) : heuresDefaut;
    const base = {
      id: uid(),
      date,
      employeeId,
      present: true,
      heuresEffectives: heuresParJour,
      heuresPayees: heuresParJour,
      tache: taches[0],
      parcelle: "",
      note: "",
    };
    if (!tachesEcart.includes(base.tache)) base.heuresPayees = base.heuresEffectives;
    // Retire TOUTE entrée d'absence existante pour ce jour (pas juste la première trouvée, au cas
    // où un doublon se serait glissé dans les données) avant d'ajouter le premier poste.
    const next = entries.filter((e) => !(e.employeeId === employeeId && e.date === date && !e.present));
    updateEntries([...next, base]);
  };

  const updateSegment = (entryId, patch) => {
    const existing = entries.find((e) => e.id === entryId);
    if (!existing) return;
    const merged = { ...existing, ...patch };
    if (!tachesEcart.includes(merged.tache)) merged.heuresPayees = merged.heuresEffectives;
    updateEntries(entries.map((e) => (e.id === entryId ? merged : e)));
  };

  const removeSegment = (entryId) => {
    updateEntries(entries.filter((e) => e.id !== entryId));
  };

  const setMotif = (date, motif) => {
    // Retire TOUTE entrée d'absence existante pour ce jour (au cas où un doublon existerait) et la
    // remplace par une seule entrée propre avec le nouveau motif.
    const sansAncienneAbsence = entries.filter((e) => !(e.employeeId === employeeId && e.date === date && !e.present));
    let next = [
      ...sansAncienneAbsence,
      { id: uid(), date, employeeId, present: false, motif, heuresEffectives: 0, heuresPayees: 0, tache: taches[0], parcelle: "", note: "" },
    ];
    next = withCongeExtension(next, employeeId, date, motif, employees.find((e) => e.id === employeeId));
    updateEntries(next);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  const emp = employees.find((e) => e.id === employeeId);
  const totalEff = dates.reduce((s, date) => s + segmentsFor(date).reduce((s2, seg) => s2 + Number(seg.heuresEffectives || 0), 0), 0);
  const totalPaye = dates.reduce(
    (s, date) => s + segmentsFor(date).reduce((s2, seg) => s2 + Number(seg.heuresPayees ?? seg.heuresEffectives ?? 0), 0),
    0
  );

  return (
    <div>
      <div className="flex flex-wrap items-end gap-3 mb-3">
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Salarié
          </label>
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {employees.map((e) => (
              <option key={e.id} value={e.id}>
                {e.nom}
              </option>
            ))}
          </select>
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Du
          </label>
          <input
            type="date"
            value={start}
            onChange={(e) => setStart(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
        <div>
          <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
            Au
          </label>
          <input
            type="date"
            value={end}
            onChange={(e) => setEnd(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          />
        </div>
      </div>

      {emp && (
        <div className="flex gap-4 text-sm mb-4 flex-wrap" style={{ color: "#6B6552" }}>
          <span>
            <strong>{emp.nom}</strong>
          </span>
          <span>
            Effectives : <strong style={{ color: PALETTE.green }}>{fmtHours(totalEff)}</strong>
          </span>
          <span>
            Payées : <strong style={{ color: PALETTE.rust }}>{fmtHours(totalPaye)}</strong>
          </span>
        </div>
      )}

      {selectedDates.length > 0 && (
        <div
          style={{ background: "#EFEADA", border: `1px solid ${PALETTE.green}` }}
          className="rounded-md p-3 mb-4 flex items-center gap-2 flex-wrap"
        >
          <span className="text-sm font-medium" style={{ color: PALETTE.greenDark }}>
            {selectedDates.length} jour(s) sélectionné(s)
          </span>
          <select
            value={bulkTache}
            onChange={(e) => setBulkTache(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm min-w-[150px]"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
          >
            {taches.map((t) => (
              <option key={t} value={t}>
                {t}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.25"
            min="0"
            value={bulkEff}
            onChange={(e) => setBulkEff(e.target.value)}
            className="w-20 px-2 py-1.5 rounded border text-sm"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
            title="Heures effectives"
          />
          {bulkSeparee && (
            <input
              type="number"
              step="0.25"
              min="0"
              value={bulkPaye}
              onChange={(e) => setBulkPaye(e.target.value)}
              className="w-20 px-2 py-1.5 rounded border text-sm"
              style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
              title="Heures payées"
            />
          )}
          <input
            type="text"
            placeholder="Parcelle"
            value={bulkParcelle}
            onChange={(e) => setBulkParcelle(e.target.value)}
            className="px-2 py-1.5 rounded border text-sm w-28"
            style={{ borderColor: PALETTE.line, background: "#fff" }}
          />
          <button
            onClick={applyBulk}
            style={{ background: PALETTE.green }}
            className="px-4 py-1.5 rounded text-white text-sm font-medium"
          >
            Ajouter ce poste
          </button>
          <button onClick={() => setSelectedDates([])} className="text-sm" style={{ color: "#8A8271" }}>
            Annuler
          </button>
        </div>
      )}

      <div className="space-y-4">
        {semaines.map(({ wk, dates: weekDates }) => {
          const weekAllSelected = weekDates.every((d) => selectedDates.includes(d));
          return (
          <div key={wk} style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md overflow-hidden">
            <div
              className="px-4 py-2.5 flex items-center justify-between"
              style={{ background: PALETTE.bg, borderBottom: `1px solid ${PALETTE.line}` }}
            >
              <span className="font-medium text-sm">{weekLabel(wk)}</span>
              <button
                onClick={() => selectWeek(weekDates)}
                className="text-xs px-2 py-1 rounded border"
                style={{
                  borderColor: weekAllSelected ? PALETTE.green : PALETTE.line,
                  color: weekAllSelected ? PALETTE.green : "#8A8271",
                }}
              >
                {weekAllSelected ? "✓ Semaine sélectionnée" : "Sélectionner la semaine"}
              </button>
            </div>
            <div className="divide-y" style={{ borderColor: PALETTE.line }}>
              {weekDates.map((date) => {
                const segments = segmentsFor(date);
                const abs = absenceFor(date);
                const present = segments.length > 0;
                const isSelected = selectedDates.includes(date);
                return (
                  <div
                    key={date}
                    className="p-3"
                    style={{ borderTop: `1px solid ${PALETTE.line}`, background: isSelected ? "#EFEADA" : "transparent" }}

                    <div className="flex items-center gap-2 flex-wrap mb-1.5">
                      <input
                        type="checkbox"
                        checked={isSelected}
                        onChange={() => toggleDateSelected(date)}
                        className="w-4 h-4 shrink-0"
                        style={{ accentColor: PALETTE.green }}
                        title="Sélectionner ce jour pour une application groupée"
                      />
                      <div className="min-w-[110px] text-sm font-medium capitalize">
                        {new Date(date + "T00:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })}
                      </div>
                      {segments.length <= 1 && (
                        <button
                          onClick={() => addSegment(date)}
                          className="text-xs px-2 py-1 rounded flex items-center gap-1"
                          style={{ border: `1px solid ${PALETTE.green}`, color: PALETTE.green }}
                        >
                          <Plus size={12} /> {present ? "Ajouter un poste" : "Marquer présent"}
                        </button>
                      )}
                      {!present && (
                        <>
                          <span className="text-xs italic" style={{ color: "#B5AA88" }}>
                            Absent
                          </span>
                          <select
                            value={abs?.motif ?? ""}
                            onChange={(e) => setMotif(date, e.target.value)}
                            className="px-2 py-1 rounded border text-xs"
                            style={{ borderColor: PALETTE.line, background: "#fff", color: "#6B6552" }}
                          >
                            <option value="">Motif (optionnel)</option>
                            {ABSENCE_MOTIFS.map((m) => (
                              <option key={m} value={m}>
                                {m}
                              </option>
                            ))}
                          </select>
                        </>
                      )}
                      {segments.length > 1 && (
                        <span className="text-xs" style={{ color: "#8A8271" }}>
                          {segments.length} postes — à modifier dans l'onglet Pointage
                        </span>
                      )}
                    </div>

                    {segments.length === 1 &&
                      segments.map((seg) => {
                        const separee = tachesEcart.includes(seg.tache);
                        return (
                          <div key={seg.id} className="flex items-center gap-2 flex-wrap ml-3 mt-1">
                            <select
                              value={seg.tache}
                              onChange={(e) => updateSegment(seg.id, { tache: e.target.value })}
                              className="px-2 py-1.5 rounded border text-sm min-w-[150px]"
                              style={{ borderColor: PALETTE.line, background: "#fff" }}
                            >
                              {taches.map((t) => (
                                <option key={t} value={t}>
                                  {t}
                                  {tachesEcart.includes(t) ? " ⚑" : ""}
                                </option>
                              ))}
                            </select>
                            <div className="flex items-center gap-1.5">
                              <input
                                type="number"
                                step="0.25"
                                min="0"
                                max="24"
                                value={seg.heuresEffectives ?? heuresDefaut}
                                onChange={(e) =>
                                  updateSegment(seg.id, {
                                    heuresEffectives: e.target.value,
                                    ...(separee ? {} : { heuresPayees: e.target.value }),
                                  })
                                }
                                className="w-20 px-2 py-1.5 rounded border text-sm"
                                style={{ borderColor: PALETTE.line, background: "#fff" }}
                              />
                              <span className="text-xs" style={{ color: "#8A8271" }}>
                                {separee ? "h eff." : "heures"}
                              </span>
                            </div>
                            {separee && (
                              <div className="flex items-center gap-1.5">
                                <input
                                  type="number"
                                  step="0.25"
                                  min="0"
                                  max="24"
                                  value={seg.heuresPayees ?? seg.heuresEffectives ?? heuresDefaut}
                                  onChange={(e) => updateSegment(seg.id, { heuresPayees: e.target.value })}
                                  className="w-20 px-2 py-1.5 rounded border text-sm"
                                  style={{ borderColor: PALETTE.rust, background: "#FBF0E9" }}
                                />
                                <span className="text-xs" style={{ color: PALETTE.rust }}>
                                  h payées
                                </span>
                              </div>
                            )}
                            <input
                              type="text"
                              placeholder="Parcelle"
                              value={seg.parcelle ?? ""}
                              onChange={(e) => updateSegment(seg.id, { parcelle: e.target.value })}
                              className="px-2 py-1.5 rounded border text-sm w-28"
                              style={{ borderColor: PALETTE.line, background: "#fff" }}
                            />
                            <button
                              onClick={() => removeSegment(seg.id)}
                              className="p-1.5 rounded hover:bg-black/5"
                              style={{ color: PALETTE.rust }}
                              title="Marquer absent (supprime ce poste)"
                            >
                              <Trash2 size={14} />
                            </button>
                          </div>
                        );
                      })}
                  </div>
                );
              })}
            </div>
          </div>
          );
        })}
      </div>
    </div>
  );
}


function Salaries({ employees, updateEmployees }) {
  const [nom, setNom] = useState("");
  const [poste, setPoste] = useState("");
  const [tauxHoraire, setTauxHoraire] = useState("");
  const [search, setSearch] = useState("");

  const addEmployee = () => {
    if (!nom.trim()) return;
    updateEmployees([
      ...employees,
      { id: uid(), nom: nom.trim(), poste: poste.trim(), tauxHoraire: tauxHoraire || "", typeContrat: "CDI", dateFinContrat: "", dateDebutContrat: "" },
    ]);
    setNom("");
    setPoste("");
    setTauxHoraire("");
  };

  const removeEmployee = (id) => {
    updateEmployees(employees.filter((e) => e.id !== id));
  };

  const updateRate = (id, value) => {
    updateEmployees(employees.map((e) => (e.id === id ? { ...e, tauxHoraire: value } : e)));
  };

  const updateField = (id, field, value) => {
    updateEmployees(employees.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const filtered = employees.filter((e) => {
    const q = search.trim().toLowerCase();
    if (!q) return true;
    return e.nom.toLowerCase().includes(q) || (e.poste || "").toLowerCase().includes(q);
  });

  const finProche = (dateFin) => {
    if (!dateFin) return false;
    const jours = Math.floor((new Date(dateFin + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
    return jours >= 0 && jours <= 30;

            style={{ borderColor: PALETTE.line }}
          />
          <input
            placeholder="Poste (ex: coupeur, tractoriste)"

            onChange={(e) => setPoste(e.target.value)}

          <input
            placeholder="Taux horaire (€, optionnel)"

            step="0.01"
            value={tauxHoraire}

            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addEmployee}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
          </button>
        </div>
      </div>

      {employees.length > 0 && (
        <input
          type="text"
          placeholder="Rechercher un salarié ou un poste..."

          onChange={(e) => setSearch(e.target.value)}

      {employees.length === 0 ? (

                {(emp.typeContrat === "CDD" || emp.typeContrat === "Saisonnier") && (

                {Number(emp.loyerMensuel) > 0 && (
                  <>
                    <span className="text-xs" style={{ color: "#8A8271" }}>

                    <input
                      type="date"

              <div className="flex items-center gap-2 flex-wrap pt-2" style={{ borderTop: `1px solid ${PALETTE.line}` }}>
                <span className="text-xs" style={{ color: "#8A8271" }}>

                </span>

                  const jours = emp.joursTravailHabituels && emp.joursTravailHabituels.length > 0 ? emp.joursTravailHabituels : [1, 2, 3, 4, 5];
                  const actif = jours.includes(j.n);
                  return (
                    <button
                      key={j.n}
                      onClick={() => {
                        const next = actif ? jours.filter((x) => x !== j.n) : [...jours, j.n].sort();
                        updateField(emp.id, "joursTravailHabituels", next);
                      }}
                      className="px-2 py-1 rounded-full text-xs border"
                      style={{
                        borderColor: actif ? PALETTE.green : PALETTE.line,
                        background: actif ? PALETTE.green : "#fff",

                    </button>
                  );
                })}

                </span>

  );
}

// ---------- Équipes (groupes fixes réutilisables) ----------
function Equipes({ employees, teams, updateTeams }) {
  const [nom, setNom] = useState("");
  const [membres, setMembres] = useState([]);
  const [editingId, setEditingId] = useState(null);

  const resetForm = () => {
    setNom("");
    setMembres([]);
    setEditingId(null);
  };

  const toggleMembre = (empId) => {
    setMembres((prev) => (prev.includes(empId) ? prev.filter((id) => id !== empId) : [...prev, empId]));
  };

  const saveTeam = () => {
    if (!nom.trim() || membres.length === 0) return;
    if (editingId) {
      updateTeams(teams.map((t) => (t.id === editingId ? { ...t, nom: nom.trim(), employeeIds: membres } : t)));
    } else {
      updateTeams([...teams, { id: uid(), nom: nom.trim(), employeeIds: membres }]);
    }
    resetForm();
  };

  const editTeam = (team) => {
    setEditingId(team.id);
    setNom(team.nom);
    setMembres(team.employeeIds);
  };

  const removeTeam = (id) => {
    updateTeams(teams.filter((t) => t.id !== id));
    if (editingId === id) resetForm();
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés » avant de créer des équipes." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">{editingId ? "Modifier l'équipe" : "Créer une équipe"}</h2>
        <input
          placeholder="Nom de l'équipe (ex: Équipe coupe)"
          value={nom}
          onChange={(e) => setNom(e.target.value)}
          className="px-3 py-2 rounded border text-sm w-full mb-3"
          style={{ borderColor: PALETTE.line }}
        />
        <div className="flex flex-wrap gap-2 mb-3">
          {employees.map((emp) => {
            const checked = membres.includes(emp.id);
            return (
              <button
                key={emp.id}
                onClick={() => toggleMembre(emp.id)}
                className="px-3 py-1.5 rounded-full text-sm border transition-colors"
                style={{
                  borderColor: checked ? PALETTE.green : PALETTE.line,
                  background: checked ? PALETTE.green : "#fff",
                  color: checked ? "#fff" : PALETTE.ink,
                }}
              >
                {emp.nom}
              </button>
            );
          })}
        </div>
        <div className="flex gap-2">
          <button
            onClick={saveTeam}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> {editingId ? "Enregistrer" : "Créer l'équipe"}
          </button>
          {editingId && (
            <button onClick={resetForm} className="px-4 py-2 rounded text-sm font-medium" style={{ color: "#8A8271" }}>
              Annuler
            </button>
          )}
        </div>
      </div>

      {teams.length === 0 ? (
        <EmptyState text="Aucune équipe pour le moment. Créez-en une ci-dessus pour pointer un groupe en un clic." />
      ) : (
        <div className="space-y-2">
          {teams.map((team) => (
            <div
              key={team.id}
              style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }}
              className="rounded-md p-3 flex items-center justify-between"
            >
              <div>
                <div className="font-medium">{team.nom}</div>
                <div className="text-xs" style={{ color: "#8A8271" }}>
                  {team.employeeIds
                    .map((id) => employees.find((e) => e.id === id)?.nom)
                    .filter(Boolean)
                    .join(", ")}
                </div>
              </div>
              <div className="flex gap-1">
                <button onClick={() => editTeam(team)} className="px-2 py-1 rounded hover:bg-black/5 text-xs" style={{ color: PALETTE.green }}>
                  Modifier
                </button>
                <button onClick={() => removeTeam(team.id)} className="p-2 rounded hover:bg-black/5" style={{ color: PALETTE.rust }}>
                  <Trash2 size={16} />
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ---------- Avances, acomptes et prêts ----------
const TX_TYPES = [
  { id: "avance", label: "Avance" },
  { id: "acompte", label: "Acompte" },
  { id: "pret", label: "Prêt" },
  { id: "remboursement", label: "Remboursement" },
];

const fmtEuros = (n) => `${Number(n).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;

function Avances({ employees, transactions, updateTransactions }) {
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || "");
  const [type, setType] = useState("avance");
  const [montant, setMontant] = useState("");
  const [mensualite, setMensualite] = useState("");
  const [date, setDate] = useState(todayISO());
  const [dateRemboursement, setDateRemboursement] = useState("");
  const [premiereEcheance, setPremiereEcheance] = useState("");
  const [note, setNote] = useState("");
  const [filterEmp, setFilterEmp] = useState("all");

  useEffect(() => {
    if (!employeeId && employees.length > 0) setEmployeeId(employees[0].id);
  }, [employees, employeeId]);

  const addTx = () => {
    if (!employeeId || !montant || Number(montant) <= 0) return;
    updateTransactions([
      ...transactions,
      {
        id: uid(),
        employeeId,
        type,
        montant: Number(montant),
        date,
        note: note.trim(),
        ...(dateRemboursement ? { dateRemboursement } : {}),
        ...(type === "pret" && mensualite ? { mensualite: Number(mensualite) } : {}),
        ...(type === "pret" && premiereEcheance ? { premiereEcheance } : {}),
      },
    ]);
    setMontant("");
    setMensualite("");
    setDateRemboursement("");
    setPremiereEcheance("");
    setNote("");
  };

  const removeTx = (id) => {
    updateTransactions(transactions.filter((t) => t.id !== id));
  };

  // Solde dû = avances + acomptes + prêts - remboursements, par salarié
  const balances = useMemo(() => {
    const map = {};
    for (const t of transactions) {
      if (t.type === "loyer") continue; // le loyer n'est pas une dette à rembourser
      if (!map[t.employeeId]) map[t.employeeId] = 0;
      map[t.employeeId] += t.type === "remboursement" ? -t.montant : t.montant;
    }
    return map;
  }, [transactions]);

  const totalDu = Object.values(balances).reduce((s, v) => s + v, 0);

  // Prêts avec mensualité, non totalement remboursés (remboursements comptés depuis la date du prêt)
  const addMonths = (iso, n) => addMonthsClamped(iso, n);

  // Échéancier complet par prêt : une échéance par mois jusqu'à épuration de la dette
  const pretsEnCours = useMemo(() => {
    return transactions
      .filter((t) => t.type === "pret" && t.mensualite)
      .map((pret) => {
        const rembourse = transactions
          .filter((t) => t.type === "remboursement" && t.employeeId === pret.employeeId && t.date >= pret.date)
          .reduce((s, t) => s + t.montant, 0);
        const restant = Math.max(0, pret.montant - rembourse);

        // Construit l'échéancier théorique : une échéance par mois, montant = mensualité (dernière = solde)
        // La première échéance est soit celle choisie manuellement, soit 1 mois après la date du prêt.
        const nbEcheances = Math.ceil(pret.montant / pret.mensualite);
        let cumulPaye = rembourse;
        const echeances = [];
        for (let n = 1; n <= nbEcheances; n++) {
          const dueDate = pret.premiereEcheance ? addMonths(pret.premiereEcheance, n - 1) : addMonths(pret.date, n);
          const montantEcheance = n < nbEcheances ? pret.mensualite : pret.montant - pret.mensualite * (nbEcheances - 1);
          let statut;
          if (cumulPaye >= montantEcheance - 0.01) {
            statut = "payee";
            cumulPaye -= montantEcheance;
          } else if (dueDate <= todayISO()) {
            statut = "retard";
          } else {
            statut = "avenir";
          }
          echeances.push({ n, dueDate, montant: montantEcheance, statut });
        }

        const enRetard = echeances.filter((e) => e.statut === "retard");
        const emp = employees.find((e) => e.id === pret.employeeId);
        return { pret, emp, rembourse, restant, echeances, enRetard };
      })
      .filter((p) => p.restant > 0 && p.emp);
  }, [transactions, employees]);

  const regulariser = (p) => {
    const additions = p.enRetard.map((e) => ({
      id: uid(),
      employeeId: p.pret.employeeId,
      type: "remboursement",
      montant: e.montant,
      date: e.dueDate,
      note: `Mensualité prêt — échéance du ${e.dueDate}`,
    }));
    updateTransactions([...transactions, ...additions]);
  };

  // Salariés avec un loyer automatique actif (informatif — géré dans l'onglet Salariés)
  const loyersActifs = employees.filter((emp) => Number(emp.loyerMensuel) > 0 && emp.loyerDebut);

  const filtered = transactions
    .filter((t) => filterEmp === "all" || t.employeeId === filterEmp)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const exportCSV = () => {
    const rows = [["Date", "Salarié", "Type", "Montant", "Note"]];
    filtered.forEach((t) => {
      const emp = employees.find((e) => e.id === t.employeeId);
      rows.push([t.date, emp?.nom || "?", TX_TYPES.find((x) => x.id === t.type)?.label || t.type, t.montant, t.note || ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "avances_acomptes_prets.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  if (employees.length === 0) {
    return <EmptyState text="Ajoutez d'abord vos salariés dans l'onglet « Salariés »." />;
  }

  return (
    <div>
      <div style={{ background: PALETTE.card, border: `1px solid ${PALETTE.line}` }} className="rounded-md p-4 mb-6">
        <h2 className="font-semibold mb-3">Nouvelle opération</h2>
        <div className="flex flex-wrap gap-2">
          <select
            value={employeeId}
            onChange={(e) => setEmployeeId(e.target.value)}
            className="px-2 py-2 rounded border text-sm min-w-[160px]"
            style={{ borderColor: PALETTE.line }}
          >
            {employees.map((emp) => (
              <option key={emp.id} value={emp.id}>
                {emp.nom}
              </option>
            ))}
          </select>
          <select
            value={type}
            onChange={(e) => setType(e.target.value)}
            className="px-2 py-2 rounded border text-sm"
            style={{ borderColor: PALETTE.line }}
          >
            {TX_TYPES.map((t) => (
              <option key={t.id} value={t.id}>
                {t.label}
              </option>
            ))}
          </select>
          <input
            type="number"
            step="0.01"
            min="0"
            placeholder="Montant (€)"
            value={montant}
            onChange={(e) => setMontant(e.target.value)}
            className="px-3 py-2 rounded border text-sm w-32"
            style={{ borderColor: PALETTE.line }}
          />
          {type === "pret" && (
            <input
              type="number"
              step="0.01"
              min="0"
              placeholder="Mensualité (€, optionnel)"
              value={mensualite}
              onChange={(e) => setMensualite(e.target.value)}
              className="px-3 py-2 rounded border text-sm w-40"
              style={{ borderColor: PALETTE.line }}
            />
          )}
          <div>
            <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
              Date de l'opération
            </label>
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              className="px-2 py-2 rounded border text-sm"
              style={{ borderColor: PALETTE.line }}
            />
          </div>
          {type !== "pret" && (
            <div>
              <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
                Déduite le (optionnel)
              </label>
              <input
                type="date"
                value={dateRemboursement}
                onChange={(e) => setDateRemboursement(e.target.value)}
                className="px-2 py-2 rounded border text-sm"
                style={{ borderColor: PALETTE.line }}
              />
            </div>
          )}
          {type === "pret" && mensualite && (
            <div>
              <label className="block text-xs mb-1" style={{ color: "#8A8271" }}>
                1ère échéance (optionnel)
              </label>
              <input
                type="date"
                value={premiereEcheance}
                onChange={(e) => setPremiereEcheance(e.target.value)}
                className="px-2 py-2 rounded border text-sm"
                style={{ borderColor: PALETTE.line }}
              />
            </div>
          )}
          <input
            type="text"
            placeholder="Note (optionnel)"
            value={note}
            onChange={(e) => setNote(e.target.value)}
            className="px-3 py-2 rounded border text-sm flex-1 min-w-[140px]"
            style={{ borderColor: PALETTE.line }}
          />
          <button
            onClick={addTx}
            style={{ background: PALETTE.green }}
            className="px-4 py-2 rounded text-white text-sm font-medium flex items-center gap-1.5"
          >
            <Plus size={16} /> Ajouter
